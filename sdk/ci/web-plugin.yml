name: Web plugin CI

on:
  push:
  pull_request:

env:
  PLUGIN_DIR: src/MyWebPlugin

jobs:
  test-validate-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/MyWebPlugin/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install dependencies
        working-directory: src/MyWebPlugin
        run: npm ci
      - name: Run Mock Host tests
        working-directory: src/MyWebPlugin
        run: npm test
      - name: Production validation
        shell: pwsh
        run: ./validate-plugin.ps1 -Path $env:PLUGIN_DIR
      - name: Deterministic package
        shell: pwsh
        run: ./pack-plugin.ps1 -PluginDir $env:PLUGIN_DIR
