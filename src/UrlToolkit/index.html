<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>URL 工具箱</title>
</head>
<body>
  <main class="long-page">
    <header class="long-page-header">
      <div>
        <div class="long-eyebrow">WEB UTILITY</div>
        <h1 class="long-page-title" data-i18n="page.title">URL 工具箱</h1>
        <p class="long-page-description" data-i18n="page.description">编码或还原 URL 组件，自动识别查询参数，全程本地处理。</p>
      </div>
      <span class="long-badge" id="stat">等待输入</span>
    </header>
    <section class="long-stack" id="toolSection" aria-label="URL 编解码工具">
      <div class="long-card long-field">
        <label class="long-field-label" for="input" data-i18n="field.input">输入内容</label>
        <textarea class="long-editor" id="input" placeholder="输入 URL、查询参数或普通文本…" autofocus></textarea>
      </div>
      <div class="long-toolbar">
        <button class="long-button long-button--primary btn-primary" id="encodeButton" type="button" data-i18n="action.encode">编码组件</button>
        <button class="long-button long-button--secondary btn-secondary" id="decodeButton" type="button" data-i18n="action.decode">解码</button>
        <button class="long-button long-button--secondary btn-secondary" id="pasteButton" type="button" data-i18n="action.paste">粘贴</button>
        <span class="long-toolbar__spacer"></span><span class="long-kbd">Ctrl Enter</span>
      </div>
      <div class="long-card long-field">
        <label class="long-field-label" for="output" data-i18n="field.output">结果</label>
        <textarea class="long-editor" id="output" placeholder="处理结果将在这里显示" readonly></textarea>
        <div class="long-toolbar"><div id="status" class="long-status" role="status" aria-live="polite"></div><span class="long-toolbar__spacer"></span><button class="long-button long-button--secondary btn-secondary" id="copyButton" type="button" data-i18n="action.copy" disabled>复制结果</button></div>
      </div>
    </section>
  </main>
  <script>
    const input = document.getElementById('input');
    const output = document.getElementById('output');
    const status = document.getElementById('status');
    const stat = document.getElementById('stat');
    const copyButton = document.getElementById('copyButton');
    let strings = {};
    let hasResult = false;
    let currentStatus = { key: '', fallback: '', values: {}, kind: '' };

    function t(key, fallback, values) {
      const template = strings[key] || fallback || key;
      return Object.entries(values || {}).reduce(function (text, entry) {
        return text.replaceAll('{' + entry[0] + '}', String(entry[1]));
      }, template);
    }

    function renderStat() {
      stat.textContent = hasResult
        ? t('stat.characters', '{count} 字符', {
            count: Array.from(output.value).length.toLocaleString(document.documentElement.lang)
          })
        : t('page.waiting', '等待输入');
    }

    function setStatus(key, kind, fallback, values) {
      currentStatus = { key, kind, fallback, values: values || {} };
      const message = t(key, fallback, currentStatus.values);
      status.textContent = message;
      status.className = 'long-status ' + (kind ? 'long-status--' + kind : '');
      if (message) window.LongUI?.announce(message);
      return message;
    }

    function applyLocalization(message) {
      strings = message.resources || {};
      document.documentElement.lang = message.resolved_language || 'zh-CN';
      document.title = t('plugin.name', 'URL 工具箱');
      document.querySelectorAll('[data-i18n]').forEach(function (element) {
        element.textContent = t(element.dataset.i18n, element.textContent);
      });
      document.getElementById('toolSection').setAttribute(
        'aria-label',
        t('tool.ariaLabel', 'URL 编解码工具'));
      input.placeholder = t(
        'field.inputPlaceholder',
        '输入 URL、查询参数或普通文本…');
      output.placeholder = t(
        'field.outputPlaceholder',
        '处理结果将在这里显示');
      renderStat();
      if (currentStatus.key) {
        setStatus(
          currentStatus.key,
          currentStatus.kind,
          currentStatus.fallback,
          currentStatus.values);
      }
    }

    function clearResult() {
      output.value = '';
      hasResult = false;
      copyButton.disabled = true;
      renderStat();
    }

    function invalidateResult() {
      clearResult();
      setStatus('', '', '');
    }

    function transform(mode) {
      clearResult();
      if (input.value.length === 0) {
        const message = setStatus('error.emptyInput', 'danger', '请输入要处理的内容');
        return { success: false, message: message, outputs: {} };
      }
      try {
        const transformed = mode === 'decode'
          ? decodeURIComponent(input.value.replace(/\+/g, ' '))
          : encodeURIComponent(input.value);
        if (transformed.length > 65536) {
          setStatus('error.outputTooLong', 'danger', '处理结果超过 65,536 个字符，无法作为命令输出');
          return {
            success: false,
            message: t('error.commandOutputTooLong', 'URL 处理结果超过命令输出上限'),
            outputs: {}
          };
        }
        output.value = transformed;
        hasResult = true;
        copyButton.disabled = false;
        renderStat();
        const message = mode === 'decode'
          ? setStatus('status.decoded', 'success', 'URL 解码完成')
          : setStatus('status.encoded', 'success', 'URL 编码完成');
        return {
          success: true,
          message: message,
          outputs: { result: { type: 'text', value: output.value } }
        };
      } catch (error) {
        const message = mode === 'decode'
          ? setStatus('error.decode', 'danger', '内容不是有效的 URL 编码')
          : setStatus('error.encode', 'danger', '内容包含无法进行 URL 编码的字符');
        return { success: false, message: message, outputs: {} };
      }
    }
    async function paste() { try { const result = await long.clipboard.getText(); if (result.success) { input.value = result.data || ''; invalidateResult(); if (!input.value) setStatus('error.clipboardEmpty', 'danger', '剪贴板中没有文本'); } else setStatus('error.clipboardRead', 'danger', '无法读取剪贴板'); } catch (_) { setStatus('error.clipboardRead', 'danger', '无法读取剪贴板'); } }
    async function copy() { if (!output.value) return; try { const response = await long.clipboard.setText(output.value); if (!response || !response.success) throw new Error(response && response.error); setStatus('status.copied', 'success', '结果已复制'); } catch (_) { setStatus('error.copy', 'danger', '复制失败'); } }
    document.getElementById('encodeButton').addEventListener('click', function () { transform('encode'); });
    document.getElementById('decodeButton').addEventListener('click', function () { transform('decode'); });
    document.getElementById('pasteButton').addEventListener('click', paste);
    document.getElementById('copyButton').addEventListener('click', copy);
    input.addEventListener('input', invalidateResult);
    document.addEventListener('keydown', function (event) { if (event.ctrlKey && event.key === 'Enter') { event.preventDefault(); transform(event.shiftKey ? 'decode' : 'encode'); } });
    window.LongUI?.onCommand(function (command) { input.value = window.LongUI.commandText(command) || ''; return transform(command.command_id === 'url.decode' ? 'decode' : 'encode'); });
    window.chrome?.webview?.addEventListener('message', function ({ data }) {
      if (data?.type === 'long.language-changed') applyLocalization(data);
    });
  </script>
</body>
</html>
