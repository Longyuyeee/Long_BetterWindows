<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>Markdown 预览</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,system-ui,sans-serif;display:flex;height:100vh;background:#f5f5f7}
#editor{width:50%;padding:16px;border-right:1px solid #e0e0e0;display:flex;flex-direction:column}
#preview{width:50%;padding:24px;overflow-y:auto;background:#fff;line-height:1.8;font-size:14px}
h1{font-size:22px;border-bottom:2px solid #007AFF;padding-bottom:6px;color:#007AFF;margin:16px 0 8px}
h2{font-size:17px;color:#007AFF;margin:14px 0 6px}
h3{font-size:14px;margin:12px 0 4px}
code{background:#f0f0f5;padding:2px 6px;border-radius:4px;font-size:13px;font-family:monospace}
pre{background:#f5f5f7;padding:14px;border-radius:8px;overflow-x:auto;font-size:13px;line-height:1.5;margin:8px 0}
pre code{background:none;padding:0}
blockquote{border-left:3px solid #007AFF;padding-left:14px;color:#666;margin:8px 0}
table{border-collapse:collapse;width:100%;margin:8px 0}
th,td{border:1px solid #e0e0e0;padding:8px 12px;text-align:left;font-size:13px}
th{background:#f5f5f7}
textarea{flex:1;border:1px solid #e0e0e0;border-radius:8px;padding:12px;font-family:monospace;font-size:13px;line-height:1.6;resize:none}
textarea:focus{outline:none;border-color:#007AFF}
.btn-row{display:flex;gap:8px;margin-bottom:8px}
button{padding:6px 14px;border:none;border-radius:6px;font-size:12px;cursor:pointer;font-weight:500}
.btn-primary{background:#007AFF;color:#fff}.btn-primary:hover{background:#0062CC}
.btn-secondary{background:#f0f0f0;color:#333}.btn-secondary:hover{background:#e0e0e0}
</style></head><body>
<div id="editor">
  <div class="btn-row">
    <button class="btn-primary" onclick="renderMd()">预览</button>
    <button class="btn-secondary" onclick="pasteMd()">粘贴</button>
    <button class="btn-secondary" onclick="copyHtml()">复制 HTML</button>
    <span style="font-size:11px;color:#888;margin-left:8px">实时渲染</span>
  </div>
  <textarea id="input" oninput="renderMd()" placeholder="# 输入 Markdown...
## 二级标题
**粗体** *斜体* `代码`
- 列表项
> 引用
[链接](url)"></textarea>
</div>
<div id="preview"></div>
<script>
function renderMd(){
  var md=document.getElementById('input').value;
  var html=md
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/^### (.+)$/gm,'<h3>$1</h3>')
    .replace(/^## (.+)$/gm,'<h2>$1</h2>')
    .replace(/^# (.+)$/gm,'<h1>$1</h1>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/```(\w*)\n?([\s\S]*?)```/g,'<pre><code>$2</code></pre>')
    .replace(/^- (.+)$/gm,'<li>$1</li>')
    .replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>')
    .replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2">$1</a>')
    .replace(/^---$/gm,'<hr>')
    .replace(/\n\n/g,'</p><p>')
    .replace(/^(.+)$/gm,'<p>$1</p>');
  document.getElementById('preview').innerHTML=html;
}
async function pasteMd(){var r=await long.clipboard.getText();if(r.success)document.getElementById('input').value=r.data;renderMd()}
async function copyHtml(){var h=document.getElementById('preview').innerHTML;await long.clipboard.setText(h)}
renderMd();
</script></body></html>
