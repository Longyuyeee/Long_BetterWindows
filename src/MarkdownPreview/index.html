<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Markdown 预览</title>
</head>
<body>
  <main class="long-page">
    <header class="long-page-header">
      <div>
        <div class="long-eyebrow">DOCUMENT</div>
        <h1 class="long-page-title" data-i18n="page.title">Markdown 预览</h1>
        <p class="long-page-description" data-i18n="page.description">安全地实时预览 Markdown，链接仅允许常见可信协议。</p>
      </div>
      <span class="long-badge" data-i18n="page.localBadge">本地渲染</span>
    </header>

    <div class="long-toolbar">
      <button class="long-button long-button--primary btn-primary" id="pasteButton" type="button" data-i18n="action.paste">粘贴 Markdown</button>
      <button class="long-button long-button--secondary btn-secondary" id="copyButton" type="button" data-i18n="action.copy" disabled>复制 HTML</button>
      <button class="long-button long-button--secondary btn-secondary" id="clearButton" type="button" data-i18n="action.clear">清空</button>
      <span class="long-toolbar__spacer"></span>
      <span class="long-secondary" data-i18n="page.livePreview">实时预览</span>
    </div>

    <section class="long-grid long-toolbar--spaced" id="editorSection" aria-label="Markdown 编辑和预览">
      <div class="long-card long-field">
        <label class="long-field-label" for="input" data-i18n="field.input">Markdown</label>
        <textarea class="long-editor" id="input" placeholder="# 标题

使用 **粗体**、`代码`、列表和引用…" autofocus></textarea>
      </div>
      <article class="long-card long-markdown" id="preview" aria-label="Markdown 预览结果" tabindex="0"></article>
    </section>
    <div class="long-status" id="status" role="status" aria-live="polite"></div>
  </main>

  <script>
    const input = document.getElementById('input');
    const preview = document.getElementById('preview');
    const status = document.getElementById('status');
    const copyButton = document.getElementById('copyButton');
    let strings = {};
    let previewEmpty = true;
    let currentStatus = { key: '', fallback: '', kind: '' };

    function t(key, fallback) {
      return strings[key] || fallback || key;
    }

    function setStatus(key, kind, fallback) {
      currentStatus = { key, kind, fallback: fallback || '' };
      const message = key ? t(key, fallback) : currentStatus.fallback;
      status.textContent = message;
      status.className = 'long-status ' + (kind ? 'long-status--' + kind : '');
      if (message) window.LongUI?.announce(message);
      return message;
    }

    function renderEmptyState() {
      window.LongUI?.renderState(preview, {
        kind: 'empty',
        title: t('state.empty', '等待 Markdown 内容'),
        detail: t('state.emptyDetail', '在左侧输入内容后，这里会显示预览')
      });
    }

    function clearStatus() {
      currentStatus = { key: '', fallback: '', kind: '' };
      status.textContent = '';
      status.className = 'long-status';
    }

    function applyLocalization(message) {
      strings = message.resources || {};
      document.documentElement.lang = message.resolved_language || 'zh-CN';
      document.title = t('plugin.name', 'Markdown 预览');
      document.querySelectorAll('[data-i18n]').forEach(function (element) {
        element.textContent = t(element.dataset.i18n, element.textContent);
      });
      document.getElementById('editorSection').setAttribute(
        'aria-label',
        t('editor.ariaLabel', 'Markdown 编辑和预览'));
      input.placeholder = t(
        'field.inputPlaceholder',
        '# 标题\n\n使用 **粗体**、`代码`、列表和引用…');
      preview.setAttribute(
        'aria-label',
        t('preview.ariaLabel', 'Markdown 预览结果'));
      if (previewEmpty) renderEmptyState();
      if (currentStatus.key || currentStatus.fallback) {
        setStatus(
          currentStatus.key,
          currentStatus.kind,
          currentStatus.fallback);
      }
    }

    function render() {
      preview.replaceChildren();
      const lines = input.value.replace(/\r\n/g, '\n').split('\n');
      let codeBlock = null;
      let list = null;
      for (let index = 0; index < lines.length; index += 1) {
        const line = lines[index];
        if (line.startsWith('```')) {
          if (codeBlock) { preview.appendChild(codeBlock); codeBlock = null; }
          else { codeBlock = document.createElement('pre'); codeBlock.appendChild(document.createElement('code')); }
          list = null;
          continue;
        }
        if (codeBlock) {
          codeBlock.firstChild.textContent += (codeBlock.firstChild.textContent ? '\n' : '') + line;
          continue;
        }
        if (!line.trim()) { list = null; continue; }
        if (line === '---') { preview.appendChild(document.createElement('hr')); list = null; continue; }
        const headerCells = parseTableCells(line);
        if (headerCells.length > 0
            && index + 1 < lines.length
            && isTableDelimiter(lines[index + 1], headerCells.length)) {
          const table = document.createElement('table');
          const head = document.createElement('thead');
          const headRow = document.createElement('tr');
          headerCells.forEach(function (cell) {
            const heading = document.createElement('th');
            appendInline(heading, cell);
            headRow.appendChild(heading);
          });
          head.appendChild(headRow);
          table.appendChild(head);
          const body = document.createElement('tbody');
          index += 2;
          while (index < lines.length && lines[index].trim()) {
            const cells = parseTableCells(lines[index]);
            if (cells.length !== headerCells.length) break;
            const row = document.createElement('tr');
            cells.forEach(function (cell) {
              const value = document.createElement('td');
              appendInline(value, cell);
              row.appendChild(value);
            });
            body.appendChild(row);
            index += 1;
          }
          table.appendChild(body);
          preview.appendChild(table);
          index -= 1;
          list = null;
          continue;
        }
        const heading = line.match(/^(#{1,3})\s+(.+)$/);
        if (heading) {
          const element = document.createElement('h' + heading[1].length);
          appendInline(element, heading[2]); preview.appendChild(element); list = null; continue;
        }
        if (line.startsWith('> ')) {
          const quote = document.createElement('blockquote'); appendInline(quote, line.slice(2)); preview.appendChild(quote); list = null; continue;
        }
        if (/^-\s+/.test(line)) {
          if (!list) { list = document.createElement('ul'); preview.appendChild(list); }
          const item = document.createElement('li'); appendInline(item, line.replace(/^-\s+/, '')); list.appendChild(item); continue;
        }
        const paragraph = document.createElement('p'); appendInline(paragraph, line); preview.appendChild(paragraph); list = null;
      }
      if (codeBlock) preview.appendChild(codeBlock);
      previewEmpty = !preview.childNodes.length;
      copyButton.disabled = previewEmpty;
      if (previewEmpty) renderEmptyState();
    }

    function parseTableCells(line) {
      if (!line.includes('|')) return [];
      return line.trim().replace(/^\|/, '').replace(/\|$/, '')
        .split('|').map(function (cell) { return cell.trim(); });
    }

    function isTableDelimiter(line, expectedCells) {
      const cells = parseTableCells(line);
      return cells.length === expectedCells
        && cells.every(function (cell) { return /^:?-{3,}:?$/.test(cell); });
    }

    function appendInline(parent, text) {
      const pattern = /(`[^`]+`|\*\*[^*]+\*\*|\*[^*]+\*|\[[^\]]+\]\([^)]+\))/g;
      let offset = 0, match;
      while ((match = pattern.exec(text))) {
        parent.appendChild(document.createTextNode(text.slice(offset, match.index)));
        const token = match[0];
        let element;
        if (token.startsWith('`')) { element = document.createElement('code'); element.textContent = token.slice(1, -1); }
        else if (token.startsWith('**')) { element = document.createElement('strong'); element.textContent = token.slice(2, -2); }
        else if (token.startsWith('*')) { element = document.createElement('em'); element.textContent = token.slice(1, -1); }
        else {
          const link = token.match(/^\[([^\]]+)\]\(([^)]+)\)$/);
          element = document.createElement('span');
          if (link && isSafeUrl(link[2])) {
            element = document.createElement('a'); element.href = link[2]; element.textContent = link[1]; element.target = '_blank'; element.rel = 'noopener noreferrer';
          } else element.textContent = link ? link[1] : token;
        }
        parent.appendChild(element);
        offset = pattern.lastIndex;
      }
      parent.appendChild(document.createTextNode(text.slice(offset)));
    }

    function isSafeUrl(value) {
      try {
        const url = new URL(value.trim());
        return ['http:', 'https:', 'mailto:'].includes(url.protocol);
      } catch (_) { return false; }
    }

    async function paste() {
      try {
        const response = await long.clipboard.getText();
        if (response.success) {
          input.value = response.data || '';
          render();
          clearStatus();
          if (!input.value.trim()) setStatus('error.clipboardEmpty', 'danger', '剪贴板中没有文本内容');
          input.focus();
        }
        else setStatus('', 'danger', response.error || t('error.clipboardRead', '无法读取剪贴板'));
      } catch (_) {
        setStatus('error.clipboardRead', 'danger', '无法读取剪贴板');
      }
    }

    async function copyHtml() {
      if (previewEmpty) {
        setStatus('error.emptyPreview', 'danger', '没有可复制的预览内容');
        return;
      }
      try {
        const response = await long.clipboard.setText(preview.innerHTML);
        if (response.success) setStatus('status.copied', 'success', 'HTML 已复制');
        else setStatus('', 'danger', response.error || t('error.copy', '复制失败'));
      } catch (_) {
        setStatus('error.copy', 'danger', '复制失败');
      }
    }

    input.addEventListener('input', function () { render(); clearStatus(); });
    document.getElementById('pasteButton').addEventListener('click', paste);
    document.getElementById('copyButton').addEventListener('click', copyHtml);
    document.getElementById('clearButton').addEventListener('click', function () { input.value = ''; render(); clearStatus(); input.focus(); });
    document.addEventListener('keydown', function (event) {
      if (event.ctrlKey && event.key === 'Enter') { event.preventDefault(); render(); preview.focus(); setStatus('status.refreshed', 'success', '预览已刷新'); }
      else if (event.ctrlKey && event.shiftKey && event.key.toLocaleLowerCase() === 'c') { event.preventDefault(); copyHtml(); }
    });
    window.LongUI?.onCommand(function (command) {
      const text = window.LongUI.commandText(command);
      if (text) input.value = text;
      render(); input.focus();
      return {
        success: true,
        message: t('status.commandReady', 'Markdown 预览已就绪'),
        outputs: {}
      };
    });
    window.chrome?.webview?.addEventListener('message', function ({ data }) {
      if (data?.type === 'long.language-changed') applyLocalization(data);
    });
    render();
  </script>
</body>
</html>
