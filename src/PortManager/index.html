<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>端口管理器</title>
</head>
<body>
  <main class="long-page long-page--wide">
    <header class="long-page-header">
      <div>
        <div class="long-eyebrow">NETWORK PORTS</div>
        <h1 class="long-page-title">端口管理器</h1>
        <p class="long-page-description">查看本机端口占用与关联进程，终止进程前需要再次确认。</p>
      </div>
      <div class="long-toolbar">
        <span class="long-badge" id="refreshBadge">等待首次刷新</span>
        <button class="long-button long-button--primary btn-primary" id="refreshButton" type="button">立即刷新</button>
      </div>
    </header>

    <div class="long-stack">
      <section class="long-stack" aria-label="端口筛选">
        <div class="long-toolbar">
          <input class="long-toolbar__field" id="searchInput" type="search" placeholder="搜索端口、地址、进程或 PID" aria-label="搜索端口">
          <label class="long-option">
            <input id="autoRefreshToggle" type="checkbox" checked>
            <span>自动刷新</span>
          </label>
        </div>

        <div class="long-toolbar">
          <nav class="long-segment" aria-label="端口类型">
            <button type="button" data-tab="tcp" aria-selected="true">TCP 监听</button>
            <button type="button" data-tab="connections" aria-selected="false">TCP 连接</button>
            <button type="button" data-tab="udp" aria-selected="false">UDP 端点</button>
          </nav>
          <span class="long-toolbar__spacer"></span>
          <span class="long-badge long-badge--neutral" id="tcpListeners">TCP 监听 0</span>
          <span class="long-badge long-badge--neutral" id="tcpConnections">TCP 连接 0</span>
          <span class="long-badge long-badge--neutral" id="udpEndpoints">UDP 端点 0</span>
        </div>
      </section>

      <section class="long-stack" aria-labelledby="listTitle">
        <h2 class="long-section-title" id="listTitle">TCP 监听</h2>
        <div class="long-data-grid" role="table" aria-label="端口与关联进程" style="--long-data-columns: .7fr 1.15fr 1.15fr .65fr .85fr 1.35fr 1fr">
          <div role="rowgroup">
            <div class="long-data-grid__header" role="row">
              <div role="columnheader">端口</div>
              <div role="columnheader">本地地址</div>
              <div role="columnheader">远程地址</div>
              <div role="columnheader">协议</div>
              <div role="columnheader">状态</div>
              <div role="columnheader">进程</div>
              <div role="columnheader">操作</div>
            </div>
          </div>
          <div id="portRows" role="rowgroup"></div>
        </div>
      </section>

      <section class="long-card long-stack" aria-labelledby="findTitle">
        <h2 class="long-section-title" id="findTitle">查找端口占用</h2>
        <div class="long-toolbar">
          <input id="portNumber" type="number" min="1" max="65535" placeholder="端口号 1-65535" aria-label="端口号">
          <select id="portProtocol" aria-label="端口协议">
            <option value="tcp">TCP</option>
            <option value="udp">UDP</option>
          </select>
          <button class="long-button long-button--primary btn-primary" id="findButton" type="button">查找</button>
        </div>
        <div class="long-result long-result--body" id="findResult" role="status" aria-live="polite" hidden></div>
      </section>

      <div class="long-status" id="status" role="status" aria-live="polite"></div>
    </div>
  </main>

  <dialog class="long-dialog" id="killDialog" aria-labelledby="killDialogTitle">
    <div class="long-dialog__header">
      <h2 class="long-dialog__title" id="killDialogTitle">确认终止进程</h2>
    </div>
    <div class="long-dialog__body">
      <p id="killDialogMessage"></p>
      <p class="long-status long-status--warning">终止进程可能导致未保存的数据丢失或相关服务中断。</p>
    </div>
    <div class="long-dialog__actions">
      <button class="long-button long-button--secondary btn-secondary" id="cancelKillButton" type="button">取消</button>
      <button class="long-button" id="confirmKillButton" type="button">终止进程</button>
    </div>
  </dialog>

  <script>
    const refreshInterval = 5000;
    const refreshButton = document.getElementById('refreshButton');
    const searchInput = document.getElementById('searchInput');
    const autoRefreshToggle = document.getElementById('autoRefreshToggle');
    const portRows = document.getElementById('portRows');
    const status = document.getElementById('status');
    const findResult = document.getElementById('findResult');
    const killDialog = document.getElementById('killDialog');
    const confirmKillButton = document.getElementById('confirmKillButton');
    let currentTab = 'tcp';
    let allPorts = { tcp: [], connections: [], udp: [] };
    let refreshTimer = 0;
    let refreshPromise = null;
    let hasLoaded = false;
    let pendingProcess = null;

    async function initialize() {
      window.LongUI?.renderState(portRows, {
        kind: 'loading',
        title: '正在加载端口信息'
      });
      await refreshPorts(false);
      startPolling();
    }

    function refreshPorts(manual) {
      if (refreshPromise) return refreshPromise;
      refreshPromise = performRefresh(!!manual).finally(function () {
        refreshPromise = null;
      });
      return refreshPromise;
    }

    async function performRefresh(manual) {
      window.LongUI?.setBusy(refreshButton, true);
      try {
        const results = await Promise.all([
          long.networkPort.getTcpListeners(),
          long.networkPort.getTcpConnections(),
          long.networkPort.getUdpEndpoints()
        ]);
        allPorts = {
          tcp: normalizePorts(unwrap(results[0], 'TCP 监听加载失败')),
          connections: normalizePorts(unwrap(results[1], 'TCP 连接加载失败')),
          udp: normalizePorts(unwrap(results[2], 'UDP 端点加载失败'))
        };
        hasLoaded = true;
        updateStats();
        renderPorts();
        document.getElementById('refreshBadge').textContent =
          '更新于 ' + new Date().toLocaleTimeString([], { hour12: false });
        if (manual) setStatus('端口信息已刷新', 'success');
        return true;
      } catch (error) {
        const detail = errorMessage(error, '端口信息加载失败');
        if (!hasLoaded) {
          window.LongUI?.renderState(portRows, {
            kind: 'error',
            title: '端口信息加载失败',
            detail: detail,
            actionLabel: '重试',
            onAction: function () { void refreshPorts(true); }
          });
        }
        setStatus(detail, 'danger');
        return false;
      } finally {
        window.LongUI?.setBusy(refreshButton, false);
      }
    }

    function normalizePorts(value) {
      return (Array.isArray(value) ? value : [])
        .filter(function (port) { return port && Number.isInteger(Number(port.LocalPort)); })
        .sort(function (left, right) { return Number(left.LocalPort) - Number(right.LocalPort); });
    }

    function updateStats() {
      document.getElementById('tcpListeners').textContent = 'TCP 监听 ' + allPorts.tcp.length;
      document.getElementById('tcpConnections').textContent = 'TCP 连接 ' + allPorts.connections.length;
      document.getElementById('udpEndpoints').textContent = 'UDP 端点 ' + allPorts.udp.length;
    }

    function renderPorts() {
      const query = searchInput.value.trim().toLocaleLowerCase();
      const source = allPorts[currentTab] || [];
      const visible = source.filter(function (port) {
        if (!query) return true;
        return [
          port.LocalPort,
          port.LocalAddress,
          port.RemotePort,
          port.RemoteAddress,
          port.ProcessId,
          port.ProcessName,
          port.Protocol,
          port.State
        ].some(function (value) {
          return String(value ?? '').toLocaleLowerCase().includes(query);
        });
      });

      portRows.replaceChildren();
      document.getElementById('listTitle').textContent = tabTitle(currentTab);
      if (!visible.length) {
        window.LongUI?.renderState(portRows, {
          kind: 'empty',
          title: query ? '没有匹配的端口' : '暂无端口信息',
          detail: query ? '请尝试其他端口、地址、进程名称或 PID' : ''
        });
        return;
      }

      visible.forEach(function (port) {
        const row = document.createElement('div');
        row.className = 'long-data-grid__row';
        row.setAttribute('role', 'row');
        appendDataCell(row, '端口', port.LocalPort, 'long-code');
        appendDataCell(row, '本地地址', endpoint(port.LocalAddress, port.LocalPort), 'long-code');
        appendDataCell(
          row,
          '远程地址',
          port.RemotePort ? endpoint(port.RemoteAddress, port.RemotePort) : '--',
          'long-code');

        const protocolCell = createDataCell('协议');
        protocolCell.appendChild(createBadge(
          port.Protocol || (currentTab === 'udp' ? 'UDP' : 'TCP'),
          currentTab === 'udp' ? 'success' : 'neutral'));
        row.appendChild(protocolCell);

        const stateCell = createDataCell('状态');
        stateCell.appendChild(createBadge(port.State || '--', stateKind(port.State)));
        row.appendChild(stateCell);

        const processCell = createDataCell('进程');
        appendText(processCell, 'div', 'long-code', port.ProcessName || '未知进程');
        appendText(
          processCell,
          'div',
          'long-muted',
          Number(port.ProcessId) > 0 ? 'PID ' + port.ProcessId : 'PID 不可用');
        row.appendChild(processCell);

        const actionsCell = createDataCell('操作');
        const actions = document.createElement('div');
        actions.className = 'long-toolbar';
        const copyButton = createActionButton('复制', function () { void copyPort(port); });
        actions.appendChild(copyButton);
        if (Number(port.ProcessId) > 0) {
          const killButton = createActionButton('终止', function () { openKillDialog(port); });
          killButton.setAttribute(
            'aria-label',
            '终止进程 ' + (port.ProcessName || port.ProcessId));
          actions.appendChild(killButton);
        }
        actionsCell.appendChild(actions);
        row.appendChild(actionsCell);
        portRows.appendChild(row);
      });
    }

    function createDataCell(label) {
      const cell = document.createElement('div');
      cell.className = 'long-data-grid__cell';
      cell.dataset.label = label;
      cell.setAttribute('role', 'cell');
      return cell;
    }

    function appendDataCell(parent, label, value, className) {
      const cell = createDataCell(label);
      appendText(cell, 'span', className || '', value);
      parent.appendChild(cell);
      return cell;
    }

    function createBadge(text, kind) {
      const badge = document.createElement('span');
      badge.className = 'long-badge' + (kind ? ' long-badge--' + kind : '');
      badge.textContent = String(text || '--');
      return badge;
    }

    function createActionButton(label, action) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'long-button long-button--small';
      button.textContent = label;
      button.addEventListener('click', action);
      return button;
    }

    async function copyPort(port) {
      const text = endpoint(port.LocalAddress, port.LocalPort) +
        (port.ProcessName ? ' · ' + port.ProcessName + ' (PID ' + port.ProcessId + ')' : '');
      try {
        unwrap(await long.clipboard.setText(text), '端口信息复制失败');
        setStatus('端口信息已复制', 'success');
      } catch (error) {
        setStatus(errorMessage(error, '端口信息复制失败'), 'danger');
      }
    }

    function openKillDialog(port) {
      if (!Number(port.ProcessId)) {
        setStatus('此端口没有可用的进程标识，无法终止', 'warning');
        return;
      }
      pendingProcess = {
        id: Number(port.ProcessId),
        name: port.ProcessName || '未知进程'
      };
      document.getElementById('killDialogMessage').textContent =
        '将终止进程 ' + pendingProcess.name + '（PID ' + pendingProcess.id + '）。';
      killDialog.showModal();
      confirmKillButton.focus();
    }

    async function confirmKill() {
      if (!pendingProcess) return;
      const target = pendingProcess;
      window.LongUI?.setBusy(confirmKillButton, true);
      try {
        unwrap(await long.process.kill(target.id), '终止进程失败');
        killDialog.close();
        pendingProcess = null;
        setStatus('进程 ' + target.name + ' 已终止', 'success');
        await refreshPorts(false);
      } catch (error) {
        setStatus(errorMessage(error, '终止进程失败'), 'danger');
      } finally {
        window.LongUI?.setBusy(confirmKillButton, false);
      }
    }

    async function findPort() {
      const port = Number(document.getElementById('portNumber').value);
      const protocol = document.getElementById('portProtocol').value;
      if (!Number.isInteger(port) || port < 1 || port > 65535) {
        showFindMessage('请输入 1 到 65535 之间的有效端口号', 'danger');
        return false;
      }

      window.LongUI?.setBusy(document.getElementById('findButton'), true);
      try {
        const owner = unwrap(
          await long.networkPort.findOwner(port, protocol),
          '端口占用查询失败');
        if (!owner) {
          showFindMessage(protocol.toUpperCase() + ' 端口 ' + port + ' 当前未被占用', 'success');
          return true;
        }
        showFindOwner(owner);
        return true;
      } catch (error) {
        showFindMessage(errorMessage(error, '端口占用查询失败'), 'danger');
        return false;
      } finally {
        window.LongUI?.setBusy(document.getElementById('findButton'), false);
      }
    }

    function showFindOwner(owner) {
      findResult.hidden = false;
      findResult.replaceChildren();
      appendText(findResult, 'div', 'long-section-title', '端口已被占用');
      appendText(
        findResult,
        'div',
        'long-secondary',
        endpoint(owner.LocalAddress, owner.LocalPort) + ' · ' + (owner.Protocol || 'TCP'));
      appendText(
        findResult,
        'div',
        'long-secondary',
        (owner.ProcessName || '未知进程') +
          (Number(owner.ProcessId) > 0 ? ' · PID ' + owner.ProcessId : ' · PID 不可用'));
      setStatus('已找到端口占用信息', 'success');
    }

    function showFindMessage(message, kind) {
      findResult.hidden = false;
      findResult.replaceChildren();
      appendText(findResult, 'div', 'long-status long-status--' + kind, message);
      setStatus(message, kind);
    }

    function selectTab(tab) {
      currentTab = tab;
      document.querySelectorAll('[data-tab]').forEach(function (button) {
        button.setAttribute('aria-selected', String(button.dataset.tab === tab));
      });
      renderPorts();
    }

    function startPolling() {
      stopPolling();
      if (autoRefreshToggle.checked && !document.hidden) {
        refreshTimer = window.setInterval(function () { void refreshPorts(false); }, refreshInterval);
      }
    }

    function stopPolling() {
      window.clearInterval(refreshTimer);
      refreshTimer = 0;
    }

    function tabTitle(tab) {
      if (tab === 'connections') return 'TCP 连接';
      if (tab === 'udp') return 'UDP 端点';
      return 'TCP 监听';
    }

    function stateKind(value) {
      const state = String(value || '').toLocaleUpperCase();
      if (state === 'LISTENING' || state === 'ESTABLISHED') return 'success';
      if (state.includes('WAIT') || state === 'CLOSING') return 'warning';
      return 'neutral';
    }

    function endpoint(address, port) {
      const host = String(address || '*');
      return (host.includes(':') && !host.startsWith('[') ? '[' + host + ']' : host) +
        ':' + String(port || 0);
    }

    function appendText(parent, tagName, className, text) {
      const element = document.createElement(tagName);
      if (className) element.className = className;
      element.textContent = String(text ?? '');
      parent.appendChild(element);
      return element;
    }

    function unwrap(response, fallback) {
      if (!response || !response.success) {
        throw new Error(response && response.error ? response.error : fallback);
      }
      return response.data;
    }

    function errorMessage(error, fallback) {
      return error && error.message ? error.message : fallback;
    }

    function setStatus(message, kind) {
      status.textContent = message;
      status.className = 'long-status ' + (kind ? 'long-status--' + kind : '');
      window.LongUI?.announce(message);
    }

    refreshButton.addEventListener('click', function () { void refreshPorts(true); });
    document.getElementById('findButton').addEventListener('click', function () { void findPort(); });
    document.getElementById('portNumber').addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        void findPort();
      }
    });
    document.querySelectorAll('[data-tab]').forEach(function (button) {
      button.addEventListener('click', function () { selectTab(button.dataset.tab); });
    });
    searchInput.addEventListener('input', renderPorts);
    autoRefreshToggle.addEventListener('change', startPolling);
    document.getElementById('cancelKillButton').addEventListener('click', function () {
      killDialog.close();
    });
    confirmKillButton.addEventListener('click', function () { void confirmKill(); });
    killDialog.addEventListener('close', function () {
      pendingProcess = null;
    });
    document.addEventListener('keydown', function (event) {
      if (event.key === 'F5') {
        event.preventDefault();
        void refreshPorts(true);
      } else if (event.ctrlKey && event.key.toLocaleLowerCase() === 'f') {
        event.preventDefault();
        searchInput.focus();
      }
    });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) stopPolling();
      else {
        void refreshPorts(false);
        startPolling();
      }
    });
    window.LongUI?.onCommand(async function (command) {
      const text = window.LongUI.commandText(command).trim();
      const match = /(?:^|\D)(\d{1,5})(?:\D|$)/.exec(text);
      if (match && Number(match[1]) <= 65535) {
        document.getElementById('portNumber').value = match[1];
        const success = await findPort();
        return {
          success: success,
          message: success ? '端口查询完成' : '端口查询失败'
        };
      }
      if (text) {
        searchInput.value = text;
        renderPorts();
        searchInput.focus();
      }
      return { success: true, message: '端口管理器已打开' };
    });
    initialize();
  </script>
</body>
</html>
