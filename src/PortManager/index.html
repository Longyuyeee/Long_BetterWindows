<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>端口管理器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      background: #1e1e1e;
      color: #d4d4d4;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 16px 20px;
      background: #252526;
      border-bottom: 1px solid #333;
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #fff;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .search-box {
      flex: 1;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 8px 36px 8px 12px;
      background: #1e1e1e;
      border: 1px solid #3c3c3c;
      border-radius: 6px;
      color: #d4d4d4;
      font-size: 13px;
    }

    .search-input:focus {
      outline: none;
      border-color: #C4612F;
    }

    .btn {
      padding: 8px 16px;
      background: #C4612F;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn:hover {
      background: #A94E22;
      transform: translateY(-1px);
    }

    .btn.secondary {
      background: #3c3c3c;
    }

    .btn.secondary:hover {
      background: #4c4c4c;
    }

    .filter-tabs {
      display: flex;
      gap: 4px;
      padding: 0 20px;
      background: #252526;
      border-bottom: 1px solid #333;
    }

    .tab {
      padding: 10px 16px;
      background: transparent;
      border: none;
      color: #888;
      cursor: pointer;
      font-size: 13px;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }

    .tab:hover {
      color: #d4d4d4;
    }

    .tab.active {
      color: #fff;
      border-bottom-color: #C4612F;
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 12px 20px;
    }

    .port-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .port-table thead {
      background: #252526;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .port-table th {
      padding: 10px 12px;
      text-align: left;
      font-weight: 500;
      color: #888;
      border-bottom: 1px solid #3c3c3c;
    }

    .port-table td {
      padding: 10px 12px;
      border-bottom: 1px solid #2d2d30;
    }

    .port-table tbody tr {
      transition: background 0.2s;
      cursor: pointer;
    }

    .port-table tbody tr:hover {
      background: #252526;
    }

    .port-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 500;
    }

    .port-badge.tcp {
      background: #264f78;
      color: #9cdcfe;
    }

    .port-badge.udp {
      background: #2d4f2f;
      color: #4ec9b0;
    }

    .state-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 11px;
    }

    .state-badge.listening {
      background: #2d4f2f;
      color: #4ec9b0;
    }

    .state-badge.established {
      background: #264f78;
      color: #9cdcfe;
    }

    .process-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .process-name {
      font-family: 'Consolas', monospace;
      color: #dcdcaa;
    }

    .process-pid {
      color: #888;
      font-size: 11px;
    }

    .actions {
      display: flex;
      gap: 6px;
    }

    .action-btn {
      padding: 4px 10px;
      background: #3c3c3c;
      border: none;
      border-radius: 4px;
      color: #d4d4d4;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .action-btn:hover {
      background: #C4612F;
    }

    .action-btn.danger {
      color: #f48771;
    }

    .action-btn.danger:hover {
      background: #c42f2f;
      color: #fff;
    }

    .stats {
      display: flex;
      gap: 20px;
      padding: 12px 20px;
      background: #252526;
      border-top: 1px solid #333;
      font-size: 12px;
      color: #888;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-value {
      color: #C4612F;
      font-weight: 600;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #888;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #888;
    }

    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-track {
      background: #1e1e1e;
    }

    ::-webkit-scrollbar-thumb {
      background: #3c3c3c;
      border-radius: 5px;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: #252526;
      border-radius: 8px;
      padding: 24px;
      max-width: 500px;
      width: 90%;
      border: 1px solid #3c3c3c;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #fff;
    }

    .modal-body {
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>端口管理器</h1>
    <div class="toolbar">
      <div class="search-box">
        <input type="text" class="search-input" id="searchInput" placeholder="搜索端口、进程名称...">
      </div>
      <button class="btn" onclick="refreshPorts()">🔄 刷新</button>
      <button class="btn secondary" onclick="showFindPortModal()">🔍 查找端口</button>
    </div>
  </div>

  <div class="filter-tabs">
    <button class="tab active" data-tab="tcp">TCP 监听</button>
    <button class="tab" data-tab="connections">TCP 连接</button>
    <button class="tab" data-tab="udp">UDP 端点</button>
  </div>

  <div class="content" id="content">
    <div class="loading">正在加载端口信息...</div>
  </div>

  <div class="stats">
    <div class="stat-item">
      <span>TCP 监听:</span>
      <span class="stat-value" id="tcpListeners">0</span>
    </div>
    <div class="stat-item">
      <span>TCP 连接:</span>
      <span class="stat-value" id="tcpConnections">0</span>
    </div>
    <div class="stat-item">
      <span>UDP 端点:</span>
      <span class="stat-value" id="udpEndpoints">0</span>
    </div>
    <div class="stat-item">
      <span>自动刷新:</span>
      <span class="stat-value" id="autoRefreshStatus">关闭</span>
    </div>
  </div>

  <!-- 查找端口模态框 -->
  <div class="modal" id="findPortModal">
    <div class="modal-content">
      <div class="modal-title">查找端口占用</div>
      <div class="modal-body">
        <input type="number" class="search-input" id="portNumber" placeholder="输入端口号 (1-65535)" min="1" max="65535">
        <div style="margin-top: 12px;" id="findResult"></div>
      </div>
      <div class="modal-actions">
        <button class="btn secondary" onclick="closeFindPortModal()">关闭</button>
        <button class="btn" onclick="findPort()">查找</button>
      </div>
    </div>
  </div>

  <script>
    let currentTab = 'tcp';
    let allPorts = { tcp: [], connections: [], udp: [] };
    let searchQuery = '';
    let autoRefreshInterval = null;

    // 初始化
    async function init() {
      await refreshPorts();
      setupEventListeners();
    }

    // 刷新端口信息
    async function refreshPorts() {
      try {
        // 模拟数据（实际应调用 long.networkPort API）
        // const tcpResult = await long.networkPort.getTcpListeners();
        // const connResult = await long.networkPort.getTcpConnections();
        // const udpResult = await long.networkPort.getUdpEndpoints();

        // 临时测试数据
        allPorts.tcp = [
          { localPort: 80, localAddress: '0.0.0.0', protocol: 'TCP', state: 'LISTENING', processId: 1234, processName: 'nginx', processPath: 'C:\\nginx\\nginx.exe' },
          { localPort: 443, localAddress: '0.0.0.0', protocol: 'TCP', state: 'LISTENING', processId: 1234, processName: 'nginx', processPath: 'C:\\nginx\\nginx.exe' },
          { localPort: 3306, localAddress: '127.0.0.1', protocol: 'TCP', state: 'LISTENING', processId: 5678, processName: 'mysqld', processPath: 'C:\\mysql\\bin\\mysqld.exe' },
          { localPort: 5432, localAddress: '127.0.0.1', protocol: 'TCP', state: 'LISTENING', processId: 9012, processName: 'postgres', processPath: 'C:\\postgres\\bin\\postgres.exe' },
        ];

        allPorts.connections = [
          { localPort: 49152, localAddress: '192.168.1.100', remotePort: 443, remoteAddress: '1.2.3.4', protocol: 'TCP', state: 'ESTABLISHED', processId: 3456, processName: 'chrome', processPath: 'C:\\Chrome\\chrome.exe' },
        ];

        allPorts.udp = [
          { localPort: 53, localAddress: '127.0.0.1', protocol: 'UDP', state: 'LISTENING', processId: 1111, processName: 'dns', processPath: 'C:\\dns\\dns.exe' },
        ];

        updateStats();
        renderPorts();
      } catch (e) {
        console.error('刷新端口失败:', e);
        document.getElementById('content').innerHTML = '<div class="empty-state">加载失败: ' + e.message + '</div>';
      }
    }

    // 更新统计
    function updateStats() {
      document.getElementById('tcpListeners').textContent = allPorts.tcp.length;
      document.getElementById('tcpConnections').textContent = allPorts.connections.length;
      document.getElementById('udpEndpoints').textContent = allPorts.udp.length;
    }

    // 渲染端口列表
    function renderPorts() {
      let ports = allPorts[currentTab] || [];

      // 搜索过滤
      if (searchQuery) {
        ports = ports.filter(p =>
          p.localPort.toString().includes(searchQuery) ||
          p.processName.toLowerCase().includes(searchQuery.toLowerCase())
        );
      }

      const content = document.getElementById('content');

      if (ports.length === 0) {
        content.innerHTML = '<div class="empty-state">没有找到端口信息</div>';
        return;
      }

      let tableHTML = '<table class="port-table"><thead><tr>';
      tableHTML += '<th>端口</th><th>地址</th>';
      if (currentTab === 'connections') {
        tableHTML += '<th>远程</th>';
      }
      tableHTML += '<th>协议</th><th>状态</th><th>进程</th><th>操作</th>';
      tableHTML += '</tr></thead><tbody>';

      ports.forEach(port => {
        tableHTML += '<tr>';
        tableHTML += `<td><strong>${port.localPort}</strong></td>`;
        tableHTML += `<td><code>${port.localAddress}</code></td>`;
        if (currentTab === 'connections') {
          tableHTML += `<td><code>${port.remoteAddress}:${port.remotePort}</code></td>`;
        }
        tableHTML += `<td><span class="port-badge ${port.protocol.toLowerCase()}">${port.protocol}</span></td>`;
        tableHTML += `<td><span class="state-badge ${port.state.toLowerCase()}">${port.state}</span></td>`;
        tableHTML += `<td><div class="process-info">
          <span class="process-name">${port.processName}</span>
          <span class="process-pid">PID: ${port.processId}</span>
        </div></td>`;
        tableHTML += `<td><div class="actions">
          <button class="action-btn" onclick="copyPortInfo(${port.localPort})">复制</button>
          <button class="action-btn danger" onclick="killProcess(${port.processId}, '${port.processName}')">终止</button>
        </div></td>`;
        tableHTML += '</tr>';
      });

      tableHTML += '</tbody></table>';
      content.innerHTML = tableHTML;
    }

    // 复制端口信息
    async function copyPortInfo(port) {
      try {
        await long.clipboard.setText(`端口 ${port}`);
        long.ui.showToast('已复制端口号');
      } catch (e) {
        console.error('复制失败:', e);
      }
    }

    // 终止进程
    async function killProcess(pid, name) {
      if (!confirm(`确定要终止进程 "${name}" (PID: ${pid}) 吗？\n\n这可能导致相关应用停止工作。`)) {
        return;
      }

      try {
        // await long.process.kill(pid);
        long.ui.showToast(`进程 ${name} 已终止`);
        await refreshPorts();
      } catch (e) {
        alert('终止进程失败: ' + e.message);
      }
    }

    // 查找端口
    function showFindPortModal() {
      document.getElementById('findPortModal').classList.add('show');
      document.getElementById('portNumber').value = '';
      document.getElementById('findResult').innerHTML = '';
    }

    function closeFindPortModal() {
      document.getElementById('findPortModal').classList.remove('show');
    }

    async function findPort() {
      const port = parseInt(document.getElementById('portNumber').value);
      if (!port || port < 1 || port > 65535) {
        document.getElementById('findResult').innerHTML = '<div style="color: #f48771;">请输入有效的端口号 (1-65535)</div>';
        return;
      }

      try {
        // const result = await long.networkPort.findPortOwner(port, 'tcp');
        // 临时模拟
        const found = allPorts.tcp.find(p => p.localPort === port);

        if (found) {
          document.getElementById('findResult').innerHTML = `
            <div style="background: #264f78; padding: 12px; border-radius: 4px; margin-top: 12px;">
              <div><strong>端口 ${port} 已被占用</strong></div>
              <div style="margin-top: 8px; font-size: 12px;">
                进程: ${found.processName} (PID: ${found.processId})<br>
                状态: ${found.state}<br>
                地址: ${found.localAddress}
              </div>
            </div>
          `;
        } else {
          document.getElementById('findResult').innerHTML = '<div style="color: #4ec9b0; margin-top: 12px;">✓ 端口 ' + port + ' 未被占用</div>';
        }
      } catch (e) {
        document.getElementById('findResult').innerHTML = '<div style="color: #f48771; margin-top: 12px;">查询失败: ' + e.message + '</div>';
      }
    }

    // 设置事件监听
    function setupEventListeners() {
      // Tab 切换
      document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
          currentTab = tab.dataset.tab;
          document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          renderPorts();
        });
      });

      // 搜索
      document.getElementById('searchInput').addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderPorts();
      });

      // 模态框点击外部关闭
      document.getElementById('findPortModal').addEventListener('click', (e) => {
        if (e.target.classList.contains('modal')) {
          closeFindPortModal();
        }
      });
    }

    // 启动
    init();
  </script>
</body>
</html>
