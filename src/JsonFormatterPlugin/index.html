<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JSON 格式化</title>
</head>
<body>
  <main class="long-page">
    <header class="long-page-header">
      <div>
        <div class="long-eyebrow">DEVELOPER TOOL</div>
        <h1 class="long-page-title">JSON 格式化</h1>
        <p class="long-page-description">格式化、校验或压缩 JSON，所有数据仅在本地处理。</p>
      </div>
      <span class="long-badge" id="stat">等待输入</span>
    </header>

    <section class="long-grid" aria-label="JSON 编辑器">
      <div class="long-card long-field">
        <label class="long-field-label" for="input">输入</label>
        <textarea class="long-editor" id="input" placeholder="粘贴 JSON 字符串…" autofocus></textarea>
      </div>
      <div class="long-card long-field">
        <label class="long-field-label" for="output">处理结果</label>
        <textarea class="long-editor" id="output" placeholder="格式化结果将在这里显示" readonly></textarea>
      </div>
    </section>

    <div class="long-toolbar long-toolbar--spaced">
      <button class="long-button long-button--primary btn-primary" id="formatButton" type="button">格式化</button>
      <button class="long-button long-button--secondary btn-secondary" id="minifyButton" type="button">压缩</button>
      <button class="long-button long-button--secondary btn-secondary" id="pasteButton" type="button">粘贴</button>
      <button class="long-button long-button--secondary btn-secondary" id="copyButton" type="button">复制结果</button>
      <span class="long-toolbar__spacer"></span>
      <span class="long-kbd">Ctrl Enter</span>
    </div>
    <div id="status" class="long-status" role="status" aria-live="polite"></div>
  </main>

  <script>
    const input = document.getElementById('input');
    const output = document.getElementById('output');
    const status = document.getElementById('status');
    const stat = document.getElementById('stat');

    function setStatus(message, kind) {
      status.textContent = message;
      status.className = 'long-status ' + (kind ? 'long-status--' + kind : '');
      window.LongUI?.announce(message);
    }

    function transform(spaces) {
      try {
        const result = JSON.stringify(JSON.parse(input.value), null, spaces);
        output.value = result;
        stat.textContent = result.length.toLocaleString() + ' 字符';
        const message = spaces ? 'JSON 格式化完成' : 'JSON 压缩完成';
        if (result.length > 65536) {
          setStatus('处理结果超过 65,536 个字符，无法作为命令输出', 'danger');
          return { success: false, message: 'JSON 处理结果超过命令输出上限', outputs: {} };
        }
        setStatus(message, 'success');
        return {
          success: true,
          message: message,
          outputs: { result: { type: 'text', value: result } }
        };
      } catch (error) {
        const message = 'JSON 解析失败：' + error.message;
        setStatus(message, 'danger');
        return { success: false, message: message, outputs: {} };
      }
    }

    async function paste() {
      try {
        const result = await long.clipboard.getText();
        if (result.success && result.data) { input.value = result.data; transform(2); }
      } catch (_) { setStatus('无法读取剪贴板', 'danger'); }
    }

    async function copy() {
      if (!output.value) return;
      try { await long.clipboard.setText(output.value); setStatus('结果已复制', 'success'); }
      catch (_) { setStatus('复制失败', 'danger'); }
    }

    document.getElementById('formatButton').addEventListener('click', function () { transform(2); });
    document.getElementById('minifyButton').addEventListener('click', function () { transform(0); });
    document.getElementById('pasteButton').addEventListener('click', paste);
    document.getElementById('copyButton').addEventListener('click', copy);
    document.addEventListener('keydown', function (event) {
      if (event.ctrlKey && event.key === 'Enter') { event.preventDefault(); transform(event.shiftKey ? 0 : 2); }
    });
    window.LongUI?.onCommand(function (command) {
      const text = window.LongUI.commandText(command);
      if (text) input.value = text;
      return transform(command.command_id === 'json.minify' ? 0 : 2);
    });
  </script>
</body>
</html>
