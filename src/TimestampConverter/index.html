<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>时间戳转换</title></head>
<body>
  <main class="long-page">
    <header class="long-page-header"><div><div class="long-eyebrow">DATE &amp; TIME</div><h1 class="long-page-title">时间戳转换</h1><p class="long-page-description">自动识别秒、毫秒时间戳或日期文本，同时展示本地与 UTC 时间。</p></div><span class="long-badge" id="clock">现在</span></header>
    <section class="long-card long-stack" aria-label="时间戳转换器">
      <div class="long-field"><label class="long-field-label" for="input">时间戳或日期</label><input class="long-input" id="input" placeholder="例如 1721380800 或 2026-07-19 12:00" autofocus></div>
      <div class="long-toolbar"><button class="long-button long-button--primary btn-primary" id="convertButton" type="button">转换</button><button class="long-button long-button--secondary btn-secondary" id="nowButton" type="button">使用当前时间</button><span class="long-toolbar__spacer"></span><span class="long-kbd">Ctrl Enter</span></div>
      <div class="long-result long-result--body" id="result" tabindex="0" aria-label="时间转换结果"></div>
      <div class="long-toolbar"><div id="status" class="long-status" role="status" aria-live="polite"></div><span class="long-toolbar__spacer"></span><button class="long-button long-button--secondary btn-secondary" id="copyButton" type="button">复制摘要</button></div>
    </section>
  </main>
  <script>
    const input = document.getElementById('input'); const result = document.getElementById('result'); const status = document.getElementById('status'); let summary = '';
    function parse(value) { const text = value.trim(); if (/^-?\d+(\.\d+)?$/.test(text)) { const number = Number(text); return new Date(Math.abs(number) < 100000000000 ? number * 1000 : number); } return new Date(text); }
    function convert() { const date = parse(input.value); if (Number.isNaN(date.getTime())) { status.textContent = '无法识别当前时间'; status.className = 'long-status long-status--danger'; return; } const seconds = Math.floor(date.getTime() / 1000); summary = '秒级时间戳：' + seconds + '\n毫秒时间戳：' + date.getTime() + '\n本地时间：' + date.toLocaleString() + '\nUTC：' + date.toISOString(); result.textContent = summary; status.textContent = '转换完成'; status.className = 'long-status long-status--success'; window.LongUI?.announce('时间转换完成'); }
    function useNow() { input.value = Date.now().toString(); convert(); }
    async function copy() { if (!summary) return; try { await long.clipboard.setText(summary); status.textContent = '摘要已复制'; } catch (_) { status.textContent = '复制失败'; status.className = 'long-status long-status--danger'; } }
    document.getElementById('convertButton').addEventListener('click', convert); document.getElementById('nowButton').addEventListener('click', useNow); document.getElementById('copyButton').addEventListener('click', copy);
    document.addEventListener('keydown', function (event) { if (event.ctrlKey && event.key === 'Enter') { event.preventDefault(); convert(); } });
    window.LongUI?.onCommand(function (command) { const text = window.LongUI.commandText(command); if (text) { input.value = text; convert(); } else useNow(); });
    useNow();
  </script>
</body>
</html>
