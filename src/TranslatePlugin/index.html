<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>翻译工具</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,system-ui,sans-serif;background:#f5f5f7;color:#1d1d1f;padding:20px}
h2{font-size:16px;font-weight:600;margin-bottom:12px;color:#007AFF}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
textarea{width:100%;height:100px;border:1px solid #e0e0e0;border-radius:8px;padding:12px;
  font-size:14px;resize:vertical;font-family:inherit;line-height:1.6}
textarea:focus{outline:none;border-color:#007AFF}
.btn-row{display:flex;gap:8px;margin-top:10px;align-items:center}
button{padding:8px 16px;border:none;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s}
.btn-primary{background:#007AFF;color:#fff}.btn-primary:hover{background:#0062CC}
.btn-secondary{background:#f0f0f0;color:#333}.btn-secondary:hover{background:#e0e0e0}
select{padding:6px 10px;border:1px solid #e0e0e0;border-radius:6px;font-size:12px;background:#fff}
.result-box{background:#f0f7ff;border-radius:8px;padding:12px;margin-top:12px;font-size:15px;line-height:1.7;min-height:40px;display:none}
.result-box.show{display:block}
.status{font-size:11px;color:#34C759;margin-top:6px;display:none}.status.show{display:block}
.status.error{color:#FF3B30}
.loading{color:#007AFF;font-size:12px;margin-left:8px;display:none}
.loading.show{display:inline}
.lang-row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.lang-row span{font-size:12px;color:#888}
</style>
</head>
<body>
<h2>翻译工具</h2>

<div class="card">
  <div class="lang-row">
    <span>翻译为:</span>
    <select id="targetLang">
      <option value="zh">中文</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
      <option value="ko">한국어</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
      <option value="es">Español</option>
      <option value="ru">Русский</option>
    </select>
    <span id="detectedLang" style="color:#007AFF"></span>
  </div>

  <textarea id="inputText" placeholder="输入要翻译的文本..."></textarea>
  <div class="btn-row">
    <button class="btn-primary" onclick="translateText()">翻译</button>
    <button class="btn-secondary" onclick="pasteFromClip()">从剪贴板粘贴</button>
    <button class="btn-secondary" onclick="swapAndTranslate()">自动检测翻译</button>
    <span class="loading" id="loading">翻译中...</span>
  </div>

  <div class="result-box" id="resultBox"></div>
  <div class="status" id="statusText"></div>
</div>

<div class="card">
  <h2>快捷操作</h2>
  <div class="btn-row">
    <button class="btn-secondary" onclick="copyResult()">复制翻译结果</button>
    <button class="btn-secondary" onclick="document.getElementById('inputText').value='';document.getElementById('resultBox').classList.remove('show')">清空</button>
  </div>
</div>

<script>
async function pasteFromClip() {
  try { var r = await long.clipboard.getText();
    if (r.success && r.data) { document.getElementById('inputText').value = r.data; translateText(); }
  } catch(e) {}
}

async function translateText() {
  var text = document.getElementById('inputText').value.trim();
  if (!text) return;
  document.getElementById('loading').classList.add('show');
  document.getElementById('resultBox').classList.remove('show');

  try {
    var target = document.getElementById('targetLang').value;
    var url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl='+target+'&dt=t&q='+encodeURIComponent(text);
    var resp = await fetch(url);
    var data = await resp.json();

    if (data && data[0]) {
      var result = data[0].map(function(x){return x[0]}).join('');
      var detected = data[2] || 'auto';
      document.getElementById('resultBox').textContent = result;
      document.getElementById('resultBox').classList.add('show');
      document.getElementById('detectedLang').textContent = '检测: '+detected;
      showStatus('翻译完成', false);
    }
  } catch(e) {
    showStatus('翻译失败: '+e.message, true);
  }
  document.getElementById('loading').classList.remove('show');
}

async function swapAndTranslate() {
  await pasteFromClip();
}

async function copyResult() {
  var text = document.getElementById('resultBox').textContent;
  if (!text) return;
  try { await long.clipboard.setText(text); showStatus('已复制到剪贴板', false); } catch(e) {}
}

function showStatus(msg, isError) {
  var el = document.getElementById('statusText');
  el.textContent = msg; el.classList.add('show');
  if (isError) el.classList.add('error'); else el.classList.remove('error');
  setTimeout(function(){el.classList.remove('show')}, 2500);
}
</script>
</body>
</html>
