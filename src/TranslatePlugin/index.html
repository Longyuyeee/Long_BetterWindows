<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>翻译工具</title>
</head>
<body>
  <main class="long-page">
    <header class="long-page-header">
      <div>
        <div class="long-eyebrow">TRANSLATE</div>
        <h1 class="long-page-title" data-i18n="page.title">翻译工具</h1>
        <p class="long-page-description" data-i18n="page.description">自动检测源语言，通过宿主受控网络能力完成翻译。</p>
      </div>
      <span class="long-badge" id="detectedLanguage">自动检测</span>
    </header>

    <section class="long-card long-stack" id="translatorSection" aria-label="文本翻译">
      <div class="long-toolbar">
        <label class="long-field-label" for="targetLanguage" data-i18n="field.target">翻译为</label>
        <select id="targetLanguage" aria-label="目标语言">
          <option value="zh">中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
          <option value="es">Español</option>
          <option value="ru">Русский</option>
        </select>
        <span class="long-toolbar__spacer"></span>
        <span class="long-kbd">Ctrl Enter</span>
      </div>

      <div class="long-field">
        <label class="long-field-label" for="inputText" data-i18n="field.input">原文</label>
        <textarea class="long-editor" id="inputText" placeholder="输入文本，或从命令中心携带剪贴板内容…" autofocus></textarea>
      </div>

      <div class="long-toolbar">
        <button class="long-button long-button--primary btn-primary" id="translateButton" type="button">开始翻译</button>
        <button class="long-button long-button--secondary btn-secondary" id="pasteButton" type="button" data-i18n="action.paste">粘贴并翻译</button>
        <button class="long-button long-button--secondary btn-secondary" id="clearButton" type="button" data-i18n="action.clear">清空</button>
      </div>

      <div class="long-result long-result--body" id="result" role="region" aria-label="翻译结果" tabindex="0" hidden></div>
      <div class="long-toolbar">
        <div class="long-status" id="status" role="status" aria-live="polite"></div>
        <span class="long-toolbar__spacer"></span>
        <button class="long-button long-button--secondary btn-secondary" id="copyButton" type="button" data-i18n="action.copy" disabled>复制结果</button>
      </div>
    </section>
  </main>

  <script>
    const input = document.getElementById('inputText');
    const result = document.getElementById('result');
    const status = document.getElementById('status');
    const translateButton = document.getElementById('translateButton');
    const copyButton = document.getElementById('copyButton');
    let strings = {};
    let isTranslating = false;
    let requestGeneration = 0;
    let detectedLanguage = '';
    let currentStatus = { key: '', fallback: '', values: {}, kind: '' };

    function t(key, fallback, values) {
      const template = strings[key] || fallback || key;
      return Object.entries(values || {}).reduce(function (text, entry) {
        return text.replaceAll('{' + entry[0] + '}', String(entry[1]));
      }, template);
    }

    function setStatus(key, kind, fallback, values) {
      currentStatus = { key, kind, fallback: fallback || '', values: values || {} };
      const message = key
        ? t(key, fallback, currentStatus.values)
        : currentStatus.fallback;
      status.textContent = message;
      status.className = 'long-status ' + (kind ? 'long-status--' + kind : '');
      if (message) window.LongUI?.announce(message);
      return message;
    }

    function renderRequestState() {
      translateButton.textContent = isTranslating
        ? t('action.translating', '翻译中…')
        : t('action.translate', '开始翻译');
      document.getElementById('detectedLanguage').textContent = detectedLanguage
        ? t('page.detected', '检测：{language}', { language: detectedLanguage })
        : t('page.autoDetect', '自动检测');
    }

    function applyLocalization(message) {
      strings = message.resources || {};
      document.documentElement.lang = message.resolved_language || 'zh-CN';
      document.title = t('plugin.name', '翻译工具');
      document.querySelectorAll('[data-i18n]').forEach(function (element) {
        element.textContent = t(element.dataset.i18n, element.textContent);
      });
      document.getElementById('translatorSection').setAttribute(
        'aria-label',
        t('translator.ariaLabel', '文本翻译'));
      document.getElementById('targetLanguage').setAttribute(
        'aria-label',
        t('field.targetAriaLabel', '目标语言'));
      input.placeholder = t(
        'field.inputPlaceholder',
        '输入文本，或从命令中心携带剪贴板内容…');
      result.setAttribute(
        'aria-label',
        t('result.ariaLabel', '翻译结果'));
      renderRequestState();
      if (currentStatus.key || currentStatus.fallback) {
        setStatus(
          currentStatus.key,
          currentStatus.kind,
          currentStatus.fallback,
          currentStatus.values);
      }
    }

    async function translate() {
      if (isTranslating) return false;
      const text = input.value.trim();
      if (!text) {
        setStatus('error.enterText', 'warning', '请输入需要翻译的文本');
        input.focus();
        return false;
      }
      const generation = ++requestGeneration;
      isTranslating = true;
      window.LongUI?.setBusy(translateButton, true);
      renderRequestState();
      result.hidden = true;
      copyButton.disabled = true;
      setStatus('status.connecting', '', '正在连接翻译服务');
      try {
        const target = document.getElementById('targetLanguage').value;
        const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=' + target + '&dt=t&q=' + encodeURIComponent(text);
        const response = await long.http.get(url);
        if (!response.success) throw new Error(response.error || t('error.network', '网络请求失败'));
        const data = JSON.parse(response.data);
        const translated = Array.isArray(data[0]) ? data[0].map(function (part) { return part[0] || ''; }).join('') : '';
        if (!translated) throw new Error(t('error.emptyResponse', '服务没有返回翻译内容'));
        if (generation !== requestGeneration) return false;
        result.textContent = translated;
        result.hidden = false;
        copyButton.disabled = false;
        detectedLanguage = data[2] || 'auto';
        renderRequestState();
        setStatus('status.completed', 'success', '翻译完成');
        return true;
      } catch (error) {
        if (generation !== requestGeneration) return false;
        setStatus(
          'error.translate',
          'danger',
          '翻译失败：{detail}',
          { detail: error && error.message ? error.message : String(error) });
        return false;
      } finally {
        isTranslating = false;
        window.LongUI?.setBusy(translateButton, false);
        renderRequestState();
      }
    }

    function invalidateTranslation(showWarning) {
      requestGeneration += 1;
      result.textContent = '';
      result.hidden = true;
      copyButton.disabled = true;
      detectedLanguage = '';
      renderRequestState();
      if (showWarning && isTranslating) {
        setStatus(
          'status.sourceChanged',
          'warning',
          '原文或目标语言已改变，请重新翻译');
      }
    }

    async function pasteAndTranslate() {
      try {
        const response = await long.clipboard.getText();
        if (response.success && response.data) { input.value = response.data; await translate(); }
        else setStatus('error.clipboardEmpty', 'warning', '剪贴板中没有文本');
      } catch (_) { setStatus('error.clipboardRead', 'danger', '无法读取剪贴板'); }
    }

    async function copyResult() {
      if (!result.textContent) return;
      try { const response = await long.clipboard.setText(result.textContent); if (!response || !response.success) throw new Error(response && response.error); setStatus('status.copied', 'success', '翻译结果已复制'); }
      catch (_) { setStatus('error.copy', 'danger', '复制失败'); }
    }

    document.getElementById('translateButton').addEventListener('click', translate);
    document.getElementById('pasteButton').addEventListener('click', pasteAndTranslate);
    document.getElementById('copyButton').addEventListener('click', copyResult);
    input.addEventListener('input', function () { invalidateTranslation(true); });
    document.getElementById('targetLanguage').addEventListener(
      'change',
      function () { invalidateTranslation(true); });
    document.getElementById('clearButton').addEventListener('click', function () {
      input.value = '';
      invalidateTranslation(false);
      input.focus();
      setStatus('', '', '');
    });
    document.addEventListener('keydown', function (event) {
      if (event.ctrlKey && event.key === 'Enter') { event.preventDefault(); translate(); }
    });
    window.LongUI?.onCommand(async function (command) {
      const text = window.LongUI.commandText(command);
      if (!text) {
        input.focus();
        return {
          success: true,
          message: t('command.opened', '翻译工具已打开')
        };
      }
      input.value = text;
      const success = await translate();
      return {
        success: success,
        message: status.textContent,
        outputs: success
          ? { result: { type: 'text', value: result.textContent } }
          : {}
      };
    });
    window.chrome?.webview?.addEventListener('message', function ({ data }) {
      if (data?.type === 'long.language-changed') applyLocalization(data);
    });
  </script>
</body>
</html>
