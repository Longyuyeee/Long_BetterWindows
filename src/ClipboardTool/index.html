<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>剪贴板工具箱</title>
</head>
<body>
  <main class="long-page">
    <header class="long-page-header">
      <div>
        <div class="long-eyebrow">CLIPBOARD</div>
        <h1 class="long-page-title">剪贴板工具箱</h1>
        <p class="long-page-description">搜索、固定和转换最近复制的文本，历史仅保存在本机。</p>
      </div>
      <span class="long-badge" id="historyBadge">0 条记录</span>
    </header>

    <nav class="long-segment" aria-label="剪贴板工具页签">
      <button type="button" data-tab="history" aria-selected="true">历史</button>
      <button type="button" data-tab="pinned" aria-selected="false">固定</button>
      <button type="button" data-tab="tools" aria-selected="false">文本工具</button>
    </nav>

    <section class="long-panel long-stack long-toolbar--spaced" id="listPanel">
      <input id="searchInput" type="search" placeholder="搜索剪贴板历史…" aria-label="搜索剪贴板历史">
      <div class="long-list" id="clipList"></div>
      <div class="long-empty" id="emptyState">暂无剪贴板记录</div>
    </section>

    <section class="long-panel long-stack long-toolbar--spaced" id="toolsPanel" hidden>
      <div class="long-card long-field">
        <label class="long-field-label" for="content">文本内容</label>
        <textarea class="long-editor" id="content" placeholder="读取剪贴板，或输入需要转换的文本…"></textarea>
        <div class="long-toolbar">
          <button class="long-button long-button--primary btn-primary" id="readButton" type="button">读取剪贴板</button>
          <button class="long-button long-button--secondary btn-secondary" id="writeButton" type="button">写入剪贴板</button>
          <button class="long-button long-button--secondary btn-secondary" data-transform="upper" type="button">大写</button>
          <button class="long-button long-button--secondary btn-secondary" data-transform="lower" type="button">小写</button>
          <button class="long-button long-button--secondary btn-secondary" data-transform="trim" type="button">整理空白</button>
        </div>
        <div class="long-status" id="status" role="status" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <script>
    const historyKey = 'clip_history';
    const pinnedKey = 'clip_pinned';
    const listElement = document.getElementById('clipList');
    const emptyState = document.getElementById('emptyState');
    const searchInput = document.getElementById('searchInput');
    const content = document.getElementById('content');
    const status = document.getElementById('status');
    let history = [];
    let pinned = [];
    let currentTab = 'history';
    let lastClipboard = '';
    let monitor = 0;

    async function initialize() {
      try {
        const historyResult = await long.storage.get(historyKey);
        const pinnedResult = await long.storage.get(pinnedKey);
        if (historyResult.success && historyResult.data) history = JSON.parse(historyResult.data);
        if (pinnedResult.success && pinnedResult.data) pinned = JSON.parse(pinnedResult.data);
      } catch (_) { setStatus('历史记录读取失败', 'danger'); }
      render();
      startMonitor();
    }

    function startMonitor() {
      if (monitor || document.hidden) return;
      monitor = window.setInterval(captureClipboard, 1800);
    }

    function stopMonitor() { window.clearInterval(monitor); monitor = 0; }

    async function captureClipboard() {
      try {
        const response = await long.clipboard.getText();
        const text = response.success ? (response.data || '').trim() : '';
        if (text && text !== lastClipboard) { lastClipboard = text; addHistory(text); }
      } catch (_) { }
    }

    async function persist() {
      await Promise.all([
        long.storage.set(historyKey, JSON.stringify(history)),
        long.storage.set(pinnedKey, JSON.stringify(pinned))
      ]);
    }

    function addHistory(text) {
      history = history.filter(function (item) { return item.text !== text; });
      history.unshift({ text: text, time: Date.now() });
      history = history.slice(0, 50);
      persist();
      if (currentTab === 'history') render();
    }

    function setStatus(message, kind) {
      status.textContent = message;
      status.className = 'long-status ' + (kind ? 'long-status--' + kind : '');
      window.LongUI?.announce(message);
    }

    function selectTab(tab) {
      currentTab = tab;
      document.querySelectorAll('[data-tab]').forEach(function (button) {
        button.setAttribute('aria-selected', String(button.dataset.tab === tab));
      });
      const tools = tab === 'tools';
      document.getElementById('listPanel').hidden = tools;
      document.getElementById('toolsPanel').hidden = !tools;
      searchInput.hidden = tab === 'pinned';
      if (!tools) render(); else content.focus();
    }

    function render() {
      const query = searchInput.value.trim().toLocaleLowerCase();
      const source = currentTab === 'pinned' ? pinned : history;
      const visible = source.filter(function (item) { return !query || item.text.toLocaleLowerCase().includes(query); });
      listElement.replaceChildren();
      emptyState.hidden = visible.length > 0;
      document.getElementById('historyBadge').textContent = history.length + ' 条记录 · ' + pinned.length + ' 条固定';
      visible.forEach(function (item) {
        const row = document.createElement('article');
        row.className = 'long-list-item';
        const value = document.createElement('button');
        value.type = 'button';
        value.className = 'long-list-item__content';
        value.textContent = item.text.length > 240 ? item.text.slice(0, 240) + '…' : item.text;
        value.addEventListener('click', function () { copyItem(item); });
        const actions = document.createElement('div');
        actions.className = 'long-list-item__meta long-stack';
        const time = document.createElement('time');
        time.textContent = relativeTime(item.time);
        const pin = document.createElement('button');
        pin.type = 'button'; pin.className = 'long-button long-button--small';
        const isPinned = pinned.some(function (entry) { return entry.text === item.text; });
        pin.textContent = isPinned ? '取消固定' : '固定';
        pin.addEventListener('click', function () { togglePin(item); });
        const remove = document.createElement('button');
        remove.type = 'button'; remove.className = 'long-button long-button--small'; remove.textContent = '删除';
        remove.addEventListener('click', function () { removeItem(item); });
        actions.append(time, pin, remove);
        row.append(value, actions);
        listElement.appendChild(row);
      });
    }

    async function copyItem(item) {
      await long.clipboard.setText(item.text);
      lastClipboard = item.text;
      addHistory(item.text);
      setStatus('已复制 · ' + item.text.length + ' 字符', 'success');
    }

    async function togglePin(item) {
      const index = pinned.findIndex(function (entry) { return entry.text === item.text; });
      if (index >= 0) pinned.splice(index, 1); else pinned.unshift({ text: item.text, time: Date.now() });
      await persist(); render();
    }

    async function removeItem(item) {
      const target = currentTab === 'pinned' ? pinned : history;
      const index = target.indexOf(item);
      if (index >= 0) target.splice(index, 1);
      await persist(); render();
    }

    async function readClipboard() {
      const response = await long.clipboard.getText();
      content.value = response.success ? response.data || '' : '';
      setStatus(response.success ? '剪贴板内容已读取' : response.error || '读取失败', response.success ? 'success' : 'danger');
    }

    async function writeClipboard() {
      const response = await long.clipboard.setText(content.value);
      if (response.success) { lastClipboard = content.value; addHistory(content.value); }
      setStatus(response.success ? '内容已写入剪贴板' : response.error || '写入失败', response.success ? 'success' : 'danger');
    }

    function transform(kind) {
      if (kind === 'upper') content.value = content.value.toLocaleUpperCase();
      if (kind === 'lower') content.value = content.value.toLocaleLowerCase();
      if (kind === 'trim') content.value = content.value.split('\n').map(function (line) { return line.trim(); }).join('\n').trim();
      writeClipboard();
    }

    function relativeTime(value) {
      const seconds = Math.max(0, Math.floor((Date.now() - value) / 1000));
      if (seconds < 60) return '刚刚';
      if (seconds < 3600) return Math.floor(seconds / 60) + ' 分钟前';
      if (seconds < 86400) return Math.floor(seconds / 3600) + ' 小时前';
      return Math.floor(seconds / 86400) + ' 天前';
    }

    document.querySelectorAll('[data-tab]').forEach(function (button) { button.addEventListener('click', function () { selectTab(button.dataset.tab); }); });
    document.querySelectorAll('[data-transform]').forEach(function (button) { button.addEventListener('click', function () { transform(button.dataset.transform); }); });
    document.getElementById('readButton').addEventListener('click', readClipboard);
    document.getElementById('writeButton').addEventListener('click', writeClipboard);
    searchInput.addEventListener('input', render);
    document.addEventListener('keydown', function (event) {
      if (event.ctrlKey && event.key.toLocaleLowerCase() === 'f') { event.preventDefault(); selectTab('history'); searchInput.focus(); }
      else if (event.ctrlKey && event.key === 'Enter' && currentTab === 'tools') { event.preventDefault(); writeClipboard(); }
    });
    document.addEventListener('visibilitychange', function () { document.hidden ? stopMonitor() : startMonitor(); });
    window.LongUI?.onCommand(function (command) {
      const text = window.LongUI.commandText(command);
      selectTab('tools');
      if (text) { content.value = text; addHistory(text); }
      content.focus();
    });
    initialize();
  </script>
</body>
</html>
