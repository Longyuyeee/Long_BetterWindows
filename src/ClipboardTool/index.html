<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>剪贴板工具箱</title>
</head>
<body>
  <main class="long-page">
    <header class="long-page-header">
      <div>
        <div class="long-eyebrow">CLIPBOARD</div>
        <h1 class="long-page-title" data-i18n="page.title">剪贴板工具箱</h1>
        <p class="long-page-description" data-i18n="page.description">搜索、固定和转换最近复制的文本，历史仅保存在本机。</p>
      </div>
      <span class="long-badge" id="historyBadge">0 条记录</span>
    </header>

    <nav class="long-segment" id="tabNavigation" aria-label="剪贴板工具页签">
      <button type="button" data-tab="history" data-i18n="tabs.history" aria-selected="true">历史</button>
      <button type="button" data-tab="pinned" data-i18n="tabs.pinned" aria-selected="false">固定</button>
      <button type="button" data-tab="tools" data-i18n="tabs.tools" aria-selected="false">文本工具</button>
    </nav>

    <section class="long-panel long-stack long-toolbar--spaced" id="listPanel">
      <input id="searchInput" type="search" placeholder="搜索剪贴板历史…" aria-label="搜索剪贴板历史">
      <div class="long-list" id="clipList"></div>
    </section>

    <section class="long-panel long-stack long-toolbar--spaced" id="toolsPanel" hidden>
      <div class="long-card long-field">
        <label class="long-field-label" for="content" data-i18n="field.content">文本内容</label>
        <textarea class="long-editor" id="content" placeholder="读取剪贴板，或输入需要转换的文本…"></textarea>
        <div class="long-toolbar">
          <button class="long-button long-button--primary btn-primary" id="readButton" type="button" data-i18n="action.read">读取剪贴板</button>
          <button class="long-button long-button--secondary btn-secondary" id="writeButton" type="button" data-i18n="action.write">写入剪贴板</button>
          <button class="long-button long-button--secondary btn-secondary" data-transform="upper" data-i18n="action.upper" type="button">大写</button>
          <button class="long-button long-button--secondary btn-secondary" data-transform="lower" data-i18n="action.lower" type="button">小写</button>
          <button class="long-button long-button--secondary btn-secondary" data-transform="trim" data-i18n="action.trim" type="button">整理空白</button>
        </div>
        <div class="long-status" id="status" role="status" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <script>
    const historyKey = 'clip_history';
    const pinnedKey = 'clip_pinned';
    const maxItems = 50;
    const maxItemCharacters = 65536;
    const maxCollectionCharacters = 500000;
    const fallbackIntervalMs = 15000;
    const listElement = document.getElementById('clipList');
    const searchInput = document.getElementById('searchInput');
    const content = document.getElementById('content');
    const status = document.getElementById('status');
    let history = [];
    let pinned = [];
    let currentTab = 'history';
    let lastClipboard = '';
    let monitorStarted = false;
    let fallbackTimer = 0;
    let captureRequest = null;
    let mutationQueue = Promise.resolve();
    let strings = {};
    let listState = 'loading';
    let loadErrorDetail = '';
    let currentStatus = { key: '', fallback: '', values: {}, kind: '' };

    function t(key, fallback, values) {
      const template = strings[key] || fallback || key;
      return Object.entries(values || {}).reduce(function (result, entry) {
        return result.replaceAll('{' + entry[0] + '}', String(entry[1]));
      }, template);
    }

    function renderStatus() {
      const message = currentStatus.key
        ? t(currentStatus.key, currentStatus.fallback, currentStatus.values)
        : currentStatus.fallback;
      status.textContent = message;
      status.className = 'long-status ' +
        (currentStatus.kind ? 'long-status--' + currentStatus.kind : '');
      return message;
    }

    function setStatus(key, kind, fallback, values) {
      currentStatus = { key, kind, fallback: fallback || '', values: values || {} };
      const message = renderStatus();
      if (message) window.LongUI?.announce(message);
    }

    function renderListState() {
      if (listState === 'loading') {
        window.LongUI?.renderState(listElement, {
          kind: 'loading',
          title: t('state.loading', '正在加载剪贴板记录')
        });
      } else if (listState === 'error') {
        window.LongUI?.renderState(listElement, {
          kind: 'error',
          title: t('state.loadFailed', '剪贴板记录读取失败'),
          detail: loadErrorDetail,
          actionLabel: t('action.retry', '重试'),
          onAction: initialize
        });
      } else {
        render();
      }
    }

    function applyLocalization(message) {
      strings = message.resources || {};
      document.documentElement.lang = message.resolved_language || 'zh-CN';
      document.title = t('plugin.name', '剪贴板工具箱');
      document.querySelectorAll('[data-i18n]').forEach(function (element) {
        element.textContent = t(element.dataset.i18n, element.textContent);
      });
      document.getElementById('tabNavigation').setAttribute(
        'aria-label',
        t('tabs.ariaLabel', '剪贴板工具页签'));
      searchInput.placeholder = t('search.placeholder', '搜索剪贴板历史…');
      searchInput.setAttribute('aria-label', t('search.ariaLabel', '搜索剪贴板历史'));
      content.placeholder = t(
        'field.contentPlaceholder',
        '读取剪贴板，或输入需要转换的文本…');
      renderListState();
      renderStatus();
    }

    function normalizeItems(value, limit) {
      if (!Array.isArray(value)) return [];
      return trimItems(value
        .filter(function (item) {
          return item && typeof item.text === 'string' && item.text.trim();
        })
        .map(function (item) {
          return {
            text: item.text,
            time: Number.isFinite(Number(item.time)) ? Number(item.time) : Date.now()
          };
        }), limit);
    }

    function trimItems(items, limit) {
      const limited = [];
      let totalCharacters = 0;
      for (const item of items) {
        if (limited.length >= limit) break;
        const length = item.text.length;
        if (length > maxItemCharacters
          || totalCharacters + length > maxCollectionCharacters) {
          continue;
        }
        limited.push(item);
        totalCharacters += length;
      }
      return limited;
    }

    function responseData(response, fallbackMessage) {
      if (!response || !response.success) {
        throw new Error(response && response.error ? response.error : fallbackMessage);
      }
      return response.data;
    }

    async function initialize() {
      listState = 'loading';
      stopFallbackPolling();
      renderListState();
      try {
        const historyResult = await long.storage.get(historyKey);
        const pinnedResult = await long.storage.get(pinnedKey);
        if (!historyResult.success) throw new Error(historyResult.error || t('error.historyRead', '历史记录读取失败'));
        if (!pinnedResult.success) throw new Error(pinnedResult.error || t('error.pinnedRead', '固定记录读取失败'));
        history = normalizeItems(
          historyResult.data ? JSON.parse(historyResult.data) : [],
          maxItems);
        pinned = normalizeItems(
          pinnedResult.data ? JSON.parse(pinnedResult.data) : [],
          maxItems);
        lastClipboard = '';
      } catch (error) {
        listState = 'error';
        loadErrorDetail = error && error.message ? error.message : String(error);
        renderListState();
        setStatus('status.historyReadFailed', 'danger', '历史记录读取失败');
        return false;
      }
      listState = 'ready';
      render();
      await startMonitor();
      return true;
    }

    function isPageActive() {
      return window.long?.host?.isVisible?.() !== false && !document.hidden;
    }

    async function startMonitor() {
      if (monitorStarted || fallbackTimer || !isPageActive()) return;
      try {
        const response = await long.clipboard.startMonitoring(handleClipboardChanged);
        responseData(response, t('error.monitor', '剪贴板监听启动失败'));
        monitorStarted = true;
      } catch (error) {
        startFallbackPolling();
        setStatus(
          'status.monitorFallback',
          'warning',
          '剪贴板事件监听不可用，已启用低频同步：{detail}',
          {
            detail: error && error.message
              ? error.message
              : t('error.monitor', '剪贴板监听启动失败')
          });
      }
      await captureClipboard();
    }

    function startFallbackPolling() {
      if (fallbackTimer) return;
      fallbackTimer = window.setInterval(captureClipboard, fallbackIntervalMs);
    }

    function stopFallbackPolling() {
      window.clearInterval(fallbackTimer);
      fallbackTimer = 0;
    }

    async function stopMonitor() {
      stopFallbackPolling();
      if (!monitorStarted) return;
      monitorStarted = false;
      try {
        const response = await long.clipboard.stopMonitoring();
        responseData(response, t('error.monitorStop', '剪贴板监听停止失败'));
      } catch (_) { }
    }

    async function storeCapturedText(text) {
      if (typeof text !== 'string' || !text.trim()) return 'empty';
      if (text === lastClipboard) return 'duplicate';
      const outcome = await addHistory(text);
      if (outcome === 'added' || outcome === 'duplicate') lastClipboard = text;
      return outcome;
    }

    function handleClipboardChanged(event) {
      if (event && event.content_type === 'text' && typeof event.text === 'string') {
        void storeCapturedText(event.text);
      }
    }

    async function captureClipboard() {
      if (captureRequest) return captureRequest;
      captureRequest = (async function () {
        try {
          const response = await long.clipboard.getText();
          const text = responseData(
            response,
            t('error.clipboardRead', '读取剪贴板失败')) || '';
          await storeCapturedText(text);
        } catch (_) { }
        finally { captureRequest = null; }
      })();
      return captureRequest;
    }

    async function persistCollection(name, value) {
      const key = name === 'history' ? historyKey : pinnedKey;
      const response = await long.storage.set(key, JSON.stringify(value));
      responseData(
        response,
        name === 'history'
          ? t('error.historySave', '历史记录保存失败')
          : t('error.pinnedSave', '固定记录保存失败'));
    }

    function mutateCollection(name, transform, successStatus) {
      const operation = mutationQueue.then(async function () {
        const previous = name === 'history' ? history : pinned;
        const next = transform(previous.slice());
        if (!next) return true;
        if (name === 'history') history = next; else pinned = next;
        render();
        try {
          await persistCollection(name, next);
          if (successStatus) {
            setStatus(
              successStatus.key,
              'success',
              successStatus.fallback,
              successStatus.values);
          }
          return true;
        } catch (error) {
          if (name === 'history') history = previous; else pinned = previous;
          render();
          setStatus('', 'danger', error.message || t('status.localSaveFailed', '本地记录保存失败'));
          return false;
        }
      });
      mutationQueue = operation.catch(function () { });
      return operation;
    }

    function addHistory(text) {
      if (typeof text !== 'string' || !text.trim()) return Promise.resolve('empty');
      if (text.length > maxItemCharacters) return Promise.resolve('too-large');
      if (history[0] && history[0].text === text) return Promise.resolve('duplicate');
      return mutateCollection('history', function (items) {
        if (items[0] && items[0].text === text) return null;
        const next = items.filter(function (item) { return item.text !== text; });
        next.unshift({ text: text, time: Date.now() });
        return trimItems(next, maxItems);
      }).then(function (success) {
        if (!success) return 'failed';
        return history[0] && history[0].text === text ? 'added' : 'duplicate';
      });
    }

    function selectTab(tab) {
      currentTab = tab;
      document.querySelectorAll('[data-tab]').forEach(function (button) {
        button.setAttribute('aria-selected', String(button.dataset.tab === tab));
      });
      const tools = tab === 'tools';
      document.getElementById('listPanel').hidden = tools;
      document.getElementById('toolsPanel').hidden = !tools;
      searchInput.hidden = tab === 'pinned';
      if (!tools) render(); else content.focus();
    }

    function render() {
      const query = currentTab === 'history'
        ? searchInput.value.trim().toLocaleLowerCase()
        : '';
      const source = currentTab === 'pinned' ? pinned : history;
      const visible = source.filter(function (item) { return !query || item.text.toLocaleLowerCase().includes(query); });
      listElement.replaceChildren();
      document.getElementById('historyBadge').textContent = t(
        'badge.summary',
        '{history} 条记录 · {pinned} 条固定',
        { history: history.length, pinned: pinned.length });
      if (!visible.length) {
        const title = query
          ? t('state.noMatches', '没有匹配的剪贴板记录')
          : currentTab === 'pinned'
            ? t('state.noPinned', '暂无固定记录')
            : t('state.noHistory', '暂无剪贴板记录');
        window.LongUI?.renderState(listElement, {
          kind: 'empty',
          title: title,
          detail: query ? t('state.tryAnotherSearch', '请尝试其他搜索词') : ''
        });
        return;
      }
      visible.forEach(function (item) {
        const row = document.createElement('article');
        row.className = 'long-list-item';
        const value = document.createElement('button');
        value.type = 'button';
        value.className = 'long-list-item__content';
        value.textContent = item.text.length > 240 ? item.text.slice(0, 240) + '…' : item.text;
        value.addEventListener('click', function () { copyItem(item); });
        const actions = document.createElement('div');
        actions.className = 'long-list-item__meta long-stack';
        const time = document.createElement('time');
        time.textContent = relativeTime(item.time);
        const pin = document.createElement('button');
        pin.type = 'button'; pin.className = 'long-button long-button--small';
        const isPinned = pinned.some(function (entry) { return entry.text === item.text; });
        pin.textContent = isPinned
          ? t('action.unpin', '取消固定')
          : t('action.pin', '固定');
        pin.addEventListener('click', function () { togglePin(item); });
        const remove = document.createElement('button');
        remove.type = 'button'; remove.className = 'long-button long-button--small';
        remove.textContent = t('action.remove', '删除');
        remove.addEventListener('click', function () { removeItem(item); });
        actions.append(time, pin, remove);
        row.append(value, actions);
        listElement.appendChild(row);
      });
    }

    async function copyItem(item) {
      try {
        const response = await long.clipboard.setText(item.text);
        responseData(response, t('error.clipboardWrite', '写入剪贴板失败'));
        const outcome = await addHistory(item.text);
        if (outcome === 'failed') {
          setStatus(
            'status.copiedHistoryFailed',
            'warning',
            '已复制，但历史记录更新失败');
        } else {
          lastClipboard = item.text;
          setStatus('status.copied', 'success', '已复制 · {count} 字符', { count: item.text.length });
        }
      } catch (error) {
        setStatus('', 'danger', error.message || t('error.clipboardWrite', '写入剪贴板失败'));
      }
    }

    async function togglePin(item) {
      const isPinned = pinned.some(function (entry) { return entry.text === item.text; });
      await mutateCollection('pinned', function (items) {
        const next = items.filter(function (entry) { return entry.text !== item.text; });
        if (!isPinned) next.unshift({ text: item.text, time: Date.now() });
        return trimItems(next, maxItems);
      }, isPinned
        ? { key: 'status.unpinned', fallback: '已取消固定', values: {} }
        : { key: 'status.pinned', fallback: '记录已固定', values: {} });
    }

    async function removeItem(item) {
      const name = currentTab === 'pinned' ? 'pinned' : 'history';
      await mutateCollection(name, function (items) {
        return items.filter(function (entry) { return entry !== item && entry.text !== item.text; });
      }, { key: 'status.removed', fallback: '记录已删除', values: {} });
    }

    async function readClipboard() {
      try {
        const response = await long.clipboard.getText();
        content.value = responseData(response, t('error.clipboardRead', '读取剪贴板失败')) || '';
        setStatus('status.read', 'success', '剪贴板内容已读取');
      } catch (error) {
        setStatus('', 'danger', error.message || t('error.clipboardRead', '读取剪贴板失败'));
      }
    }

    async function writeClipboard() {
      try {
        const response = await long.clipboard.setText(content.value);
        responseData(response, t('error.clipboardWrite', '写入剪贴板失败'));
        const outcome = await addHistory(content.value);
        if (outcome === 'failed') {
          setStatus(
            'status.writtenHistoryFailed',
            'warning',
            '已写入剪贴板，但历史记录保存失败');
        } else if (outcome === 'too-large') {
          setStatus(
            'status.writtenHistorySkipped',
            'warning',
            '已写入剪贴板；文本超过 {count} 字符，未加入历史',
            { count: maxItemCharacters });
        } else {
          lastClipboard = content.value;
          setStatus('status.written', 'success', '内容已写入剪贴板');
        }
      } catch (error) {
        setStatus('', 'danger', error.message || t('error.clipboardWrite', '写入剪贴板失败'));
      }
    }

    async function transform(kind) {
      if (kind === 'upper') content.value = content.value.toLocaleUpperCase();
      if (kind === 'lower') content.value = content.value.toLocaleLowerCase();
      if (kind === 'trim') content.value = content.value.split('\n').map(function (line) { return line.trim(); }).join('\n').trim();
      await writeClipboard();
    }

    function relativeTime(value) {
      const seconds = Math.max(0, Math.floor((Date.now() - value) / 1000));
      if (seconds < 60) return t('time.now', '刚刚');
      if (seconds < 3600) return t('time.minutes', '{count} 分钟前', { count: Math.floor(seconds / 60) });
      if (seconds < 86400) return t('time.hours', '{count} 小时前', { count: Math.floor(seconds / 3600) });
      return t('time.days', '{count} 天前', { count: Math.floor(seconds / 86400) });
    }

    document.querySelectorAll('[data-tab]').forEach(function (button) { button.addEventListener('click', function () { selectTab(button.dataset.tab); }); });
    document.querySelectorAll('[data-transform]').forEach(function (button) { button.addEventListener('click', function () { transform(button.dataset.transform); }); });
    document.getElementById('readButton').addEventListener('click', readClipboard);
    document.getElementById('writeButton').addEventListener('click', writeClipboard);
    searchInput.addEventListener('input', render);
    document.addEventListener('keydown', function (event) {
      if (event.ctrlKey && event.key.toLocaleLowerCase() === 'f') { event.preventDefault(); selectTab('history'); searchInput.focus(); }
      else if (event.ctrlKey && event.key === 'Enter' && currentTab === 'tools') { event.preventDefault(); writeClipboard(); }
    });
    document.addEventListener('visibilitychange', function () {
      if (!isPageActive()) void stopMonitor();
      else void startMonitor();
    });
    window.addEventListener('long-host-visibilitychange', function () {
      if (!isPageActive()) void stopMonitor();
      else void startMonitor();
    });
    window.LongUI?.onCommand(async function (command) {
      if (!await initializationPromise) {
        return {
          success: false,
          message: t('status.historyReadFailed', '历史记录读取失败')
        };
      }
      const text = window.LongUI.commandText(command);
      selectTab('tools');
      if (text) {
        content.value = text;
        const outcome = await addHistory(text);
        if (outcome === 'too-large') {
          return {
            success: false,
            message: t(
              'status.historyTooLarge',
              '文本超过 {count} 字符，未加入历史',
              { count: maxItemCharacters })
          };
        }
        if (outcome === 'failed') {
          return {
            success: false,
            message: t('status.localSaveFailed', '本地记录保存失败')
          };
        }
      }
      content.focus();
      return {
        success: true,
        message: t('status.opened', '剪贴板工具已打开')
      };
    });
    window.chrome?.webview?.addEventListener('message', function ({ data }) {
      if (data?.type === 'long.language-changed') applyLocalization(data);
    });
    window.addEventListener('pagehide', function () { void stopMonitor(); });
    window.addEventListener('beforeunload', function () { void stopMonitor(); });
    const initializationPromise = initialize();
  </script>
</body>
</html>
