<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>硬件监控</title>
</head>
<body>
  <main class="long-page long-page--wide">
    <header class="long-page-header">
      <div>
        <div class="long-eyebrow">SYSTEM PERFORMANCE</div>
        <h1 class="long-page-title" data-i18n="page.title">硬件监控</h1>
        <p class="long-page-description" data-i18n="page.description">查看当前 CPU、内存、磁盘与高占用进程，页面隐藏时自动暂停轮询。</p>
      </div>
      <div class="long-toolbar">
        <span class="long-badge" id="refreshBadge">每 2 秒刷新</span>
        <button class="long-button long-button--primary btn-primary" id="refreshButton" type="button">立即刷新</button>
      </div>
    </header>

    <div class="long-stack">
      <section class="long-stack" aria-labelledby="overviewTitle">
        <h2 class="long-section-title" id="overviewTitle" data-i18n="section.overview">实时概览</h2>
        <div class="long-metric-grid">
          <article class="long-card long-metric">
            <div class="long-metric__label" data-i18n="metric.cpu.label">CPU 使用率</div>
            <div class="long-metric__value" id="cpuValue">--</div>
            <div class="long-metric__detail" data-i18n="metric.cpu.detail">处理器总负载</div>
            <div class="long-progress" id="cpuProgress" role="progressbar" aria-label="CPU 使用率" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div class="long-progress__fill" id="cpuBar"></div>
            </div>
          </article>

          <article class="long-card long-metric">
            <div class="long-metric__label" data-i18n="metric.memory.label">内存使用率</div>
            <div class="long-metric__value" id="memValue">--</div>
            <div class="long-metric__detail" id="memLabel">等待数据</div>
            <div class="long-progress" id="memProgress" role="progressbar" aria-label="内存使用率" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div class="long-progress__fill" id="memBar"></div>
            </div>
          </article>

          <article class="long-card long-metric">
            <div class="long-metric__label" data-i18n="metric.uptime.label">系统运行时间</div>
            <div class="long-metric__value" id="uptimeValue">--</div>
            <div class="long-metric__detail" data-i18n="metric.uptime.detail">自上次启动</div>
          </article>
        </div>
      </section>

      <section class="long-stack" aria-labelledby="systemTitle">
        <h2 class="long-section-title" id="systemTitle" data-i18n="section.system">系统信息</h2>
        <div class="long-card long-key-value">
          <div class="long-key-value__row">
            <span class="long-key-value__label" data-i18n="system.os">操作系统</span>
            <span class="long-key-value__value" id="osName">--</span>
          </div>
          <div class="long-key-value__row">
            <span class="long-key-value__label" data-i18n="system.machine">计算机名</span>
            <span class="long-key-value__value" id="machineName">--</span>
          </div>
          <div class="long-key-value__row">
            <span class="long-key-value__label" data-i18n="system.processor">处理器</span>
            <span class="long-key-value__value" id="processorName">--</span>
          </div>
          <div class="long-key-value__row">
            <span class="long-key-value__label" data-i18n="system.processorCount">逻辑处理器</span>
            <span class="long-key-value__value" id="processorCount">--</span>
          </div>
          <div class="long-key-value__row">
            <span class="long-key-value__label" data-i18n="system.totalMemory">总内存</span>
            <span class="long-key-value__value" id="totalRam">--</span>
          </div>
        </div>
      </section>

      <section class="long-stack" aria-labelledby="diskTitle">
        <h2 class="long-section-title" id="diskTitle" data-i18n="section.disks">磁盘使用情况</h2>
        <div class="long-grid" id="diskList"></div>
      </section>

      <section class="long-stack" aria-labelledby="processTitle">
        <h2 class="long-section-title" id="processTitle" data-i18n="section.processes">内存占用 Top 10</h2>
        <div class="long-data-grid" role="table" aria-label="内存占用最高的进程" style="--long-data-columns: 2fr 1fr 1fr 1fr">
          <div role="rowgroup">
            <div class="long-data-grid__header" role="row">
              <div role="columnheader" data-i18n="process.name">进程名称</div>
              <div role="columnheader" data-i18n="process.pid">PID</div>
              <div role="columnheader" data-i18n="process.memory">内存</div>
              <div role="columnheader" data-i18n="process.threads">线程数</div>
            </div>
          </div>
          <div id="processList" role="rowgroup"></div>
        </div>
      </section>

      <div class="long-status" id="status" role="status" aria-live="polite"></div>
    </div>
  </main>

  <script>
    const refreshInterval = 2000;
    const detailRefreshInterval = 10000;
    const cpuWarningThreshold = 80;
    const memWarningThreshold = 85;
    const refreshButton = document.getElementById('refreshButton');
    const status = document.getElementById('status');
    let refreshTimer = 0;
    let refreshPromise = null;
    let queuedManualRefresh = null;
    let lastDetailRefreshAt = 0;
    let strings = {};
    let isRefreshing = false;
    let systemInfoState = { kind: 'loading', info: null, detail: '' };
    let metricsState = {
      kind: 'loading',
      cpuUsage: null,
      memory: null,
      disks: [],
      processes: [],
      cpuAvailable: false,
      memoryAvailable: false,
      disksAvailable: false,
      processesAvailable: false,
      cpuError: '',
      memoryError: '',
      disksError: '',
      processesError: '',
      updatedAt: 0,
    };
    let currentStatus = { key: '', fallback: '', values: {}, kind: '' };

    function t(key, fallback, values) {
      const template = strings[key] || fallback || key;
      return Object.entries(values || {}).reduce(function (text, entry) {
        return text.replaceAll('{' + entry[0] + '}', String(entry[1]));
      }, template);
    }

    function setStatus(key, kind, fallback, values) {
      const previousMessage = status.textContent;
      const previousKind = currentStatus.kind;
      currentStatus = { key, kind, fallback: fallback || '', values: values || {} };
      const message = key
        ? t(key, fallback, currentStatus.values)
        : currentStatus.fallback;
      status.textContent = message;
      status.className = 'long-status ' + (kind ? 'long-status--' + kind : '');
      if (message && (message !== previousMessage || kind !== previousKind)) {
        window.LongUI?.announce(message);
      }
      return message;
    }

    function renderRefreshState() {
      refreshButton.textContent = isRefreshing
        ? t('action.refreshing', '刷新中…')
        : t('action.refresh', '立即刷新');
      const badge = document.getElementById('refreshBadge');
      badge.textContent = metricsState.updatedAt
        ? t(
          'refresh.updatedAt',
          '更新于 {time}',
          {
            time: new Date(metricsState.updatedAt).toLocaleTimeString(
              document.documentElement.lang,
              { hour12: false })
          })
        : t(
          'refresh.interval',
          '每 {seconds} 秒刷新',
          { seconds: refreshInterval / 1000 });
    }

    function renderSystemInfo() {
      const ids = ['osName', 'machineName', 'processorName', 'processorCount', 'totalRam'];
      if (systemInfoState.kind === 'loading') {
        ids.forEach(function (id) { document.getElementById(id).textContent = '--'; });
        document.getElementById('uptimeValue').textContent = '--';
        return;
      }
      if (systemInfoState.kind === 'error') {
        ids.forEach(function (id) {
          document.getElementById(id).textContent = t('value.unavailable', '不可用');
        });
        document.getElementById('uptimeValue').textContent = '--';
        return;
      }
      const info = systemInfoState.info || {};
      const unknown = t('value.unknown', '未知');
      document.getElementById('osName').textContent =
        [info.OsName, info.OsVersion].filter(Boolean).join(' · ') || unknown;
      document.getElementById('machineName').textContent = info.MachineName || unknown;
      document.getElementById('processorName').textContent = info.ProcessorName || unknown;
      document.getElementById('processorCount').textContent = t(
        'value.cores',
        '{count} 核心',
        { count: Number(info.ProcessorCount || 0) });
      document.getElementById('totalRam').textContent = formatBytes(info.TotalRam);
      document.getElementById('uptimeValue').textContent = formatUptime(info.Uptime);
    }

    function renderMetricsProjection() {
      renderRefreshState();
      if (metricsState.kind === 'loading') {
        document.getElementById('memLabel').textContent =
          t('metric.memory.waiting', '等待数据');
        renderLoadingStates();
        return;
      }
      if (metricsState.cpuAvailable) updateCpu(metricsState.cpuUsage);
      else renderMetricUnavailable('cpuValue', 'cpuProgress', 'cpuBar');
      if (metricsState.memoryAvailable) updateMemory(metricsState.memory || {});
      else {
        renderMetricUnavailable('memValue', 'memProgress', 'memBar');
        document.getElementById('memLabel').textContent =
          t('value.unavailable', '不可用');
      }
      updateDisks(
        metricsState.disks,
        metricsState.disksAvailable,
        metricsState.disksError);
      updateProcesses(
        metricsState.processes,
        metricsState.processesAvailable,
        metricsState.processesError);
    }

    function applyLocalization(message) {
      strings = message.resources || {};
      document.documentElement.lang = message.resolved_language || 'zh-CN';
      document.title = t('plugin.name', '硬件监控');
      document.querySelectorAll('[data-i18n]').forEach(function (element) {
        element.textContent = t(element.dataset.i18n, element.textContent);
      });
      document.getElementById('cpuProgress').setAttribute(
        'aria-label',
        t('metric.cpu.ariaLabel', 'CPU 使用率'));
      document.getElementById('memProgress').setAttribute(
        'aria-label',
        t('metric.memory.ariaLabel', '内存使用率'));
      document.querySelector('.long-data-grid').setAttribute(
        'aria-label',
        t('process.tableAriaLabel', '内存占用最高的进程'));
      renderSystemInfo();
      renderMetricsProjection();
      if (currentStatus.key || currentStatus.fallback) {
        setStatus(
          currentStatus.key,
          currentStatus.kind,
          currentStatus.fallback,
          currentStatus.values);
      }
    }

    async function initialize() {
      renderSystemInfo();
      renderMetricsProjection();
      await Promise.all([loadSystemInfo(), updateMetrics()]);
      startPolling();
    }

    function renderLoadingStates() {
      window.LongUI?.renderState(document.getElementById('diskList'), {
        kind: 'loading',
        title: t('state.diskLoading', '正在加载磁盘信息')
      });
      window.LongUI?.renderState(document.getElementById('processList'), {
        kind: 'loading',
        title: t('state.processLoading', '正在加载进程信息')
      });
    }

    async function loadSystemInfo() {
      try {
        const info = unwrap(
          await long.performance.getSystemInfo(),
          t('error.systemInfo', '系统信息加载失败'));
        systemInfoState = { kind: 'ready', info: info || {}, detail: '' };
        renderSystemInfo();
        return true;
      } catch (error) {
        const detail = errorMessage(error, t('error.systemInfo', '系统信息加载失败'));
        systemInfoState = { kind: 'error', info: null, detail: detail };
        renderSystemInfo();
        setStatus(
          'status.systemInfoFailed',
          'danger',
          '系统信息加载失败：{detail}',
          { detail: detail });
        return false;
      }
    }

    function updateMetrics(manual) {
      if (refreshPromise) {
        if (!manual) return refreshPromise;
        if (!queuedManualRefresh) {
          queuedManualRefresh = refreshPromise
            .then(function () { return updateMetrics(true); })
            .finally(function () { queuedManualRefresh = null; });
        }
        return queuedManualRefresh;
      }
      refreshPromise = performMetricsUpdate(!!manual).finally(function () {
        refreshPromise = null;
      });
      return refreshPromise;
    }

    async function performMetricsUpdate(manual) {
      isRefreshing = true;
      window.LongUI?.setBusy(refreshButton, true);
      renderRefreshState();
      try {
        const now = Date.now();
        const includeDetails = manual
          || !lastDetailRefreshAt
          || now - lastDetailRefreshAt >= detailRefreshInterval;
        if (includeDetails) lastDetailRefreshAt = now;

        const requests = [
          readMetric(
            function () { return long.performance.getCpuUsage(); },
            t('error.cpu', 'CPU 数据加载失败')),
          readMetric(
            function () { return long.performance.getMemoryInfo(); },
            t('error.memory', '内存数据加载失败'))
        ];
        if (includeDetails) {
          requests.push(
            readMetric(
              function () { return long.performance.getDiskInfo(); },
              t('error.disks', '磁盘数据加载失败')),
            readMetric(
              function () { return long.performance.getTopByMemory(10); },
              t('error.processes', '进程数据加载失败')));
        }

        const results = await Promise.allSettled(requests);
        const next = { ...metricsState, kind: 'ready' };
        applyMetricResult(next, results[0], 'cpuUsage', 'cpuAvailable', 'cpuError');
        applyMetricResult(next, results[1], 'memory', 'memoryAvailable', 'memoryError');
        if (includeDetails) {
          applyMetricResult(next, results[2], 'disks', 'disksAvailable', 'disksError', true);
          applyMetricResult(next, results[3], 'processes', 'processesAvailable', 'processesError', true);
        }
        if (results.some(function (result) { return result.status === 'fulfilled'; })) {
          next.updatedAt = now;
        }
        const activeFailures = [...new Set([
          next.cpuError,
          next.memoryError,
          next.disksError,
          next.processesError
        ].filter(Boolean))];
        metricsState = next;
        renderMetricsProjection();
        if (activeFailures.length) {
          setStatus(
            'status.partialFailed',
            'danger',
            '部分性能数据暂不可用：{detail}',
            { detail: activeFailures.join('; ') });
        } else if (manual) {
          setStatus('status.refreshed', 'success', '硬件信息已刷新');
        } else if (currentStatus.key === 'status.partialFailed') {
          setStatus('', '', '');
        }
        return activeFailures.length === 0;
      } catch (error) {
        const detail = errorMessage(error, t('error.metrics', '性能数据加载失败'));
        setStatus(
          'status.refreshFailed',
          'danger',
          '硬件信息刷新失败：{detail}',
          { detail: detail });
        return false;
      } finally {
        isRefreshing = false;
        window.LongUI?.setBusy(refreshButton, false);
        renderRefreshState();
      }
    }

    async function readMetric(request, fallback) {
      return unwrap(await request(), fallback);
    }

    function applyMetricResult(
      target,
      result,
      valueKey,
      availableKey,
      errorKey,
      expectArray) {
      if (result.status === 'fulfilled') {
        target[valueKey] = expectArray && !Array.isArray(result.value) ? [] : result.value;
        target[availableKey] = true;
        target[errorKey] = '';
        return;
      }
      const detail = errorMessage(result.reason, t('error.metrics', '性能数据加载失败'));
      target[errorKey] = detail;
    }

    function renderMetricUnavailable(valueId, progressId, barId) {
      const value = document.getElementById(valueId);
      value.textContent = '--';
      value.classList.remove('long-metric__value--warning');
      const bar = document.getElementById(barId);
      bar.style.width = '0%';
      bar.classList.remove('long-progress__fill--warning');
      document.getElementById(progressId).setAttribute('aria-valuenow', '0');
    }

    function updateCpu(value) {
      const usage = percentage(value);
      const isWarning = usage >= cpuWarningThreshold;
      document.getElementById('cpuValue').textContent = Math.round(usage) + '%';
      document.getElementById('cpuValue').classList.toggle('long-metric__value--warning', isWarning);
      document.getElementById('cpuBar').style.width = usage + '%';
      document.getElementById('cpuBar').classList.toggle('long-progress__fill--warning', isWarning);
      document.getElementById('cpuProgress').setAttribute('aria-valuenow', String(Math.round(usage)));
    }

    function updateMemory(info) {
      const usage = percentage(info.UsagePercentage);
      const isWarning = usage >= memWarningThreshold;
      document.getElementById('memValue').textContent = Math.round(usage) + '%';
      document.getElementById('memValue').classList.toggle('long-metric__value--warning', isWarning);
      document.getElementById('memLabel').textContent =
        formatBytes(info.UsedPhysicalMemory) + ' / ' + formatBytes(info.TotalPhysicalMemory);
      document.getElementById('memBar').style.width = usage + '%';
      document.getElementById('memBar').classList.toggle('long-progress__fill--warning', isWarning);
      document.getElementById('memProgress').setAttribute('aria-valuenow', String(Math.round(usage)));
    }

    function updateDisks(disks, available, detail) {
      const list = document.getElementById('diskList');
      list.replaceChildren();
      if (!available) {
        window.LongUI?.renderState(list, {
          kind: 'error',
          title: t('state.diskFailed', '磁盘信息加载失败'),
          detail: detail,
          actionLabel: t('action.retry', '重试'),
          onAction: function () { void updateMetrics(true); }
        });
        return;
      }
      if (!disks.length) {
        window.LongUI?.renderState(list, {
          kind: 'empty',
          title: t('state.noDisks', '暂无磁盘信息')
        });
        return;
      }

      disks.forEach(function (disk) {
        const usage = percentage(disk.UsagePercentage);
        const diskName = disk.Name || t('disk.unknown', '未知磁盘');
        const card = document.createElement('article');
        card.className = 'long-card long-metric';
        appendText(
          card,
          'div',
          'long-metric__label',
          disk.DriveType || t('disk.defaultType', '磁盘'));
        appendText(card, 'div', 'long-metric__value', diskName);
        appendText(
          card,
          'div',
          'long-metric__detail',
          t(
            'disk.used',
            '{used} / {total} · 已用 {usage}%',
            {
              used: formatBytes(disk.UsedSpace),
              total: formatBytes(disk.TotalSize),
              usage: Math.round(usage)
            }));
        const progress = document.createElement('div');
        progress.className = 'long-progress';
        progress.setAttribute('role', 'progressbar');
        progress.setAttribute(
          'aria-label',
          t(
            'disk.usageAriaLabel',
            '{name} 使用率',
            { name: diskName }));
        progress.setAttribute('aria-valuemin', '0');
        progress.setAttribute('aria-valuemax', '100');
        progress.setAttribute('aria-valuenow', String(Math.round(usage)));
        const fill = document.createElement('div');
        fill.className = 'long-progress__fill' + (usage > 90 ? ' long-progress__fill--warning' : '');
        fill.style.width = usage + '%';
        progress.appendChild(fill);
        card.appendChild(progress);
        list.appendChild(card);
      });
    }

    function updateProcesses(processes, available, detail) {
      const list = document.getElementById('processList');
      list.replaceChildren();
      if (!available) {
        window.LongUI?.renderState(list, {
          kind: 'error',
          title: t('state.processFailed', '进程信息加载失败'),
          detail: detail,
          actionLabel: t('action.retry', '重试'),
          onAction: function () { void updateMetrics(true); }
        });
        return;
      }
      if (!processes.length) {
        window.LongUI?.renderState(list, {
          kind: 'empty',
          title: t('state.noProcesses', '暂无进程信息')
        });
        return;
      }

      processes.forEach(function (process) {
        const row = document.createElement('div');
        row.className = 'long-data-grid__row';
        row.setAttribute('role', 'row');
        appendDataCell(
          row,
          t('process.name', '进程名称'),
          process.ProcessName || t('process.unknown', '未知进程'));
        appendDataCell(row, t('process.pid', 'PID'), process.ProcessId);
        appendDataCell(
          row,
          t('process.memory', '内存'),
          formatBytes(process.MemoryUsage));
        appendDataCell(
          row,
          t('process.threads', '线程数'),
          process.ThreadCount);
        list.appendChild(row);
      });
    }

    function appendDataCell(parent, label, value) {
      const cell = appendText(parent, 'div', 'long-data-grid__cell', String(value ?? ''));
      cell.dataset.label = label;
      cell.setAttribute('role', 'cell');
      return cell;
    }

    function appendText(parent, tagName, className, text) {
      const element = document.createElement(tagName);
      if (className) element.className = className;
      element.textContent = String(text ?? '');
      parent.appendChild(element);
      return element;
    }

    function unwrap(response, fallback) {
      if (!response || !response.success) {
        throw new Error(response && response.error ? response.error : fallback);
      }
      return response.data;
    }

    function percentage(value) {
      return Math.max(0, Math.min(100, Number(value) || 0));
    }

    function formatBytes(value) {
      const bytes = Number(value);
      if (!Number.isFinite(bytes) || bytes <= 0) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      const index = Math.min(units.length - 1, Math.floor(Math.log(bytes) / Math.log(1024)));
      return (bytes / Math.pow(1024, index)).toFixed(index > 2 ? 1 : 0) + ' ' + units[index];
    }

    function formatUptime(value) {
      const match = typeof value === 'string'
        ? /^(?:(\d+)\.)?(\d+):(\d+)/.exec(value)
        : null;
      if (!match) return '--';
      const hours = Number(match[1] || 0) * 24 + Number(match[2] || 0);
      return t(
        'value.uptime',
        '{hours} 小时 {minutes} 分',
        { hours: hours, minutes: Number(match[3] || 0) });
    }

    function errorMessage(error, fallback) {
      return error && error.message ? error.message : fallback;
    }

    function isPageActive() {
      return window.long?.host?.isVisible?.() !== false && !document.hidden;
    }

    function startPolling() {
      stopPolling();
      if (isPageActive()) {
        refreshTimer = window.setInterval(function () { void updateMetrics(false); }, refreshInterval);
      }
    }

    function stopPolling() {
      window.clearInterval(refreshTimer);
      refreshTimer = 0;
    }

    refreshButton.addEventListener('click', function () { void updateMetrics(true); });
    document.addEventListener('keydown', function (event) {
      if (event.key === 'F5') {
        event.preventDefault();
        void updateMetrics(true);
      }
    });
    document.addEventListener('visibilitychange', function () {
      if (!isPageActive()) stopPolling();
      else {
        void updateMetrics(false);
        startPolling();
      }
    });
    window.addEventListener('pagehide', stopPolling);
    window.LongUI?.onCommand(async function () {
      const success = await updateMetrics(true);
      return {
        success: success,
        message: success
          ? t('command.refreshed', '硬件信息已刷新')
          : t('command.refreshFailed', '硬件信息刷新失败')
      };
    });
    window.addEventListener('long-host-visibilitychange', function () {
      if (!isPageActive()) stopPolling();
      else {
        void updateMetrics(false);
        startPolling();
      }
    });
    window.chrome?.webview?.addEventListener('message', function ({ data }) {
      if (data?.type === 'long.language-changed') applyLocalization(data);
    });
    initialize();
  </script>
</body>
</html>
