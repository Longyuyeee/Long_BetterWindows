<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>硬件监控</title>
</head>
<body>
  <main class="long-page long-page--wide">
    <header class="long-page-header">
      <div>
        <div class="long-eyebrow">SYSTEM PERFORMANCE</div>
        <h1 class="long-page-title">硬件监控</h1>
        <p class="long-page-description">查看当前 CPU、内存、磁盘与高占用进程，页面隐藏时自动暂停轮询。</p>
      </div>
      <div class="long-toolbar">
        <span class="long-badge" id="refreshBadge">每 2 秒刷新</span>
        <button class="long-button long-button--primary btn-primary" id="refreshButton" type="button">立即刷新</button>
      </div>
    </header>

    <div class="long-stack">
      <section class="long-stack" aria-labelledby="overviewTitle">
        <h2 class="long-section-title" id="overviewTitle">实时概览</h2>
        <div class="long-metric-grid">
          <article class="long-card long-metric">
            <div class="long-metric__label">CPU 使用率</div>
            <div class="long-metric__value" id="cpuValue">--</div>
            <div class="long-metric__detail">处理器总负载</div>
            <div class="long-progress" id="cpuProgress" role="progressbar" aria-label="CPU 使用率" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div class="long-progress__fill" id="cpuBar"></div>
            </div>
          </article>

          <article class="long-card long-metric">
            <div class="long-metric__label">内存使用率</div>
            <div class="long-metric__value" id="memValue">--</div>
            <div class="long-metric__detail" id="memLabel">等待数据</div>
            <div class="long-progress" id="memProgress" role="progressbar" aria-label="内存使用率" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div class="long-progress__fill" id="memBar"></div>
            </div>
          </article>

          <article class="long-card long-metric">
            <div class="long-metric__label">系统运行时间</div>
            <div class="long-metric__value" id="uptimeValue">--</div>
            <div class="long-metric__detail">自上次启动</div>
          </article>
        </div>
      </section>

      <section class="long-stack" aria-labelledby="systemTitle">
        <h2 class="long-section-title" id="systemTitle">系统信息</h2>
        <div class="long-card long-key-value">
          <div class="long-key-value__row">
            <span class="long-key-value__label">操作系统</span>
            <span class="long-key-value__value" id="osName">--</span>
          </div>
          <div class="long-key-value__row">
            <span class="long-key-value__label">计算机名</span>
            <span class="long-key-value__value" id="machineName">--</span>
          </div>
          <div class="long-key-value__row">
            <span class="long-key-value__label">处理器</span>
            <span class="long-key-value__value" id="processorName">--</span>
          </div>
          <div class="long-key-value__row">
            <span class="long-key-value__label">逻辑处理器</span>
            <span class="long-key-value__value" id="processorCount">--</span>
          </div>
          <div class="long-key-value__row">
            <span class="long-key-value__label">总内存</span>
            <span class="long-key-value__value" id="totalRam">--</span>
          </div>
        </div>
      </section>

      <section class="long-stack" aria-labelledby="diskTitle">
        <h2 class="long-section-title" id="diskTitle">磁盘使用情况</h2>
        <div class="long-grid" id="diskList"></div>
      </section>

      <section class="long-stack" aria-labelledby="processTitle">
        <h2 class="long-section-title" id="processTitle">内存占用 Top 10</h2>
        <div class="long-data-grid" role="table" aria-label="内存占用最高的进程" style="--long-data-columns: 2fr 1fr 1fr 1fr">
          <div role="rowgroup">
            <div class="long-data-grid__header" role="row">
              <div role="columnheader">进程名称</div>
              <div role="columnheader">PID</div>
              <div role="columnheader">内存</div>
              <div role="columnheader">线程数</div>
            </div>
          </div>
          <div id="processList" role="rowgroup"></div>
        </div>
      </section>

      <div class="long-status" id="status" role="status" aria-live="polite"></div>
    </div>
  </main>

  <script>
    const refreshInterval = 2000;
    const cpuWarningThreshold = 80;
    const memWarningThreshold = 85;
    const refreshButton = document.getElementById('refreshButton');
    const status = document.getElementById('status');
    let refreshTimer = 0;
    let refreshPromise = null;

    async function initialize() {
      renderLoadingStates();
      await Promise.all([loadSystemInfo(), updateMetrics()]);
      startPolling();
    }

    function renderLoadingStates() {
      window.LongUI?.renderState(document.getElementById('diskList'), {
        kind: 'loading',
        title: '正在加载磁盘信息'
      });
      window.LongUI?.renderState(document.getElementById('processList'), {
        kind: 'loading',
        title: '正在加载进程信息'
      });
    }

    async function loadSystemInfo() {
      try {
        const info = unwrap(await long.performance.getSystemInfo(), '系统信息加载失败');
        document.getElementById('osName').textContent =
          [info.OsName, info.OsVersion].filter(Boolean).join(' · ') || '未知';
        document.getElementById('machineName').textContent = info.MachineName || '未知';
        document.getElementById('processorName').textContent = info.ProcessorName || '未知';
        document.getElementById('processorCount').textContent = Number(info.ProcessorCount || 0) + ' 核心';
        document.getElementById('totalRam').textContent = formatBytes(info.TotalRam);
        document.getElementById('uptimeValue').textContent = formatUptime(info.Uptime);
        return true;
      } catch (error) {
        ['osName', 'machineName', 'processorName', 'processorCount', 'totalRam'].forEach(function (id) {
          document.getElementById(id).textContent = '不可用';
        });
        document.getElementById('uptimeValue').textContent = '--';
        setStatus(errorMessage(error, '系统信息加载失败'), 'danger');
        return false;
      }
    }

    function updateMetrics(manual) {
      if (refreshPromise) return refreshPromise;
      refreshPromise = performMetricsUpdate(!!manual).finally(function () {
        refreshPromise = null;
      });
      return refreshPromise;
    }

    async function performMetricsUpdate(manual) {
      window.LongUI?.setBusy(refreshButton, true);
      try {
        const results = await Promise.all([
          long.performance.getCpuUsage(),
          long.performance.getMemoryInfo(),
          long.performance.getDiskInfo(),
          long.performance.getTopByMemory(10)
        ]);
        const cpuUsage = unwrap(results[0], 'CPU 数据加载失败');
        const memory = unwrap(results[1], '内存数据加载失败');
        const disks = unwrap(results[2], '磁盘数据加载失败');
        const processes = unwrap(results[3], '进程数据加载失败');

        updateCpu(cpuUsage);
        updateMemory(memory);
        updateDisks(Array.isArray(disks) ? disks : []);
        updateProcesses(Array.isArray(processes) ? processes : []);
        document.getElementById('refreshBadge').textContent =
          '更新于 ' + new Date().toLocaleTimeString([], { hour12: false });
        if (manual) setStatus('硬件信息已刷新', 'success');
        return true;
      } catch (error) {
        const detail = errorMessage(error, '性能数据加载失败');
        renderMetricsError(detail);
        setStatus(detail, 'danger');
        return false;
      } finally {
        window.LongUI?.setBusy(refreshButton, false);
      }
    }

    function renderMetricsError(detail) {
      window.LongUI?.renderState(document.getElementById('diskList'), {
        kind: 'error',
        title: '磁盘信息加载失败',
        detail: detail,
        actionLabel: '重试',
        onAction: function () { void updateMetrics(true); }
      });
      window.LongUI?.renderState(document.getElementById('processList'), {
        kind: 'error',
        title: '进程信息加载失败',
        detail: detail
      });
    }

    function updateCpu(value) {
      const usage = percentage(value);
      const isWarning = usage >= cpuWarningThreshold;
      document.getElementById('cpuValue').textContent = Math.round(usage) + '%';
      document.getElementById('cpuValue').classList.toggle('long-metric__value--warning', isWarning);
      document.getElementById('cpuBar').style.width = usage + '%';
      document.getElementById('cpuBar').classList.toggle('long-progress__fill--warning', isWarning);
      document.getElementById('cpuProgress').setAttribute('aria-valuenow', String(Math.round(usage)));
    }

    function updateMemory(info) {
      const usage = percentage(info.UsagePercentage);
      const isWarning = usage >= memWarningThreshold;
      document.getElementById('memValue').textContent = Math.round(usage) + '%';
      document.getElementById('memValue').classList.toggle('long-metric__value--warning', isWarning);
      document.getElementById('memLabel').textContent =
        formatBytes(info.UsedPhysicalMemory) + ' / ' + formatBytes(info.TotalPhysicalMemory);
      document.getElementById('memBar').style.width = usage + '%';
      document.getElementById('memBar').classList.toggle('long-progress__fill--warning', isWarning);
      document.getElementById('memProgress').setAttribute('aria-valuenow', String(Math.round(usage)));
    }

    function updateDisks(disks) {
      const list = document.getElementById('diskList');
      list.replaceChildren();
      if (!disks.length) {
        window.LongUI?.renderState(list, { kind: 'empty', title: '暂无磁盘信息' });
        return;
      }

      disks.forEach(function (disk) {
        const usage = percentage(disk.UsagePercentage);
        const card = document.createElement('article');
        card.className = 'long-card long-metric';
        appendText(card, 'div', 'long-metric__label', disk.DriveType || '磁盘');
        appendText(card, 'div', 'long-metric__value', disk.Name || '未知磁盘');
        appendText(
          card,
          'div',
          'long-metric__detail',
          formatBytes(disk.UsedSpace) + ' / ' + formatBytes(disk.TotalSize) + ' · ' + Math.round(usage) + '% 已用');
        const progress = document.createElement('div');
        progress.className = 'long-progress';
        progress.setAttribute('role', 'progressbar');
        progress.setAttribute('aria-label', (disk.Name || '磁盘') + ' 使用率');
        progress.setAttribute('aria-valuemin', '0');
        progress.setAttribute('aria-valuemax', '100');
        progress.setAttribute('aria-valuenow', String(Math.round(usage)));
        const fill = document.createElement('div');
        fill.className = 'long-progress__fill' + (usage > 90 ? ' long-progress__fill--warning' : '');
        fill.style.width = usage + '%';
        progress.appendChild(fill);
        card.appendChild(progress);
        list.appendChild(card);
      });
    }

    function updateProcesses(processes) {
      const list = document.getElementById('processList');
      list.replaceChildren();
      if (!processes.length) {
        window.LongUI?.renderState(list, { kind: 'empty', title: '暂无进程信息' });
        return;
      }

      processes.forEach(function (process) {
        const row = document.createElement('div');
        row.className = 'long-data-grid__row';
        row.setAttribute('role', 'row');
        appendDataCell(row, '进程名称', process.ProcessName || '未知进程');
        appendDataCell(row, 'PID', process.ProcessId);
        appendDataCell(row, '内存', formatBytes(process.MemoryUsage));
        appendDataCell(row, '线程数', process.ThreadCount);
        list.appendChild(row);
      });
    }

    function appendDataCell(parent, label, value) {
      const cell = appendText(parent, 'div', 'long-data-grid__cell', String(value ?? ''));
      cell.dataset.label = label;
      cell.setAttribute('role', 'cell');
      return cell;
    }

    function appendText(parent, tagName, className, text) {
      const element = document.createElement(tagName);
      if (className) element.className = className;
      element.textContent = String(text ?? '');
      parent.appendChild(element);
      return element;
    }

    function unwrap(response, fallback) {
      if (!response || !response.success) {
        throw new Error(response && response.error ? response.error : fallback);
      }
      return response.data;
    }

    function percentage(value) {
      return Math.max(0, Math.min(100, Number(value) || 0));
    }

    function formatBytes(value) {
      const bytes = Number(value);
      if (!Number.isFinite(bytes) || bytes <= 0) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      const index = Math.min(units.length - 1, Math.floor(Math.log(bytes) / Math.log(1024)));
      return (bytes / Math.pow(1024, index)).toFixed(index > 2 ? 1 : 0) + ' ' + units[index];
    }

    function formatUptime(value) {
      const match = typeof value === 'string'
        ? /^(?:(\d+)\.)?(\d+):(\d+)/.exec(value)
        : null;
      if (!match) return '--';
      const hours = Number(match[1] || 0) * 24 + Number(match[2] || 0);
      return hours + 'h ' + Number(match[3] || 0) + 'm';
    }

    function errorMessage(error, fallback) {
      return error && error.message ? error.message : fallback;
    }

    function setStatus(message, kind) {
      status.textContent = message;
      status.className = 'long-status ' + (kind ? 'long-status--' + kind : '');
      window.LongUI?.announce(message);
    }

    function startPolling() {
      stopPolling();
      if (!document.hidden) {
        refreshTimer = window.setInterval(function () { void updateMetrics(false); }, refreshInterval);
      }
    }

    function stopPolling() {
      window.clearInterval(refreshTimer);
      refreshTimer = 0;
    }

    refreshButton.addEventListener('click', function () { void updateMetrics(true); });
    document.addEventListener('keydown', function (event) {
      if (event.key === 'F5') {
        event.preventDefault();
        void updateMetrics(true);
      }
    });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) stopPolling();
      else {
        void updateMetrics(false);
        startPolling();
      }
    });
    window.LongUI?.onCommand(async function () {
      const success = await updateMetrics(true);
      return {
        success: success,
        message: success ? '硬件信息已刷新' : '硬件信息刷新失败'
      };
    });
    initialize();
  </script>
</body>
</html>
