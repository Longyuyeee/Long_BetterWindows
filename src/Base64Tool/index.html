<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Base64 编解码</title>
</head>
<body>
  <main class="long-page">
    <header class="long-page-header">
      <div>
        <div class="long-eyebrow">TEXT TRANSFORM</div>
        <h1 class="long-page-title" data-i18n="page.title">Base64 编解码</h1>
        <p class="long-page-description" data-i18n="page.description">在纯文本与 Base64 之间快速转换，结果可直接复制。</p>
      </div>
      <span class="long-badge" data-i18n="page.localBadge">本地处理</span>
    </header>

    <section class="long-stack" id="converterSection" aria-label="Base64 转换器">
      <div class="long-card long-field">
        <label class="long-field-label" for="input" data-i18n="field.input">原始内容</label>
        <textarea class="long-editor" id="input" placeholder="输入文本，或从命令中心携带剪贴板内容…" autofocus></textarea>
      </div>

      <div class="long-toolbar">
        <button class="long-button long-button--primary btn-primary" id="encodeButton" type="button" data-i18n="action.encode">编码</button>
        <button class="long-button long-button--secondary btn-secondary" id="decodeButton" type="button" data-i18n="action.decode">解码</button>
        <button class="long-button long-button--secondary btn-secondary" id="pasteButton" type="button" data-i18n="action.paste">粘贴</button>
        <span class="long-toolbar__spacer"></span>
        <span class="long-kbd">Ctrl Enter</span>
      </div>

      <div class="long-card long-field">
        <label class="long-field-label" for="output" data-i18n="field.output">转换结果</label>
        <textarea class="long-editor" id="output" placeholder="结果将在这里显示" readonly></textarea>
        <div class="long-toolbar">
          <div id="status" class="long-status" role="status" aria-live="polite"></div>
          <span class="long-toolbar__spacer"></span>
          <button class="long-button long-button--secondary btn-secondary" id="copyButton" type="button" data-i18n="action.copy" disabled>复制结果</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const input = document.getElementById('input');
    const output = document.getElementById('output');
    const status = document.getElementById('status');
    const copyButton = document.getElementById('copyButton');
    const maxCommandOutputLength = 65536;
    let strings = {};
    let currentStatusKey = '';
    let currentStatusFallback = '';
    let currentStatusKind = '';

    function t(key, fallback) {
      return strings[key] || fallback || key;
    }

    function renderStatus() {
      const message = currentStatusKey
        ? t(currentStatusKey, currentStatusFallback)
        : '';
      status.textContent = message;
      status.className = 'long-status ' +
        (currentStatusKind ? 'long-status--' + currentStatusKind : '');
      return message;
    }

    function setStatus(key, kind, fallback) {
      currentStatusKey = key;
      currentStatusFallback = fallback;
      currentStatusKind = kind;
      const message = renderStatus();
      if (message) window.LongUI?.announce(message);
      return message;
    }

    function applyLocalization(message) {
      strings = message.resources || {};
      document.documentElement.lang = message.resolved_language || 'zh-CN';
      document.title = t('plugin.name', 'Base64 编解码');
      document.querySelectorAll('[data-i18n]').forEach(element => {
        element.textContent = t(element.dataset.i18n, element.textContent);
      });
      document.getElementById('converterSection').setAttribute(
        'aria-label',
        t('converter.ariaLabel', 'Base64 转换器'));
      input.placeholder = t(
        'field.inputPlaceholder',
        '输入文本，或从命令中心携带剪贴板内容…');
      output.placeholder = t('field.outputPlaceholder', '结果将在这里显示');
      renderStatus();
    }

    function clearResult() {
      output.value = '';
      copyButton.disabled = true;
    }

    function invalidateResult() {
      clearResult();
      setStatus('', '', '');
    }

    function isWellFormedUnicode(value) {
      for (let index = 0; index < value.length; index += 1) {
        const code = value.charCodeAt(index);
        if (code >= 0xd800 && code <= 0xdbff) {
          const next = value.charCodeAt(index + 1);
          if (!(next >= 0xdc00 && next <= 0xdfff)) return false;
          index += 1;
        } else if (code >= 0xdc00 && code <= 0xdfff) {
          return false;
        }
      }
      return true;
    }

    function bytesToBase64(bytes) {
      let binary = '';
      for (let offset = 0; offset < bytes.length; offset += 32768) {
        binary += String.fromCharCode(...bytes.subarray(offset, offset + 32768));
      }
      return btoa(binary);
    }

    function encodeText(value) {
      if (!isWellFormedUnicode(value)) throw new Error('invalid unicode');
      return bytesToBase64(new TextEncoder().encode(value));
    }

    function decodeText(value) {
      const compact = value.replace(/[\t\n\f\r ]/g, '');
      if (!compact || compact.length % 4 === 1 || !/^[A-Za-z0-9+/]*={0,2}$/.test(compact)) {
        throw new Error('invalid base64');
      }
      if (compact.includes('=') && compact.length % 4 !== 0) throw new Error('invalid padding');
      const padded = compact + '='.repeat((4 - compact.length % 4) % 4);
      const binary = atob(padded);
      const bytes = Uint8Array.from(binary, function (character) { return character.charCodeAt(0); });
      return new TextDecoder('utf-8', { fatal: true, ignoreBOM: true }).decode(bytes);
    }

    function commitResult(value, statusKey, statusFallback) {
      if (value.length > maxCommandOutputLength) {
        const message = setStatus(
          'error.outputTooLong',
          'danger',
          '转换结果超过 65,536 个字符，无法作为命令输出');
        return { success: false, message, outputs: {} };
      }
      output.value = value;
      copyButton.disabled = false;
      const message = setStatus(statusKey, 'success', statusFallback);
      return {
        success: true,
        message,
        outputs: { result: { type: 'text', value: output.value } }
      };
    }

    function encode() {
      clearResult();
      if (!input.value) {
        const message = setStatus('error.emptyInput', 'danger', '请输入要编码的文本');
        return { success: false, message, outputs: {} };
      }
      try {
        return commitResult(encodeText(input.value), 'status.encoded', '编码完成');
      } catch (_) {
        const message = setStatus(
          'error.encode',
          'danger',
          '无法编码当前内容');
        return { success: false, message, outputs: {} };
      }
    }

    function decode() {
      clearResult();
      if (!input.value.trim()) {
        const message = setStatus('error.emptyInput', 'danger', '请输入要解码的 Base64 内容');
        return { success: false, message, outputs: {} };
      }
      try {
        return commitResult(decodeText(input.value), 'status.decoded', '解码完成');
      } catch (_) {
        const message = setStatus(
          'error.invalidBase64',
          'danger',
          '请输入有效的 Base64 内容');
        return { success: false, message, outputs: {} };
      }
    }

    async function paste() {
      try {
        const result = await long.clipboard.getText();
        if (result.success) {
          input.value = result.data || '';
          input.focus();
          invalidateResult();
          if (!input.value) setStatus('error.clipboardEmpty', 'danger', '剪贴板中没有文本');
        } else setStatus('error.clipboardRead', 'danger', '无法读取剪贴板');
      } catch (_) { setStatus('error.clipboardRead', 'danger', '无法读取剪贴板'); }
    }

    async function copy() {
      if (!output.value) return;
      try {
        const result = await long.clipboard.setText(output.value);
        if (result.success) setStatus('status.copied', 'success', '结果已复制');
        else setStatus('error.copy', 'danger', '复制失败');
      }
      catch (_) { setStatus('error.copy', 'danger', '复制失败'); }
    }

    document.getElementById('encodeButton').addEventListener('click', encode);
    document.getElementById('decodeButton').addEventListener('click', decode);
    document.getElementById('pasteButton').addEventListener('click', paste);
    document.getElementById('copyButton').addEventListener('click', copy);
    input.addEventListener('input', invalidateResult);
    document.addEventListener('keydown', function (event) {
      if (event.ctrlKey && event.key === 'Enter') { event.preventDefault(); event.shiftKey ? decode() : encode(); }
    });
    window.LongUI?.onCommand(function (command) {
      input.value = window.LongUI.commandText(command) || '';
      if (command.command_id === 'base64.decode') return decode();
      if (command.command_id === 'base64.encode') return encode();
      clearResult();
      const message = setStatus('error.unknownCommand', 'danger', '未知 Base64 命令');
      return { success: false, message, outputs: {} };
    });
    window.chrome?.webview?.addEventListener('message', ({ data }) => {
      if (data?.type === 'long.language-changed') applyLocalization(data);
    });
  </script>
</body>
</html>
