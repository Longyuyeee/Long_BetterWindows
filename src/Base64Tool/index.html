<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>Base64 编解码</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,system-ui,sans-serif;background:#f5f5f7;color:#1d1d1f;padding:20px}
h2{font-size:15px;margin-bottom:10px;color:#007AFF}
textarea{width:100%;height:120px;border:1px solid #e0e0e0;border-radius:8px;padding:12px;font-size:13px;font-family:monospace;line-height:1.5;resize:vertical}
textarea:focus{outline:none;border-color:#007AFF}
.btn-row{display:flex;gap:8px;margin:10px 0}
button{padding:8px 16px;border:none;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer}
.btn-primary{background:#007AFF;color:#fff}.btn-primary:hover{background:#0062CC}
.btn-secondary{background:#f0f0f0;color:#333}.btn-secondary:hover{background:#e0e0e0}
.status{font-size:11px;margin-top:6px}.ok{color:#34C759}.err{color:#FF3B30}
</style></head><body>
<h2>Base64 编解码</h2>
<textarea id="input" placeholder="输入文本..."></textarea>
<div class="btn-row">
  <button class="btn-primary" onclick="encode()">编码 (Encode)</button>
  <button class="btn-secondary" onclick="decode()">解码 (Decode)</button>
  <button class="btn-secondary" onclick="pasteClip()">粘贴</button>
  <button class="btn-secondary" onclick="copyResult()">复制</button>
</div>
<textarea id="output" placeholder="结果..." readonly></textarea>
<div id="status" class="status"></div>
<script>
function encode(){try{var r=btoa(unescape(encodeURIComponent(document.getElementById('input').value)));document.getElementById('output').value=r;s('编码成功','ok')}catch(e){s('编码失败','err')}}
function decode(){try{var r=decodeURIComponent(escape(atob(document.getElementById('input').value)));document.getElementById('output').value=r;s('解码成功','ok')}catch(e){s('解码失败','err')}}
async function pasteClip(){try{var r=await long.clipboard.getText();if(r.success&&r.data)document.getElementById('input').value=r.data}catch(e){}}
async function copyResult(){var t=document.getElementById('output').value;if(t)try{await long.clipboard.setText(t);s('已复制','ok')}catch(e){}}
function s(m,c){var e=document.getElementById('status');e.textContent=m;e.className='status '+c}
</script></body></html>
