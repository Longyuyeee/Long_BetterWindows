<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Base64 编解码</title>
</head>
<body>
  <main class="long-page">
    <header class="long-page-header">
      <div>
        <div class="long-eyebrow">TEXT TRANSFORM</div>
        <h1 class="long-page-title">Base64 编解码</h1>
        <p class="long-page-description">在纯文本与 Base64 之间快速转换，结果可直接复制。</p>
      </div>
      <span class="long-badge">本地处理</span>
    </header>

    <section class="long-stack" aria-label="Base64 转换器">
      <div class="long-card long-field">
        <label class="long-field-label" for="input">原始内容</label>
        <textarea class="long-editor" id="input" placeholder="输入文本，或从命令中心携带剪贴板内容…" autofocus></textarea>
      </div>

      <div class="long-toolbar">
        <button class="long-button long-button--primary btn-primary" id="encodeButton" type="button">编码</button>
        <button class="long-button long-button--secondary btn-secondary" id="decodeButton" type="button">解码</button>
        <button class="long-button long-button--secondary btn-secondary" id="pasteButton" type="button">粘贴</button>
        <span class="long-toolbar__spacer"></span>
        <span class="long-kbd">Ctrl Enter</span>
      </div>

      <div class="long-card long-field">
        <label class="long-field-label" for="output">转换结果</label>
        <textarea class="long-editor" id="output" placeholder="结果将在这里显示" readonly></textarea>
        <div class="long-toolbar">
          <div id="status" class="long-status" role="status" aria-live="polite"></div>
          <span class="long-toolbar__spacer"></span>
          <button class="long-button long-button--secondary btn-secondary" id="copyButton" type="button">复制结果</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const input = document.getElementById('input');
    const output = document.getElementById('output');
    const status = document.getElementById('status');

    function setStatus(message, kind) {
      status.textContent = message;
      status.className = 'long-status ' + (kind ? 'long-status--' + kind : '');
      window.LongUI?.announce(message);
    }

    function encode() {
      try {
        output.value = btoa(unescape(encodeURIComponent(input.value)));
        setStatus('编码完成', 'success');
        return {
          success: true,
          message: '编码完成',
          outputs: { result: { type: 'text', value: output.value } }
        };
      } catch (_) {
        setStatus('无法编码当前内容', 'danger');
        return { success: false, message: '无法编码当前内容', outputs: {} };
      }
    }

    function decode() {
      try {
        output.value = decodeURIComponent(escape(atob(input.value.trim())));
        setStatus('解码完成', 'success');
        return {
          success: true,
          message: '解码完成',
          outputs: { result: { type: 'text', value: output.value } }
        };
      } catch (_) {
        setStatus('请输入有效的 Base64 内容', 'danger');
        return { success: false, message: '请输入有效的 Base64 内容', outputs: {} };
      }
    }

    async function paste() {
      try {
        const result = await long.clipboard.getText();
        if (result.success && result.data) { input.value = result.data; input.focus(); }
      } catch (_) { setStatus('无法读取剪贴板', 'danger'); }
    }

    async function copy() {
      if (!output.value) return;
      try { await long.clipboard.setText(output.value); setStatus('结果已复制', 'success'); }
      catch (_) { setStatus('复制失败', 'danger'); }
    }

    document.getElementById('encodeButton').addEventListener('click', encode);
    document.getElementById('decodeButton').addEventListener('click', decode);
    document.getElementById('pasteButton').addEventListener('click', paste);
    document.getElementById('copyButton').addEventListener('click', copy);
    document.addEventListener('keydown', function (event) {
      if (event.ctrlKey && event.key === 'Enter') { event.preventDefault(); event.shiftKey ? decode() : encode(); }
    });
    window.LongUI?.onCommand(function (command) {
      const text = window.LongUI.commandText(command);
      if (text) input.value = text;
      return command.command_id === 'base64.decode' ? decode() : encode();
    });
  </script>
</body>
</html>
