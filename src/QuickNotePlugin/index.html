<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>快速便签</title>
</head>
<body>
  <main class="long-page">
    <header class="long-page-header">
      <div>
        <div class="long-eyebrow">QUICK CAPTURE</div>
        <h1 class="long-page-title">快速便签</h1>
        <p class="long-page-description">随手记录想法，便签仅保存在本机插件存储中。</p>
      </div>
      <span class="long-badge" id="countBadge">0 条便签</span>
    </header>

    <section class="long-stack">
      <div class="long-card long-field">
        <label class="long-field-label" for="noteInput">新便签</label>
        <textarea class="long-editor" id="noteInput" placeholder="写点什么，支持简单 Markdown…" autofocus></textarea>
        <div class="long-toolbar">
          <button class="long-button long-button--primary btn-primary" id="saveButton" type="button">保存便签</button>
          <button class="long-button long-button--secondary btn-secondary" id="previewButton" type="button">预览</button>
          <button class="long-button long-button--secondary btn-secondary" id="clearButton" type="button">清空</button>
          <span class="long-toolbar__spacer"></span>
          <span class="long-kbd">Ctrl Enter</span>
        </div>
        <div class="long-preview" id="preview" hidden></div>
        <div class="long-status" id="status" role="status" aria-live="polite"></div>
      </div>

      <section class="long-card long-stack" aria-labelledby="historyTitle">
        <div class="long-toolbar">
          <h2 class="long-page-title" id="historyTitle">历史便签</h2>
          <span class="long-toolbar__spacer"></span>
          <span class="long-secondary">最多保留 30 条</span>
        </div>
        <div class="long-list" id="noteList"></div>
      </section>
    </section>
  </main>

  <script>
    const input = document.getElementById('noteInput');
    const preview = document.getElementById('preview');
    const status = document.getElementById('status');
    const list = document.getElementById('noteList');
    let notes = [];

    async function initialize() {
      window.LongUI?.renderState(list, {
        kind: 'loading',
        title: '正在加载历史便签'
      });
      try {
        const result = await long.storage.get('quick_notes');
        if (!result.success) throw new Error(result.error || '历史便签读取失败');
        if (result.success && result.data) notes = JSON.parse(result.data);
      } catch (error) {
        window.LongUI?.renderState(list, {
          kind: 'error',
          title: '历史便签读取失败',
          detail: error && error.message ? error.message : String(error),
          actionLabel: '重试',
          onAction: initialize
        });
        setStatus('历史便签读取失败', 'danger');
        return;
      }
      renderNotes();
    }

    async function persist() {
      try {
        const result = await long.storage.set('quick_notes', JSON.stringify(notes));
        if (!result.success) throw new Error(result.error || '便签保存失败');
        return true;
      } catch (_) {
        setStatus('便签保存失败', 'danger');
        return false;
      }
    }

    function setStatus(message, kind) {
      status.textContent = message;
      status.className = 'long-status ' + (kind ? 'long-status--' + kind : '');
      window.LongUI?.announce(message);
    }

    async function saveNote() {
      const text = input.value.trim();
      if (!text) { setStatus('请输入便签内容', 'warning'); input.focus(); return; }
      const previousNotes = notes.slice();
      notes.unshift({ text: text, time: Date.now() });
      notes = notes.slice(0, 30);
      input.value = '';
      preview.hidden = true;
      const saved = await persist();
      if (!saved) {
        notes = previousNotes;
        input.value = text;
        renderNotes();
        input.focus();
        return;
      }
      renderNotes();
      setStatus('便签已保存 · ' + text.length + ' 字符', 'success');
    }

    function renderPreview() {
      if (!preview.hidden) { preview.hidden = true; return; }
      const safe = escapeHtml(input.value)
        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
        .replace(/^## (.+)$/gm, '<h2>$1</h2>')
        .replace(/^# (.+)$/gm, '<h1>$1</h1>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\n/g, '<br>');
      preview.innerHTML = safe || '没有可预览的内容';
      preview.hidden = false;
    }

    function renderNotes() {
      list.replaceChildren();
      document.getElementById('countBadge').textContent = notes.length + ' 条便签';
      if (!notes.length) {
        window.LongUI?.renderState(list, {
          kind: 'empty',
          title: '还没有便签',
          detail: '新建的便签会显示在这里'
        });
        return;
      }
      notes.forEach(function (note, index) {
        const item = document.createElement('article');
        item.className = 'long-list-item';
        const content = document.createElement('button');
        content.type = 'button';
        content.className = 'long-list-item__content';
        content.textContent = note.text.length > 180 ? note.text.slice(0, 180) + '…' : note.text;
        content.addEventListener('click', function () {
          input.value = note.text;
          input.focus();
          setStatus('便签已载入编辑区', 'success');
        });
        const meta = document.createElement('div');
        meta.className = 'long-list-item__meta long-stack';
        const time = document.createElement('time');
        time.textContent = relativeTime(note.time);
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'long-button long-button--small';
        remove.textContent = '删除';
        remove.setAttribute('aria-label', '删除此便签');
        remove.addEventListener('click', async function () {
          const removed = notes.splice(index, 1)[0];
          const saved = await persist();
          if (!saved) notes.splice(index, 0, removed);
          renderNotes();
          if (saved) setStatus('便签已删除', 'success');
        });
        meta.append(time, remove);
        item.append(content, meta);
        list.appendChild(item);
      });
    }

    function relativeTime(value) {
      const seconds = Math.max(0, Math.floor((Date.now() - value) / 1000));
      if (seconds < 60) return '刚刚';
      if (seconds < 3600) return Math.floor(seconds / 60) + ' 分钟前';
      if (seconds < 86400) return Math.floor(seconds / 3600) + ' 小时前';
      return Math.floor(seconds / 86400) + ' 天前';
    }

    function escapeHtml(value) {
      return value.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    document.getElementById('saveButton').addEventListener('click', saveNote);
    document.getElementById('previewButton').addEventListener('click', renderPreview);
    document.getElementById('clearButton').addEventListener('click', function () { input.value = ''; preview.hidden = true; input.focus(); });
    document.addEventListener('keydown', function (event) {
      if (event.ctrlKey && event.key === 'Enter') { event.preventDefault(); saveNote(); }
    });
    window.LongUI?.onCommand(function (command) {
      const text = window.LongUI.commandText(command);
      if (text) input.value = text;
      input.focus();
    });
    initialize();
  </script>
</body>
</html>
