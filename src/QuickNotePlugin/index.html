<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>快速便签</title>
</head>
<body>
  <main class="long-page">
    <header class="long-page-header">
      <div>
        <div class="long-eyebrow">QUICK CAPTURE</div>
        <h1 class="long-page-title" data-i18n="page.title">快速便签</h1>
        <p class="long-page-description" data-i18n="page.description">随手记录想法，便签仅保存在本机插件存储中。</p>
      </div>
      <span class="long-badge" id="countBadge">0 条便签</span>
    </header>

    <section class="long-stack">
      <div class="long-card long-field">
        <label class="long-field-label" for="noteInput" data-i18n="field.newNote">新便签</label>
        <textarea class="long-editor" id="noteInput" maxlength="65536" placeholder="写点什么，支持简单 Markdown…" autofocus></textarea>
        <div class="long-toolbar">
          <button class="long-button long-button--primary btn-primary" id="saveButton" type="button" data-i18n="action.save">保存便签</button>
          <button class="long-button long-button--secondary btn-secondary" id="previewButton" type="button" data-i18n="action.preview">预览</button>
          <button class="long-button long-button--secondary btn-secondary" id="clearButton" type="button" data-i18n="action.clear">清空</button>
          <span class="long-toolbar__spacer"></span>
          <span class="long-kbd">Ctrl Enter</span>
        </div>
        <div class="long-preview" id="preview" role="region" aria-live="polite" hidden></div>
        <div class="long-status" id="status" role="status" aria-live="polite"></div>
      </div>

      <section class="long-card long-stack" aria-labelledby="historyTitle">
        <div class="long-toolbar">
          <h2 class="long-section-title" id="historyTitle" data-i18n="history.title">历史便签</h2>
          <span class="long-toolbar__spacer"></span>
          <span class="long-secondary" data-i18n="history.limit">最多保留 30 条</span>
        </div>
        <div class="long-list" id="noteList"></div>
      </section>
    </section>
  </main>

  <script>
    const maxItems = 30;
    const maxItemCharacters = 65536;
    const maxCollectionCharacters = 500000;
    const input = document.getElementById('noteInput');
    const preview = document.getElementById('preview');
    const status = document.getElementById('status');
    const list = document.getElementById('noteList');
    const saveButton = document.getElementById('saveButton');
    let notes = [];
    let mutationQueue = Promise.resolve();
    let strings = {};
    let listState = 'loading';
    let loadErrorDetail = '';
    let currentStatus = { key: '', fallback: '', values: {}, kind: '' };

    function t(key, fallback, values) {
      const template = strings[key] || fallback || key;
      return Object.entries(values || {}).reduce(function (result, entry) {
        return result.replaceAll('{' + entry[0] + '}', String(entry[1]));
      }, template);
    }

    function renderStatus() {
      const message = currentStatus.key
        ? t(currentStatus.key, currentStatus.fallback, currentStatus.values)
        : currentStatus.fallback;
      status.textContent = message;
      status.className = 'long-status ' +
        (currentStatus.kind ? 'long-status--' + currentStatus.kind : '');
      return message;
    }

    function setStatus(key, kind, fallback, values) {
      currentStatus = { key, kind, fallback: fallback || '', values: values || {} };
      const message = renderStatus();
      window.LongUI?.announce(message);
    }

    function renderListState() {
      if (listState === 'loading') {
        window.LongUI?.renderState(list, {
          kind: 'loading',
          title: t('state.loading', '正在加载历史便签')
        });
      } else if (listState === 'error') {
        window.LongUI?.renderState(list, {
          kind: 'error',
          title: t('state.loadFailed', '历史便签读取失败'),
          detail: loadErrorDetail,
          actionLabel: t('action.retry', '重试'),
          onAction: initialize
        });
      } else {
        renderNotes();
      }
    }

    function applyLocalization(message) {
      strings = message.resources || {};
      document.documentElement.lang = message.resolved_language || 'zh-CN';
      document.title = t('plugin.name', '快速便签');
      document.querySelectorAll('[data-i18n]').forEach(function (element) {
        element.textContent = t(element.dataset.i18n, element.textContent);
      });
      input.placeholder = t('field.placeholder', '写点什么，支持简单 Markdown…');
      renderListState();
      if (!preview.hidden) renderPreviewContent();
      renderStatus();
    }

    function normalizeNotes(value) {
      if (!Array.isArray(value)) return [];
      const ids = new Set();
      return trimNotes(value
        .filter(function (note) {
          return note && typeof note.text === 'string' && note.text.trim();
        })
        .map(function (note) {
          let id = typeof note.id === 'string' && note.id.trim()
            ? note.id.trim().slice(0, 128)
            : createNoteId();
          while (ids.has(id)) id = createNoteId();
          ids.add(id);
          return {
            id: id,
            text: note.text,
            time: Number.isFinite(Number(note.time)) ? Number(note.time) : Date.now()
          };
        }), maxItems);
    }

    function trimNotes(items, limit) {
      const limited = [];
      let totalCharacters = 0;
      for (const note of items) {
        if (limited.length >= limit) break;
        if (note.text.length > maxItemCharacters
          || totalCharacters + note.text.length > maxCollectionCharacters) {
          continue;
        }
        limited.push(note);
        totalCharacters += note.text.length;
      }
      return limited;
    }

    function createNoteId() {
      if (typeof crypto.randomUUID === 'function') return crypto.randomUUID();
      const bytes = crypto.getRandomValues(new Uint8Array(16));
      bytes[6] = (bytes[6] & 0x0f) | 0x40;
      bytes[8] = (bytes[8] & 0x3f) | 0x80;
      return Array.from(bytes, function (value) {
        return value.toString(16).padStart(2, '0');
      }).join('').replace(/^(........)(....)(....)(....)(............)$/, '$1-$2-$3-$4-$5');
    }

    async function initialize() {
      listState = 'loading';
      renderListState();
      try {
        const result = await long.storage.get('quick_notes');
        if (!result.success) throw new Error(result.error || t('error.load', '历史便签读取失败'));
        notes = normalizeNotes(result.data ? JSON.parse(result.data) : []);
      } catch (error) {
        listState = 'error';
        loadErrorDetail = error && error.message ? error.message : String(error);
        renderListState();
        setStatus('state.loadFailed', 'danger', '历史便签读取失败');
        return false;
      }
      listState = 'ready';
      renderNotes();
      return true;
    }

    async function persistSnapshot(snapshot) {
      const result = await long.storage.set('quick_notes', JSON.stringify(snapshot));
      if (!result || !result.success) {
        throw new Error(result && result.error ? result.error : t('error.save', '便签保存失败'));
      }
    }

    function mutateNotes(transform, successMessage) {
      const operation = mutationQueue.then(async function () {
        const previous = notes;
        const next = transform(notes.slice());
        if (!next) return true;
        notes = trimNotes(next, maxItems);
        renderNotes();
        try {
          await persistSnapshot(notes);
          if (successMessage) {
            setStatus(
              successMessage.key,
              'success',
              successMessage.fallback,
              successMessage.values);
          }
          return true;
        } catch (error) {
          notes = previous;
          renderNotes();
          setStatus('', 'danger', error.message || t('error.save', '便签保存失败'));
          return false;
        }
      });
      mutationQueue = operation.catch(function () { });
      return operation;
    }

    async function saveNote() {
      if (saveButton.disabled) return;
      const text = input.value;
      if (!text.trim()) {
        setStatus('status.enterContent', 'warning', '请输入便签内容');
        input.focus();
        return;
      }
      if (text.length > maxItemCharacters) {
        setStatus(
          'status.tooLong',
          'warning',
          '便签不能超过 {count} 个字符',
          { count: maxItemCharacters });
        input.focus();
        return;
      }
      window.LongUI?.setBusy(saveButton, true);
      const noteId = createNoteId();
      const saved = await mutateNotes(function (items) {
        items.unshift({ id: noteId, text: text, time: Date.now() });
        return items;
      }, {
        key: 'status.saved',
        fallback: '便签已保存 · {count} 字符',
        values: { count: text.length }
      });
      window.LongUI?.setBusy(saveButton, false);
      if (saved) {
        if (input.value === text) input.value = '';
        preview.hidden = true;
      }
      input.focus();
    }

    function renderPreview() {
      if (!preview.hidden) { preview.hidden = true; return; }
      renderPreviewContent();
      preview.hidden = false;
    }

    function renderPreviewContent() {
      const safe = escapeHtml(input.value)
        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
        .replace(/^## (.+)$/gm, '<h2>$1</h2>')
        .replace(/^# (.+)$/gm, '<h1>$1</h1>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\n/g, '<br>');
      preview.innerHTML = safe || t('preview.empty', '没有可预览的内容');
    }

    function renderNotes() {
      list.replaceChildren();
      document.getElementById('countBadge').textContent = t(
        'badge.count',
        '{count} 条便签',
        { count: notes.length });
      if (!notes.length) {
        window.LongUI?.renderState(list, {
          kind: 'empty',
          title: t('state.empty', '还没有便签'),
          detail: t('state.emptyDetail', '新建的便签会显示在这里')
        });
        return;
      }
      notes.forEach(function (note) {
        const item = document.createElement('article');
        item.className = 'long-list-item';
        const content = document.createElement('button');
        content.type = 'button';
        content.className = 'long-list-item__content';
        content.textContent = note.text.length > 180 ? note.text.slice(0, 180) + '…' : note.text;
        content.addEventListener('click', function () {
          input.value = note.text;
          if (!preview.hidden) renderPreviewContent();
          input.focus();
          setStatus('status.loaded', 'success', '便签已载入编辑区');
        });
        const meta = document.createElement('div');
        meta.className = 'long-list-item__meta long-stack';
        const time = document.createElement('time');
        time.textContent = relativeTime(note.time);
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'long-button long-button--small';
        remove.textContent = t('action.remove', '删除');
        remove.setAttribute('aria-label', t('action.removeAria', '删除此便签'));
        remove.addEventListener('click', async function () {
          window.LongUI?.setBusy(remove, true);
          await mutateNotes(function (items) {
            return items.filter(function (entry) {
              return entry.id !== note.id;
            });
          }, {
            key: 'status.removed',
            fallback: '便签已删除',
            values: {}
          });
          window.LongUI?.setBusy(remove, false);
        });
        meta.append(time, remove);
        item.append(content, meta);
        list.appendChild(item);
      });
    }

    function relativeTime(value) {
      const seconds = Math.max(0, Math.floor((Date.now() - value) / 1000));
      if (seconds < 60) return t('time.now', '刚刚');
      if (seconds < 3600) return t('time.minutes', '{count} 分钟前', { count: Math.floor(seconds / 60) });
      if (seconds < 86400) return t('time.hours', '{count} 小时前', { count: Math.floor(seconds / 3600) });
      return t('time.days', '{count} 天前', { count: Math.floor(seconds / 86400) });
    }

    function escapeHtml(value) {
      return value.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    saveButton.addEventListener('click', saveNote);
    input.addEventListener('input', function () {
      if (!preview.hidden) renderPreviewContent();
    });
    document.getElementById('previewButton').addEventListener('click', renderPreview);
    document.getElementById('clearButton').addEventListener('click', function () { input.value = ''; preview.hidden = true; input.focus(); });
    document.addEventListener('keydown', function (event) {
      if (event.ctrlKey && event.key === 'Enter') { event.preventDefault(); saveNote(); }
    });
    window.LongUI?.onCommand(async function (command) {
      if (!await initializationPromise) {
        return {
          success: false,
          message: t('state.loadFailed', '历史便签读取失败')
        };
      }
      const text = window.LongUI.commandText(command);
      if (text) {
        input.value = text;
        if (!preview.hidden) renderPreviewContent();
      }
      input.focus();
      return {
        success: true,
        message: t('command.ready', '便签编辑器已就绪')
      };
    });
    window.chrome?.webview?.addEventListener('message', function ({ data }) {
      if (data?.type === 'long.language-changed') applyLocalization(data);
    });
    const initializationPromise = initialize();
  </script>
</body>
</html>
