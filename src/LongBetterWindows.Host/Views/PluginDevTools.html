<!DOCTYPE html><html><head><meta charset='UTF-8'>
<title>Plugin DevTools</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,system-ui,sans-serif;display:flex;height:100vh;background:#1e1e1e;color:#d4d4d4}
#sidebar{width:220px;background:#252526;border-right:1px solid #3e3e3e;overflow-y:auto;padding:8px}
#sidebar h4{font-size:11px;text-transform:uppercase;color:#888;margin:12px 0 4px 8px}
.plugin-item,.file-item{padding:6px 8px;cursor:pointer;font-size:12px;border-radius:4px;display:flex;align-items:center}
.plugin-item:hover,.file-item:hover{background:#2a2d2e}
.plugin-item.active,.file-item.active{background:#37373d}
.plugin-item .icon{width:16px;text-align:center;margin-right:6px;font-size:11px}
#main{flex:1;display:flex;flex-direction:column}
#toolbar{display:flex;gap:4px;padding:8px 12px;background:#323233;border-bottom:1px solid #3e3e3e;align-items:center}
#toolbar button{padding:5px 12px;border:none;border-radius:4px;font-size:11px;cursor:pointer;background:#0e639c;color:#fff}
#toolbar button.secondary{background:#3e3e3e}
#toolbar select{padding:4px 8px;border:1px solid #3e3e3e;border-radius:4px;font-size:11px;background:#3c3c3c;color:#ddd}
#toolbar input{padding:4px 8px;border:1px solid #3e3e3e;border-radius:4px;font-size:11px;background:#3c3c3c;color:#ddd;width:100px}
#tabs{display:flex;background:#2d2d2d;border-bottom:1px solid #3e3e3e;overflow-x:auto}
.tab{padding:6px 16px;font-size:11px;cursor:pointer;border-right:1px solid #3e3e3e;white-space:nowrap;display:flex;align-items:center}
.tab.active{background:#1e1e1e;border-bottom:2px solid #007acc}
.tab .close{margin-left:8px;color:#888;font-size:14px;cursor:pointer}
.tab .close:hover{color:#fff}
#editor{flex:1;position:relative}
textarea{position:absolute;top:0;left:0;width:100%;height:100%;background:transparent;color:#d4d4d4;
  border:none;padding:12px;font-family:'Consolas','Monaco','Courier New',monospace;font-size:13px;
  line-height:1.6;resize:none;outline:none;tab-size:4;white-space:pre;overflow:auto}
#status{font-size:11px;padding:4px 12px;background:#007acc;color:#fff;display:none}
#status.show{display:block}
#empty{flex:1;display:flex;align-items:center;justify-content:center;color:#666;font-size:13px;flex-direction:column}
#empty h3{color:#888;margin-bottom:8px}
#empty p{color:#555}
.dialog-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100}
.dialog{background:#2d2d2d;padding:24px;border-radius:8px;min-width:360px}
.dialog h3{margin-bottom:16px;color:#ddd}
.dialog label{display:block;font-size:11px;color:#888;margin-bottom:4px}
.dialog input,.dialog select{width:100%;padding:6px 8px;margin-bottom:12px;border:1px solid #3e3e3e;border-radius:4px;background:#3c3c3c;color:#ddd;font-size:12px}
.dialog button{padding:6px 16px;border:none;border-radius:4px;font-size:12px;cursor:pointer;margin-right:8px}
.dialog .btn-primary{background:#0e639c;color:#fff}
.dialog .btn-secondary{background:#3e3e3e;color:#ddd}
</style></head><body>

<div id='sidebar'>
  <h4>插件</h4>
  <div id='pluginList'></div>
  <div id='fileTree'></div>
</div>

<div id='main'>
  <div id='toolbar'>
    <button onclick='showNewDialog()'>+ 新建插件</button>
    <button class='secondary' onclick='saveCurrent()'>保存 (Ctrl+S)</button>
    <button class='secondary' onclick='location.reload()'>刷新</button>
  </div>
  <div id='tabs'></div>
  <div id='editor'>
    <div id='empty'><h3>插件开发工具</h3><p>选择左侧插件开始编辑，或点击「+ 新建插件」创建</p></div>
    <textarea id='codeEditor' style='display:none' onkeydown='handleKeydown(event)' spellcheck='false'></textarea>
  </div>
  <div id='status'></div>
</div>

<div id='newDialog' class='dialog-overlay' style='display:none'>
  <div class='dialog'>
    <h3>新建插件</h3>
    <label>类型</label>
    <select id='newType'><option value='web'>HTML/JS (WebView2)</option><option value='script'>C# 脚本 (.csx)</option></select>
    <label>名称</label><input id='newName' placeholder='我的插件' />
    <label>ID (反向域名)</label><input id='newId' placeholder='com.example.myplugin' />
    <br/>
    <button class='btn-primary' onclick='createPlugin()'>创建</button>
    <button class='btn-secondary' onclick='document.getElementById(&quot;newDialog&quot;).style.display=&quot;none&quot;'>取消</button>
  </div>
</div>

<script>
var tabs=[],currentTab=-1,currentPlugin='',fileCache={};
function api(action,data){
  window.chrome.webview.postMessage(JSON.stringify({Action:action,Path:data?data.path:undefined,Content:data?data.content:undefined,Template:data?data.template:undefined,Name:data?data.name:undefined,Id:data?data.id:undefined}));
}
api('listPlugins');

function handleMessage(msg){
  try{var m=JSON.parse(msg);}catch(e){return}
  if(m.type==='pluginsListed')renderPlugins(m.data);
  else if(m.type==='filesListed')renderFileTree(m.data);
  else if(m.type==='fileOpened')openInTab(m.data.path,m.data.content);
  else if(m.type==='fileSaved')showStatus(m.data.success?'已保存':'保存失败');
  else if(m.type==='pluginCreated'){showStatus('插件已创建');api('listPlugins');}
}

function renderPlugins(plugins){
  var h='';
  plugins.forEach(function(p){h+='<div class=plugin-item onclick=selectPlugin(&quot;'+p.path+'&quot;)><span class=icon>'+(p.hasManifest?'O':'+')+'</span>'+esc(p.name)+'</div>'});
  document.getElementById('pluginList').innerHTML=h||'<span style=color:#666;font-size:11px>无</span>';
}
function selectPlugin(dir){
  currentPlugin=dir;
  document.querySelectorAll('.plugin-item').forEach(function(el){el.classList.toggle('active',el.textContent.includes(dir.split('/').pop()))});
  document.getElementById('fileTree').innerHTML='<h4>文件</h4>';
  api('listFiles',{path:dir});
}
function renderFileTree(data){
  var h='<h4>文件</h4>';
  data.files.forEach(function(f){
    h+='<div class=file-item onclick=openFile(&quot;'+f.path+'&quot;)>'+esc(f.name)+'</div>';});
  document.getElementById('fileTree').innerHTML+=h;
}
function openFile(path){
  if(fileCache[path]){openInTab(path,fileCache[path]);return}
  api('openFile',{path:path});
}
function openInTab(path,content){
  fileCache[path]=content;
  var name=path.split('/').pop();
  var idx=tabs.findIndex(function(t){return t.path===path});
  if(idx>=0){currentTab=idx}else{tabs.push({path:path,name:name,content:content});currentTab=tabs.length-1}
  renderTabs();showEditor();
}
function renderTabs(){
  var h='';
  tabs.forEach(function(t,i){
    h+='<div class=tab'+(i===currentTab?' active':'')+' onclick=switchTab('+i+')>'+esc(t.name)+'<span class=close onclick=&quot;event.stopPropagation();closeTab('+i+')&quot;>x</span></div>';});
  document.getElementById('tabs').innerHTML=h;
}
function switchTab(i){currentTab=i;renderTabs();showEditor()}
function closeTab(i){
  if(fileCache[tabs[i].path]) delete fileCache[tabs[i].path];
  tabs.splice(i,1);if(currentTab>=tabs.length)currentTab=tabs.length-1;renderTabs();
  if(tabs.length===0){document.getElementById('codeEditor').style.display='none';document.getElementById('empty').style.display='flex'}
  else showEditor();
}
function showEditor(){
  if(currentTab<0)return;
  document.getElementById('empty').style.display='none';
  var ed=document.getElementById('codeEditor');ed.style.display='block';ed.value=tabs[currentTab]?tabs[currentTab].content:'';ed.focus();
}
function saveCurrent(){
  if(currentTab<0||!tabs[currentTab])return;
  tabs[currentTab].content=document.getElementById('codeEditor').value;
  fileCache[tabs[currentTab].path]=tabs[currentTab].content;
  api('saveFile',{path:tabs[currentTab].path,content:tabs[currentTab].content});
}
function handleKeydown(e){
  if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();saveCurrent()}
  if(e.key==='Tab'){e.preventDefault();var s=document.getElementById('codeEditor').selectionStart;var v=document.getElementById('codeEditor').value;document.getElementById('codeEditor').value=v.substring(0,s)+'  '+v.substring(s);document.getElementById('codeEditor').selectionStart=document.getElementById('codeEditor').selectionEnd=s+2}
}
function showNewDialog(){document.getElementById('newDialog').style.display='flex'}
function createPlugin(){
  var t=document.getElementById('newType').value;
  var n=document.getElementById('newName').value||'my-plugin';
  var id=document.getElementById('newId').value||'com.example.plugin';
  api('newPlugin',{template:t,name:n,id:id});
  document.getElementById('newDialog').style.display='none';
}
function showStatus(msg){var s=document.getElementById('status');s.textContent=msg;s.classList.add('show');setTimeout(function(){s.classList.remove('show')},3000)}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
</script></body></html>
