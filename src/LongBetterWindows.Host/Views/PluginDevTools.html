<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Long Plugin DevTools</title>
<link rel="stylesheet" href="../Assets/CodeMirror/lib/codemirror.min.css">
<link rel="stylesheet" href="../Assets/CodeMirror/theme/material-darker.min.css">
<link rel="stylesheet" href="../Assets/CodeMirror/addon/hint/show-hint.min.css">
<style>
/* ══════════════════════════════════════════ */
/* 色彩: 对齐 Long助手设计系统              */
/* ══════════════════════════════════════════ */
:root {
  --bg:        #0B0D12;
  --sidebar:   #11151D;
  --card:      #171C27;
  --accent:    #7059F5;
  --accent-h:  #765EE8;
  --accent-soft: rgba(112,89,245,0.20);
  --green:     #47D18C;
  --red:       #FF647C;
  --text:      #F4F6FB;
  --text2:     #B2BACB;
  --text3:     #7C879E;
  --divider:   #2A3242;
  --input-bg:  #11151D;
  --hover:     #202838;
  --overlay:   rgba(5,7,12,0.72);
  --editor-gutter: #191D26;
  --editor-selection: rgba(112,89,245,0.28);
  --console-bg: #10141C;
  --console-head: #1D2330;
  --console-button: #30394B;
  --shadow: rgba(0,0,0,0.38);
}

:root[data-long-theme="light"] {
  --bg:        #F7F8FB;
  --sidebar:   #EFF1F5;
  --card:      #FFFFFF;
  --accent:    #5B45E6;
  --accent-h:  #4E3ACD;
  --accent-soft: rgba(91,69,230,0.12);
  --green:     #168A58;
  --red:       #C7354F;
  --text:      #181B22;
  --text2:     #4F586A;
  --text3:     #727C90;
  --divider:   #D8DCE5;
  --input-bg:  #FFFFFF;
  --hover:     #E5E8EF;
  --overlay:   rgba(22,25,32,0.42);
  --editor-gutter: #ECEEF3;
  --editor-selection: rgba(91,69,230,0.18);
  --console-bg: #F4F5F8;
  --console-head: #E7EAF0;
  --console-button: #D9DDE6;
  --shadow: rgba(32,37,48,0.18);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

* { scrollbar-width: thin; scrollbar-color: var(--text3) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--text3); border: 3px solid transparent;
  border-radius: 8px; background-clip: padding-box;
}
::-webkit-scrollbar-thumb:hover { background: var(--text2); background-clip: padding-box; }

:focus-visible,
textarea#codeEditor:focus-visible,
input:focus-visible,
select:focus-visible,
button:focus-visible,
[tabindex]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  display: flex; height: 100vh;
  background: var(--bg); color: var(--text);
}
/* 仅互动元素禁用文本选择，文件路径/名称允许选中复制 */
#toolbar, .tab, #tabs, button { user-select: none; }

/* ═══ 侧栏 ═══ */
#sidebar {
  width: 220px; min-width: 180px;
  background: var(--sidebar);
  border-right: 1px solid var(--divider);
  overflow-y: auto; padding: 8px;
}
.sidebar-search {
  width: 100%; padding: 6px 8px; margin: 4px 0 6px;
  border: 1px solid var(--divider); border-radius: 6px;
  background: var(--input-bg); color: var(--text); font-size: 10px; outline: none;
}
.api-list { max-height: 230px; overflow-y: auto; }
.api-item {
  padding: 6px 7px; border-radius: 6px; cursor: pointer; margin-bottom: 3px;
  background: rgba(255,255,255,.025); border: 1px solid transparent;
}
.api-item:hover { background: rgba(0,122,255,.1); border-color: rgba(0,122,255,.3); }
.api-item code { color: var(--accent); font-size: 9px; word-break: break-all; }
.api-item span { display: block; color: var(--text3); font-size: 9px; margin-top: 2px; }
#sidebar h4 {
  font-size: 10px; text-transform: uppercase;
  color: var(--text3); margin: 12px 0 4px 8px;
  letter-spacing: 0.5px;
}
.plugin-item, .file-item {
  padding: 6px 8px; cursor: pointer; font-size: 12px;
  border-radius: 6px; display: flex; align-items: center;
  transition: background 0.12s;
}
.plugin-item:hover, .file-item:hover { background: var(--hover); }
.plugin-item.active, .file-item.active { background: var(--accent-soft); color: var(--accent); }
.plugin-item .icon { width: 16px; text-align: center; margin-right: 6px; font-size: 11px; }
.file-item  .icon { width: 14px; text-align: center; margin-right: 6px; font-size: 10px; color: var(--text3); }

/* 文件树层级缩进 */
.file-item[data-depth="1"] { padding-left: 20px; }
.file-item[data-depth="2"] { padding-left: 32px; }
.file-item[data-depth="3"] { padding-left: 44px; }

/* ═══ 主区域 ═══ */
#main { flex: 1; display: flex; flex-direction: column; }

/* 工具栏 */
#toolbar {
  display: flex; gap: 6px; padding: 8px 12px;
  background: var(--card); border-bottom: 1px solid var(--divider);
  align-items: center; flex-wrap: wrap;
}
#toolbar button {
  padding: 5px 12px; border: none; border-radius: 6px;
  font-size: 11px; cursor: pointer; font-weight: 500;
  transition: background 0.15s, transform 0.1s;
}
#toolbar button:active { transform: scale(0.97); }
#toolbar .btn-primary { background: var(--accent); color: #fff; }
#toolbar .btn-primary:hover { background: var(--accent-h); }
#toolbar .btn-secondary { background: var(--divider); color: var(--text2); }
#toolbar .btn-secondary:hover { background: var(--hover); }
#toolbar .btn-green { background: var(--green); color: #fff; }
#toolbar .btn-green:hover { filter: brightness(.92); }
#toolbar input {
  padding: 4px 8px; border: 1px solid var(--divider);
  border-radius: 6px; font-size: 11px; background: var(--input-bg);
  color: var(--text2); width: 120px; outline: none;
}
#toolbar input:focus { border-color: var(--accent); }
#toolbar .sep { width: 1px; height: 18px; background: var(--divider); margin: 0 4px; }

/* 标签栏 */
#tabs {
  display: flex; background: var(--sidebar); border-bottom: 1px solid var(--divider);
  overflow-x: auto;
}
.tab {
  padding: 7px 14px; font-size: 11px; cursor: pointer;
  border-right: 1px solid var(--divider); white-space: nowrap;
  display: flex; align-items: center; gap: 6px;
  transition: background 0.12s;
}
.tab:hover { background: var(--hover); }
.tab.active { background: var(--bg); border-bottom: 2px solid var(--accent); }
.tab .dot { color: var(--accent); font-size: 8px; display: none; }
.tab .dot.show { display: inline; }
.tab .close { color: var(--text3); font-size: 13px; cursor: pointer; padding: 0 2px; }
.tab .close:hover { color: var(--red); }

/* 编辑器 */
#editor { flex: 1; display: flex; overflow: hidden; position: relative; }
#editorWrap { flex: 1; display: flex; position: relative; }
#editorHost { flex: 1; position: relative; min-width: 0; }
#lineNumbers {
  width: 40px; min-width: 40px;
  background: var(--bg); color: var(--text3);
  font-family: 'Consolas', 'Monaco', monospace;
  font-size: 13px; line-height: 1.6;
  padding: 12px 0; overflow: hidden; text-align: right;
  border-right: 1px solid var(--divider); user-select: none;
}
#lineNumbers span {
  display: block; padding: 0 8px 0 4px;
  counter-increment: line;
}
textarea#codeEditor {
  flex: 1;
  background: transparent; color: var(--text);
  border: none; padding: 12px; font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
  font-size: 13px; line-height: 1.6; resize: none; outline: none;
  tab-size: 4; white-space: pre; overflow: auto;
}
textarea#codeEditor.readonly { opacity: 0.7; cursor: default; }
.CodeMirror {
  height: 100%; background: var(--bg); color: var(--text);
  font-family: 'Cascadia Code', 'Consolas', 'Monaco', monospace;
  font-size: 13px; line-height: 1.65;
}
.CodeMirror-gutters { background: var(--editor-gutter); border-right: 1px solid var(--divider); }
.CodeMirror-linenumber { color: var(--text3); padding: 0 8px 0 4px; }
.CodeMirror-cursor { border-left-color: var(--accent); }
.CodeMirror-selected { background: var(--editor-selection) !important; }
.CodeMirror-matchingbracket { color: var(--green) !important; border-bottom: 1px solid var(--green); }
.CodeMirror-hints {
  background: var(--card); border: 1px solid var(--divider); color: var(--text);
  border-radius: 9px; box-shadow: 0 12px 32px var(--shadow); padding: 5px;
}
.CodeMirror-hint { border-radius: 5px; padding: 5px 9px; }
li.CodeMirror-hint-active { background: rgba(0,122,255,.3); color: #fff; }

/* 运行日志 */
#consolePanel {
  display: none; height: 180px; min-height: 120px; flex-direction: column;
  border-top: 1px solid var(--divider); background: var(--console-bg);
}
#consolePanel.show { display: flex; }
.console-head {
  height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 12px;
  background: var(--console-head); color: var(--text2); font-size: 10px;
}
.console-head button { border: 0; border-radius: 5px; padding: 3px 8px; cursor: pointer; background: var(--console-button); color: var(--text2); }
#consoleOutput {
  flex: 1; overflow: auto; padding: 9px 12px; white-space: pre-wrap;
  font: 10px/1.55 'Cascadia Code','Consolas',monospace; color: var(--text2);
}

/* 搜索栏 */
#searchBar {
  display: none; position: absolute; top: 0; right: 8px; z-index: 10;
  background: var(--card); border: 1px solid var(--divider);
  border-radius: 0 0 6px 6px; padding: 6px 10px;
  align-items: center; gap: 4px;
}
#searchBar.show { display: flex; }
#searchBar input {
  width: 160px; padding: 4px 6px; border: 1px solid var(--divider);
  border-radius: 6px; font-size: 12px; background: var(--input-bg); color: var(--text2);
  font-family: 'Consolas', monospace;
}
#searchBar span { font-size: 11px; color: var(--text3); min-width: 30px; text-align: center; }
#searchBar button {
  padding: 2px 6px; border: 1px solid var(--divider); border-radius: 4px;
  background: var(--card); color: var(--text2); cursor: pointer; font-size: 11px;
}
#searchBar button:hover { background: var(--divider); }

/* 空状态 */
#empty {
  flex: 1; display: flex; align-items: center; justify-content: center;
  color: var(--text3); font-size: 13px; flex-direction: column; gap: 8px;
}
#empty h3 { color: var(--text2); font-weight: 600; }
#empty p { color: var(--text3); font-size: 12px; }

/* 状态栏 */
#status {
  font-size: 11px; padding: 5px 12px;
  background: var(--accent); color: #fff;
  display: none; align-items: center; justify-content: space-between;
  transition: background 0.2s;
}
#status.show { display: flex; }
#status.saved { background: var(--green); }

/* 对话框 */
.overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: var(--overlay); display: none;
  align-items: center; justify-content: center; z-index: 100;
}
.overlay.show { display: flex; }
.dialog {
  background: var(--card); padding: 24px; border-radius: 10px;
  min-width: 400px; max-width: 480px; box-shadow: 0 18px 48px var(--shadow);
}
.dialog h3 { margin-bottom: 16px; color: var(--text); font-size: 15px; }
.dialog p { margin: 0 0 20px; color: var(--text2); font-size: 12px; line-height: 1.5; }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
.dialog label { display: block; font-size: 11px; color: var(--text2); margin-bottom: 4px; font-weight: 500; }
.dialog input, .dialog select {
  width: 100%; padding: 6px 10px; margin-bottom: 12px;
  border: 1px solid var(--divider); border-radius: 6px;
  background: var(--input-bg); color: var(--text); font-size: 12px;
  outline: none;
}
.dialog input:focus, .dialog select:focus { border-color: var(--accent); }
.dialog button {
  padding: 6px 18px; border: none; border-radius: 6px;
  font-size: 12px; cursor: pointer; margin-right: 8px; font-weight: 500;
  transition: background 0.15s;
}
.dialog .btn-primary { background: var(--accent); color: #fff; }
.dialog .btn-primary:hover { background: var(--accent-h); }
.dialog .btn-secondary { background: var(--divider); color: var(--text2); }
.dialog .btn-secondary:hover { background: var(--hover); }
.dialog .btn-danger { background: var(--red); color: #fff; }
.dialog .btn-danger:hover { filter: brightness(1.08); }

/* 能力勾选区域 */
.caps-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
  margin-bottom: 12px; max-height: 240px; overflow-y: auto;
  padding: 8px; background: var(--bg); border-radius: 6px;
}
.caps-grid label {
  display: grid; grid-template-columns: auto 20px 1fr; align-items: center; gap: 6px;
  font-size: 11px; color: var(--text2); cursor: pointer; padding: 7px;
  border: 1px solid transparent; border-radius: 7px; background: rgba(255,255,255,0.025);
}
.caps-grid label:hover { border-color: rgba(0,122,255,0.45); background: rgba(0,122,255,0.08); }
.cap-icon { font-size: 14px; text-align: center; }
.cap-name { color: var(--text); font-weight: 600; }
.cap-id { display: block; color: var(--text3); font-size: 9px; margin-top: 1px; }
.cap-desc { display: block; color: var(--text2); font-size: 9px; margin-top: 2px; line-height: 1.3; }
.cap-risk-high .cap-name { color: #ff8b84; }
.cap-risk-medium .cap-name { color: #ffd166; }
.caps-grid input[type="checkbox"] { accent-color: var(--accent); width: auto; margin: 0; }
</style>
</head>
<body>

<!-- ══════════ 侧栏 ══════════ -->
<div id="sidebar">
  <h4 data-i18n="developer.workbench.plugins"></h4>
  <div id="pluginList"></div>
  <div id="fileTree"></div>
  <h4>LONG API</h4>
  <input id="apiFilter" class="sidebar-search" data-i18n-placeholder="developer.workbench.apiSearch" oninput="renderApiExplorer()">
  <div id="apiList" class="api-list"></div>
</div>

<!-- ══════════ 主区域 ══════════ -->
<div id="main">
  <!-- 工具栏 -->
  <div id="toolbar">
    <button class="btn-primary" onclick="showNewDialog()" data-i18n="developer.workbench.new"></button>
    <span class="sep"></span>
    <button class="btn-secondary" onclick="saveCurrent()" title="Ctrl+S" data-i18n="developer.workbench.save"></button>
    <button class="btn-secondary" onclick="previewCurrent()" data-i18n="developer.workbench.preview"></button>
    <span class="sep"></span>
    <button class="btn-secondary" onclick="showSearch()" title="Ctrl+F" data-i18n="developer.workbench.search"></button>
    <button class="btn-secondary" onclick="showLongHints()" title="Ctrl+Space" data-i18n="developer.workbench.apiHints"></button>
    <button class="btn-secondary" onclick="toggleConsole()" data-i18n-title="developer.workbench.logs.tooltip" data-i18n="developer.workbench.logs"></button>
    <span class="sep"></span>
    <span id="fileInfo" style="color:var(--text3);font-size:11px;margin-left:4px"></span>
    <span style="flex:1"></span>
    <button class="btn-secondary" onclick="location.reload()" data-i18n="developer.workbench.refresh"></button>
  </div>

  <!-- 标签栏 -->
  <div id="tabs"></div>

  <!-- 编辑器 -->
  <div id="editor">
    <div id="empty">
      <h3 data-i18n="developer.workbench.empty.title"></h3>
      <p data-i18n="developer.workbench.empty.desc"></p>
    </div>
    <div id="editorWrap" style="display:none">
      <div id="editorHost">
        <textarea id="codeEditor" spellcheck="false"
          onkeydown="handleKeydown(event)"
          oninput="onEditorInput()"
          onscroll="syncScroll()"></textarea>
        <!-- 搜索栏 -->
        <div id="searchBar">
          <input id="searchInput" data-i18n-placeholder="developer.workbench.search.placeholder" oninput="doSearch()" onkeydown="handleSearchKey(event)">
          <span id="searchCount">0/0</span>
          <button onclick="searchPrev()" data-i18n-title="developer.workbench.search.previous">▲</button>
          <button onclick="searchNext()" data-i18n-title="developer.workbench.search.next">▼</button>
          <button onclick="closeSearch()" data-i18n-title="developer.workbench.search.close">✕</button>
        </div>
      </div>
    </div>
  </div>

  <div id="consolePanel">
    <div class="console-head">
      <strong data-i18n="developer.workbench.logs"></strong>
      <span id="consolePlugin" data-i18n="developer.workbench.logs.select"></span>
      <span style="flex:1"></span>
      <button onclick="refreshPluginLogs()" data-i18n="developer.workbench.logs.refresh"></button>
      <button onclick="clearConsole()" data-i18n="developer.workbench.logs.clear"></button>
      <button onclick="toggleConsole(false)" data-i18n="developer.workbench.logs.close"></button>
    </div>
    <div id="consoleOutput" data-i18n="developer.workbench.logs.empty"></div>
  </div>

  <!-- 状态栏 -->
  <div id="status"></div>
</div>

<!-- ══════════ 新建对话框 ══════════ -->
<div id="newDialog" class="overlay" role="dialog" aria-modal="true" aria-labelledby="newDialogTitle">
  <div class="dialog">
    <h3 id="newDialogTitle" data-i18n="developer.workbench.newDialog.title"></h3>
    <label data-i18n="developer.workbench.newDialog.type"></label>
    <select id="newType" onchange="onTypeChange()">
      <option value="web" data-i18n="developer.workbench.newDialog.webType"></option>
      <option value="script" data-i18n="developer.workbench.newDialog.scriptType"></option>
    </select>
    <label data-i18n="developer.workbench.newDialog.name"></label>
    <input id="newName" data-i18n-placeholder="developer.workbench.newDialog.namePlaceholder">
    <label data-i18n="developer.workbench.newDialog.id"></label>
    <input id="newId" placeholder="com.example.myplugin">
    <label data-i18n="developer.workbench.newDialog.capabilities"></label>
    <div class="caps-grid" id="capsGrid"></div>
    <br>
    <button class="btn-primary" onclick="createPlugin()" data-i18n="action.create"></button>
    <button class="btn-secondary" onclick="closeNewDialog()" data-i18n="action.cancel"></button>
  </div>
</div>

<div id="confirmDialog" class="overlay" role="alertdialog" aria-modal="true"
     aria-labelledby="confirmDialogTitle" aria-describedby="confirmDialogMessage">
  <div class="dialog">
    <h3 id="confirmDialogTitle" data-i18n="developer.workbench.confirm.title"></h3>
    <p id="confirmDialogMessage" data-i18n="developer.workbench.closeUnsaved"></p>
    <div class="dialog-actions">
      <button id="confirmCancel" class="btn-secondary" onclick="resolveDiscard(false)"
              data-i18n="action.cancel"></button>
      <button id="confirmDiscard" class="btn-danger" onclick="resolveDiscard(true)"
              data-i18n="developer.workbench.confirm.discard"></button>
    </div>
  </div>
</div>

<script src="../Assets/CodeMirror/lib/codemirror.min.js"></script>
<script src="../Assets/CodeMirror/mode/javascript/javascript.min.js"></script>
<script src="../Assets/CodeMirror/mode/xml/xml.min.js"></script>
<script src="../Assets/CodeMirror/mode/css/css.min.js"></script>
<script src="../Assets/CodeMirror/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="../Assets/CodeMirror/mode/clike/clike.min.js"></script>
<script src="../Assets/CodeMirror/addon/edit/closebrackets.min.js"></script>
<script src="../Assets/CodeMirror/addon/edit/matchbrackets.min.js"></script>
<script src="../Assets/CodeMirror/addon/hint/show-hint.min.js"></script>
<script>
// ══════════════════════════════════════════════
// 状态
// ══════════════════════════════════════════════
var tabs = [], currentTab = -1, currentPlugin = '', currentPluginId = '', fileCache = {};
var searchResults = [], searchIdx = -1;
var suppressEditorChange = false;
var localizedStrings = {};
var consoleStateKey = '';
var statusState = null;
var lastPlugins = null;
var lastFiles = null;
var capabilitySelectionToRestore = null;
var pendingDiscardTab = null;
var focusBeforeConfirm = null;

function t(key) {
  return localizedStrings[key] || key;
}

function setRuntimeText(id, value) {
  var element = document.getElementById(id);
  element.removeAttribute('data-i18n');
  element.textContent = value;
}

function applyLocalization(data) {
  if (!data || !data.strings) return;
  localizedStrings = data.strings;
  longApiCatalog = (data.apiCatalog || []).map(function(item) {
    return [item.api, item.description, item.capability];
  });
  document.documentElement.lang = data.language || 'zh-CN';
  document.title = t('developer.workbench.pageTitle');
  document.querySelectorAll('[data-i18n]').forEach(function(element) {
    element.textContent = t(element.dataset.i18n);
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(function(element) {
    element.placeholder = t(element.dataset.i18nPlaceholder);
  });
  document.querySelectorAll('[data-i18n-title]').forEach(function(element) {
    element.title = t(element.dataset.i18nTitle);
  });
  if (lastPlugins) renderPlugins(lastPlugins);
  if (lastFiles) renderFileTree(lastFiles);
  if (consoleStateKey) setRuntimeText('consoleOutput', t(consoleStateKey));
  if (statusState) showLocalizedStatus(statusState.key, statusState.success);
  renderApiExplorer();
  if (document.getElementById('newDialog').classList.contains('show')) {
    capabilitySelectionToRestore = Array.from(
      document.querySelectorAll('#capsGrid input:checked')
    ).map(function(input) { return input.value; });
    api('listCapabilities');
  }
  renderTabs();
}

function applyAppearance(data) {
  var theme = data && data.theme === 'light' ? 'light' : 'dark';
  document.documentElement.dataset.longTheme = theme;
  codeMirrorEditor.setOption('theme', theme === 'light' ? 'default' : 'material-darker');
}
var longApiCatalog = [];

var codeMirrorEditor = CodeMirror.fromTextArea(document.getElementById('codeEditor'), {
  theme: 'material-darker',
  mode: 'javascript',
  lineNumbers: true,
  indentUnit: 2,
  tabSize: 2,
  lineWrapping: false,
  matchBrackets: true,
  autoCloseBrackets: true,
  styleActiveLine: true,
  extraKeys: {
    'Ctrl-S': function() { saveCurrent(); },
    'Cmd-S': function() { saveCurrent(); },
    'Ctrl-F': function() { showSearch(); },
    'Cmd-F': function() { showSearch(); },
    'Ctrl-Space': function() { showLongHints(); },
    'Tab': function(cm) { cm.replaceSelection('  ', 'end'); }
  }
});

codeMirrorEditor.on('change', function(cm, change) {
  if (suppressEditorChange) return;
  onEditorInput();
  if (change.origin === '+input' && change.text && change.text.join('').endsWith('.')) {
    setTimeout(showLongHints, 0);
  }
});

function editorModeForPath(path) {
  var ext = (path.split('.').pop() || '').toLowerCase();
  if (ext === 'ts') return { name: 'javascript', typescript: true };
  if (ext === 'json') return { name: 'javascript', json: true };
  if (ext === 'html' || ext === 'htm') return 'htmlmixed';
  if (ext === 'css') return 'css';
  if (ext === 'cs' || ext === 'csx') return 'text/x-csharp';
  return 'javascript';
}

function showLongHints() {
  if (!codeMirrorEditor || currentTab < 0) return;
  var cursor = codeMirrorEditor.getCursor();
  var token = codeMirrorEditor.getTokenAt(cursor);
  var raw = token.string || '';
  var start = token.start;
  var lineBefore = codeMirrorEditor.getRange({line: cursor.line, ch: 0}, cursor);
  var match = lineBefore.match(/[A-Za-z0-9_.]+$/);
  var query = match ? match[0] : raw;
  if (match) start = cursor.ch - query.length;
  var normalized = query.toLowerCase();
  var list = longApiCatalog
    .filter(function(item) { return !normalized || item[0].toLowerCase().indexOf(normalized) >= 0; })
    .map(function(item) {
      return {
        text: item[0],
        displayText: item[0] + '  —  ' + item[1] + (item[2] ? '  [' + item[2] + ']' : '')
      };
    });
  codeMirrorEditor.showHint({
    hint: function() {
      return { list: list, from: CodeMirror.Pos(cursor.line, start), to: cursor };
    },
    completeSingle: false
  });
}

// ══════════════════════════════════════════════
// JS → C# Bridge
// ══════════════════════════════════════════════
function api(action, data) {
  data = data || {};
  window.chrome.webview.postMessage({
    Action: action,
    Path: data.path,
    Content: data.content,
    Template: data.template,
    Name: data.name,
    Id: data.id,
    Capabilities: data.capabilities
  });
}

api('listPlugins');

function handleMessage(raw) {
  try { var m = typeof raw === 'string' ? JSON.parse(raw) : raw; } catch(e) { return; }
  switch(m.type) {
    case 'localization':     applyLocalization(m.data); break;
    case 'appearance':       applyAppearance(m.data); break;
    case 'pluginsListed':    renderPlugins(m.data); break;
    case 'filesListed':      renderFileTree(m.data); break;
    case 'fileOpened':       openInTab(m.data.path, m.data.content, m.data.readOnly); break;
    case 'fileSaved':        onFileSaved(m.data); break;
    case 'pluginCreated':    onPluginCreated(); break;
    case 'capabilitiesListed': renderCaps(m.data); break;
    case 'pluginLogs':       renderPluginLogs(m.data); break;
    case 'error':            showLocalizedStatus(m.data.key, false); break;
  }
}

// ══════════════════════════════════════════════
// 插件列表
// ══════════════════════════════════════════════
function renderPlugins(plugins) {
  lastPlugins = plugins || [];
  var h = '';
  (plugins||[]).forEach(function(p) {
    var icon = p.hasManifest ? '\u25C9' : '\u25CB';
    var color = p.hasManifest ? 'color:var(--green)' : 'color:var(--text3)';
    h += '<div class="plugin-item" data-path="' + escAttr(p.path) + '" data-id="' + escAttr(p.id || '') + '" ' +
         'onclick="selectPlugin(this.dataset.path,this.dataset.id)">' +
         '<span class="icon" style="' + color + '">' + icon + '</span>' + esc(p.name) + '</div>';
  });
  document.getElementById('pluginList').innerHTML = h ||
    '<span style="color:var(--text3);font-size:11px">' + t('developer.workbench.plugins.empty') + '</span>';
}

function selectPlugin(dir, pluginId) {
  currentPlugin = dir;
  currentPluginId = pluginId || '';
  setRuntimeText('consolePlugin', currentPluginId || dir.split('/').pop());
  document.querySelectorAll('.plugin-item').forEach(function(el) {
    el.classList.toggle('active', el.dataset.path === dir);
  });
  document.getElementById('fileTree').innerHTML = '';
  api('listFiles', { path: dir });
}

function renderApiExplorer() {
  var query = (document.getElementById('apiFilter')?.value || '').trim().toLowerCase();
  var items = longApiCatalog.filter(function(item) {
    return !query || item.join(' ').toLowerCase().indexOf(query) >= 0;
  }).slice(0, 60);
  document.getElementById('apiList').innerHTML = items.map(function(item) {
    return '<div class="api-item" data-api="' + escAttr(item[0]) + '" onclick="insertApi(this.dataset.api)">' +
      '<code>' + esc(item[0]) + '</code><span>' + esc(item[1]) +
      (item[2] ? ' · ' + esc(item[2]) : '') + '</span></div>';
  }).join('');
}

function insertApi(apiText) {
  if (currentTab < 0) return;
  codeMirrorEditor.replaceSelection(apiText, 'end');
  codeMirrorEditor.focus();
}

function toggleConsole(force) {
  var panel = document.getElementById('consolePanel');
  var show = typeof force === 'boolean' ? force : !panel.classList.contains('show');
  panel.classList.toggle('show', show);
  setTimeout(function() { codeMirrorEditor.refresh(); }, 0);
  if (show) refreshPluginLogs();
}

function refreshPluginLogs() {
  if (!currentPluginId) {
    setConsoleState('developer.workbench.logs.selectRequired');
    return;
  }
  setConsoleState('developer.workbench.logs.loading');
  api('getLogs', { id: currentPluginId });
}

function renderPluginLogs(data) {
  var lines = data && data.lines ? data.lines : [];
  if (lines.length) {
    consoleStateKey = '';
    setRuntimeText('consoleOutput', lines.join('\n'));
  } else {
    setConsoleState('developer.workbench.logs.pluginEmpty');
  }
}

function clearConsole() {
  setConsoleState('developer.workbench.logs.cleared');
}

function setConsoleState(key) {
  consoleStateKey = key;
  setRuntimeText('consoleOutput', t(key));
}

// ══════════════════════════════════════════════
// 文件树 (层级结构)
// ══════════════════════════════════════════════
function renderFileTree(data) {
  lastFiles = data;
  var files = (data.files||[]).sort(function(a,b) { return a.name.localeCompare(b.name); });

  // 构建目录树
  var tree = { _files: [] };
  files.forEach(function(f) {
    var parts = f.name.split('/');
    var node = tree;
    for (var i = 0; i < parts.length - 1; i++) {
      if (!node[parts[i]]) node[parts[i]] = { _files: [] };
      node = node[parts[i]];
    }
    node._files.push({ name: parts[parts.length-1], path: f.path, depth: parts.length - 1 });
  });

  var h = '<h4>' + t('developer.workbench.files') + '</h4>';
  h += renderTree(tree, 0, data.dir);
  document.getElementById('fileTree').innerHTML = h;
}

function renderTree(node, depth, basePath) {
  var h = '';
  // 文件
  (node._files||[]).forEach(function(f) {
    var icon = getFileIcon(f.name);
    h += '<div class="file-item" data-depth="' + depth + '" onclick="openFile(\'' + escAttr(f.path) + '\')">' +
         '<span class="icon">' + icon + '</span>' + esc(f.name) + '</div>';
  });
  // 子目录
  Object.keys(node).forEach(function(key) {
    if (key === '_files') return;
    h += '<div class="file-item" data-depth="' + depth + '" style="color:var(--accent);font-weight:500">' +
         '<span class="icon">\u25B6</span>' + key + '</div>';
    h += renderTree(node[key], depth + 1, basePath);
  });
  return h;
}

function getFileIcon(name) {
  if (name.endsWith('.json')) return '{}';
  if (name.endsWith('.html') || name.endsWith('.htm')) return '&lt;&gt;';
  if (name.endsWith('.cs') || name.endsWith('.csx')) return 'C#';
  if (name.endsWith('.csproj')) return '\u2699';
  if (name.endsWith('.md')) return 'MD';
  return '\u25A1';
}

// ══════════════════════════════════════════════
// 标签页 & 编辑器
// ══════════════════════════════════════════════
function openFile(path) {
  if (fileCache[path]) { openInTab(path, fileCache[path]); return; }
  api('openFile', { path: path });
}

function openInTab(path, content, readOnly) {
  fileCache[path] = content;
  var name = path.split('\\').pop().split('/').pop();
  var idx = tabs.findIndex(function(t) { return t.path === path; });
  if (idx >= 0) {
    currentTab = idx;
  } else {
    tabs.push({ path: path, name: name, content: content, dirty: false, readOnly: !!readOnly });
    currentTab = tabs.length - 1;
  }
  renderTabs(); showEditor(); updateFileInfo();
}

function renderTabs() {
  var h = '';
  tabs.forEach(function(t, i) {
    var cls = 'tab' + (i === currentTab ? ' active' : '');
    var dot = t.dirty ? ' show' : '';
    var ro = t.readOnly ? ' [' + window.t('developer.workbench.readOnly') + ']' : '';
    h += '<div class="' + cls + '" onclick="switchTab(' + i + ')">' +
         '<span class="dot' + dot + '">\u25CF</span>' +
         esc(t.name) + ro +
         '<span class="close" onclick="event.stopPropagation();closeTab(' + i + ')">\u00D7</span></div>';
  });
  document.getElementById('tabs').innerHTML = h;
}

function switchTab(i) {
  currentTab = i; renderTabs(); showEditor(); updateFileInfo();
}

function closeTab(i) {
  var tab = tabs[i];
  if (!tab) return;
  if (tab.dirty) {
    showDiscardConfirm(tab);
    return;
  }
  closeTabNow(tab);
}

function closeTabNow(tab) {
  var i = tabs.indexOf(tab);
  if (i < 0) return;
  if (fileCache[tab.path]) delete fileCache[tab.path];
  tabs.splice(i, 1);
  if (currentTab >= tabs.length) currentTab = tabs.length - 1;
  renderTabs();
  if (tabs.length === 0) {
    document.getElementById('editorWrap').style.display = 'none';
    document.getElementById('empty').style.display = 'flex';
  } else {
    showEditor();
  }
  updateFileInfo();
}

function showDiscardConfirm(tab) {
  pendingDiscardTab = tab;
  focusBeforeConfirm = document.activeElement;
  document.getElementById('confirmDialog').classList.add('show');
  setTimeout(function() { document.getElementById('confirmCancel').focus(); }, 0);
}

function resolveDiscard(confirmed) {
  var tab = pendingDiscardTab;
  pendingDiscardTab = null;
  document.getElementById('confirmDialog').classList.remove('show');
  if (confirmed && tab) {
    closeTabNow(tab);
  } else if (focusBeforeConfirm && typeof focusBeforeConfirm.focus === 'function') {
    focusBeforeConfirm.focus();
  }
  focusBeforeConfirm = null;
}

document.addEventListener('keydown', function(event) {
  var dialog = document.getElementById('confirmDialog');
  if (!dialog.classList.contains('show')) return;
  if (event.key === 'Escape') {
    event.preventDefault();
    event.stopPropagation();
    resolveDiscard(false);
    return;
  }
  if (event.key !== 'Tab') return;
  var cancel = document.getElementById('confirmCancel');
  var discard = document.getElementById('confirmDiscard');
  if (event.shiftKey && document.activeElement === cancel) {
    event.preventDefault();
    discard.focus();
  } else if (!event.shiftKey && document.activeElement === discard) {
    event.preventDefault();
    cancel.focus();
  }
}, true);

function showEditor() {
  if (currentTab < 0) return;
  document.getElementById('empty').style.display = 'none';
  document.getElementById('editorWrap').style.display = 'flex';
  suppressEditorChange = true;
  codeMirrorEditor.setOption('mode', editorModeForPath(tabs[currentTab].path));
  codeMirrorEditor.setOption('readOnly', !!tabs[currentTab].readOnly);
  codeMirrorEditor.setValue(tabs[currentTab].content || '');
  suppressEditorChange = false;
  setTimeout(function() {
    codeMirrorEditor.refresh();
    codeMirrorEditor.focus();
    codeMirrorEditor.setCursor({ line: 0, ch: 0 });
  }, 0);
}

function onEditorInput() {
  if (currentTab < 0) return;
  tabs[currentTab].content = codeMirrorEditor.getValue();
  if (!tabs[currentTab].dirty) {
    tabs[currentTab].dirty = true;
    renderTabs();
  }
}

function updateFileInfo() {
  var el = document.getElementById('fileInfo');
  if (currentTab >= 0 && tabs[currentTab]) {
    var p = tabs[currentTab].path;
    var parts = p.replace(/\\/g, '/').split('/');
    el.textContent = parts.slice(-2).join('/');
  } else {
    el.textContent = '';
  }
}

  // CodeMirror manages line numbers.

// ══════════════════════════════════════════════
// 保存
// ══════════════════════════════════════════════
function saveCurrent() {
  if (currentTab < 0 || !tabs[currentTab] || tabs[currentTab].readOnly) return;
  var t = tabs[currentTab];
  t.content = codeMirrorEditor.getValue();
  fileCache[t.path] = t.content;
  api('saveFile', { path: t.path, content: t.content });
}

function onFileSaved(data) {
  if (data.success) {
    var savedTab = tabs.find(function(tab) { return tab.path === data.path; });
    if (savedTab) {
      savedTab.dirty = false;
      renderTabs();
    }
    showLocalizedStatus('developer.workbench.status.saved', true);
  } else {
    showLocalizedStatus(data.errorKey || 'developer.workbench.error.save', false);
  }
}

// ══════════════════════════════════════════════
// 搜索 (Ctrl+F)
// ══════════════════════════════════════════════
function showSearch() {
  document.getElementById('searchBar').classList.add('show');
  document.getElementById('searchInput').focus();
  document.getElementById('searchInput').select();
}
function closeSearch() {
  document.getElementById('searchBar').classList.remove('show');
  searchResults = []; searchIdx = -1;
  document.getElementById('searchCount').textContent = '0/0';
}
function doSearch() {
  var q = document.getElementById('searchInput').value;
  searchResults = [];
  if (!q) { document.getElementById('searchCount').textContent = '0/0'; return; }
  var text = codeMirrorEditor.getValue();
  var idx = text.indexOf(q);
  while (idx >= 0) { searchResults.push(idx); idx = text.indexOf(q, idx + 1); }
  searchIdx = searchResults.length > 0 ? 0 : -1;
  document.getElementById('searchCount').textContent = (searchIdx+1) + '/' + searchResults.length;
  if (searchIdx >= 0) selectSearchResult(q);
}
function searchNext() { navigateSearch(1); }
function searchPrev() { navigateSearch(-1); }
function navigateSearch(dir) {
  if (searchResults.length === 0) return;
  searchIdx = (searchIdx + dir + searchResults.length) % searchResults.length;
  var q = document.getElementById('searchInput').value;
  selectSearchResult(q);
  document.getElementById('searchCount').textContent = (searchIdx+1) + '/' + searchResults.length;
}
function selectSearchResult(q) {
  var start = codeMirrorEditor.posFromIndex(searchResults[searchIdx]);
  var end = codeMirrorEditor.posFromIndex(searchResults[searchIdx] + q.length);
  codeMirrorEditor.setSelection(start, end);
  codeMirrorEditor.scrollIntoView({from:start, to:end}, 80);
  codeMirrorEditor.focus();
}
function handleSearchKey(e) {
  if (e.key === 'Enter') { e.preventDefault(); e.shiftKey ? searchPrev() : searchNext(); }
  if (e.key === 'Escape') closeSearch();
}

// ══════════════════════════════════════════════
// 键盘快捷键
// ══════════════════════════════════════════════
function handleKeydown(e) {
  // Ctrl+S: 保存
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveCurrent(); }
  // Ctrl+F: 搜索
  if ((e.ctrlKey || e.metaKey) && e.key === 'f') { e.preventDefault(); showSearch(); }
  // Tab: 缩进
  if (e.key === 'Tab') {
    e.preventDefault();
    codeMirrorEditor.replaceSelection('  ', 'end');
  }
}

document.addEventListener('keydown', function(e) {
  if (e.key !== 'Escape') return;
  if (document.getElementById('confirmDialog').classList.contains('show')) return;
  if (document.getElementById('newDialog').classList.contains('show')) {
    e.preventDefault();
    closeNewDialog();
    return;
  }
  if (document.getElementById('searchBar').classList.contains('show')) {
    e.preventDefault();
    closeSearch();
    return;
  }
  e.preventDefault();
  api('closeWindow');
}, true);

// ══════════════════════════════════════════════
// 新建插件对话框
// ══════════════════════════════════════════════
function showNewDialog() {
  document.getElementById('newDialog').classList.add('show');
  api('listCapabilities');
}
function closeNewDialog() {
  document.getElementById('newDialog').classList.remove('show');
}
function onTypeChange() {
  api('listCapabilities');
}
function renderCaps(caps) {
  var type = document.getElementById('newType').value;
  var restore = capabilitySelectionToRestore;
  var h = '';
  (caps||[]).forEach(function(c) {
    var isChecked = restore
      ? restore.indexOf(c.id) >= 0
      : type === 'web' && c.id === 'system.notification';
    var checked = isChecked ? 'checked' : '';
    h += '<label class="cap-risk-' + escAttr(c.level || 'unknown') + '" title="' + escAttr(c.description || '') + '">' +
      '<input type="checkbox" value="' + escAttr(c.id) + '" ' + checked + '>' +
      '<span class="cap-icon">' + esc(c.icon || '•') + '</span>' +
      '<span><span class="cap-name">' + esc(c.name || c.id) + '</span>' +
      '<span class="cap-id">' + esc(c.id) + '</span>' +
      '<span class="cap-desc">' + esc(c.description || '') + '</span></span></label>';
  });
  capabilitySelectionToRestore = null;
  document.getElementById('capsGrid').innerHTML = h ||
    '<span style="color:var(--text3);font-size:11px">' +
    t('developer.workbench.capabilities.empty') + '</span>';
}

function createPlugin() {
  var t = document.getElementById('newType').value;
  var n = document.getElementById('newName').value.trim() || 'my-plugin';
  var id = document.getElementById('newId').value.trim() || 'com.example.plugin';
  var caps = [];
  document.querySelectorAll('#capsGrid input:checked').forEach(function(cb) {
    caps.push(cb.value);
  });
  api('newPlugin', { template: t, name: n, id: id, capabilities: caps });
  closeNewDialog();
}

function onPluginCreated() {
  showLocalizedStatus('developer.workbench.status.created', true);
  api('listPlugins');
}

// ══════════════════════════════════════════════
// 预览
// ══════════════════════════════════════════════
function previewCurrent() {
  if (currentTab < 0 || !tabs[currentTab]) return;
  saveCurrent();
  api('preview', { path: tabs[currentTab].path });
  showLocalizedStatus('developer.workbench.status.previewing', false);
}

// ══════════════════════════════════════════════
// 状态栏
// ══════════════════════════════════════════════
var _statusTimer;
function showLocalizedStatus(key, isSuccess) {
  statusState = { key: key, success: isSuccess };
  showStatus(t(key), isSuccess);
}
function showStatus(msg, isSuccess) {
  var s = document.getElementById('status');
  s.textContent = msg;
  s.classList.add('show');
  s.classList.toggle('saved', !!isSuccess);
  clearTimeout(_statusTimer);
  _statusTimer = setTimeout(function() {
    s.classList.remove('show', 'saved');
    statusState = null;
  }, 2000);
}

// ══════════════════════════════════════════════
// 工具函数
// ══════════════════════════════════════════════
function esc(s) {
  return (s||'').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function escAttr(s) {
  return (s||'').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
renderApiExplorer();
