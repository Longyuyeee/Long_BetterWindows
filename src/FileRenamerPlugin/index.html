<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>批量重命名</title>
</head>
<body>
  <main class="long-page">
    <header class="long-page-header">
      <div>
        <div class="long-eyebrow">FILE OPERATION</div>
        <h1 class="long-page-title">批量重命名</h1>
        <p class="long-page-description">只处理明确选中的文件，确认预览后再执行重命名。</p>
      </div>
      <span class="long-badge" id="fileBadge">0 个文件</span>
    </header>

    <section class="long-card long-stack">
      <div class="long-toolbar">
        <button class="long-button long-button--primary btn-primary" id="loadButton" type="button">读取 Explorer 选区</button>
        <span class="long-secondary">不会自动扩大到整个文件夹</span>
      </div>

      <div class="long-toolbar">
        <label class="long-field-label" for="ruleType">命名规则</label>
        <select id="ruleType">
          <option value="none">仅手动编辑</option>
          <option value="prefix">添加前缀</option>
          <option value="suffix">添加后缀</option>
          <option value="replace">查找替换</option>
          <option value="number">顺序编号</option>
          <option value="extension">修改扩展名</option>
        </select>
        <input id="parameterA" placeholder="参数" aria-label="重命名规则参数">
        <input id="parameterB" placeholder="替换为" aria-label="替换后的文本" hidden>
      </div>

      <div class="long-file-list" id="fileList"></div>
      <div class="long-empty" id="emptyState">请先在 Explorer 中选择需要重命名的文件</div>

      <div class="long-toolbar">
        <button class="long-button long-button--primary btn-primary" id="renameButton" type="button" disabled>执行重命名</button>
        <button class="long-button long-button--secondary btn-secondary" id="resetButton" type="button">恢复原名称</button>
        <span class="long-toolbar__spacer"></span>
        <span class="long-secondary" id="changeCount">0 项待修改</span>
      </div>
      <div class="long-status" id="status" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script>
    const list = document.getElementById('fileList');
    const status = document.getElementById('status');
    const renameButton = document.getElementById('renameButton');
    let files = [];
    let previewNames = [];

    function setStatus(message, kind) {
      status.textContent = message;
      status.className = 'long-status ' + (kind ? 'long-status--' + kind : '');
      window.LongUI?.announce(message);
    }

    async function loadSelection() {
      try {
        const response = await long.shell.getSelectedItems();
        if (!response.success || !response.data || !response.data.length) {
          setFiles([]); setStatus('Explorer 当前没有明确选中的文件', 'warning'); return;
        }
        setFiles(response.data);
        setStatus('已读取 ' + files.length + ' 个选中项', 'success');
      } catch (error) { setStatus('读取 Explorer 选区失败：' + error.message, 'danger'); }
    }

    function setFiles(paths) {
      files = paths.filter(function (path) { return typeof path === 'string' && path.length > 0; });
      previewNames = files.map(fileName);
      document.getElementById('fileBadge').textContent = files.length + ' 个文件';
      document.getElementById('emptyState').hidden = files.length > 0;
      applyRule();
    }

    function applyRule() {
      const type = document.getElementById('ruleType').value;
      const a = document.getElementById('parameterA').value;
      const b = document.getElementById('parameterB').value;
      document.getElementById('parameterB').hidden = type !== 'replace';
      previewNames = files.map(function (path, index) {
        const original = fileName(path);
        const parts = splitName(original);
        if (type === 'prefix') return a + original;
        if (type === 'suffix') return parts.base + a + parts.extension;
        if (type === 'replace' && a) return original.split(a).join(b);
        if (type === 'number') return (a || 'file_') + String(index + 1).padStart(String(files.length).length, '0') + parts.extension;
        if (type === 'extension') return parts.base + (a ? '.' + a.replace(/^\.+/, '') : '');
        return previewNames[index] || original;
      });
      renderFiles();
    }

    function renderFiles() {
      list.replaceChildren();
      files.forEach(function (path, index) {
        const row = document.createElement('div'); row.className = 'long-file-row';
        const oldName = document.createElement('span'); oldName.className = 'long-file-row__old'; oldName.textContent = fileName(path); oldName.title = path;
        const arrow = document.createElement('span'); arrow.className = 'long-file-row__arrow'; arrow.textContent = '→';
        const nextName = document.createElement('input'); nextName.className = 'long-file-row__new'; nextName.value = previewNames[index]; nextName.setAttribute('aria-label', '新文件名');
        nextName.addEventListener('input', function () { previewNames[index] = nextName.value; updateValidation(); });
        const badge = document.createElement('span'); badge.className = 'long-badge'; badge.textContent = previewNames[index] === fileName(path) ? '未修改' : '待修改';
        row.append(oldName, arrow, nextName, badge); list.appendChild(row);
      });
      updateValidation();
    }

    function updateValidation() {
      const changed = previewNames.filter(function (name, index) { return name !== fileName(files[index]); }).length;
      const invalid = previewNames.some(function (name) { return !isValidFileName(name); });
      const normalized = previewNames.map(function (name) { return name.toLocaleLowerCase(); });
      const duplicates = new Set(normalized).size !== normalized.length;
      document.getElementById('changeCount').textContent = changed + ' 项待修改';
      renameButton.disabled = !changed || invalid || duplicates;
      if (invalid) setStatus('存在无效文件名', 'danger');
      else if (duplicates) setStatus('预览结果中存在重名', 'danger');
      else if (files.length) setStatus('请确认预览后执行');
    }

    async function executeRename() {
      window.LongUI?.setBusy(renameButton, true);
      const failures = [];
      const failedIndexes = [];
      let completed = 0;
      for (let index = 0; index < files.length; index++) {
        const original = fileName(files[index]);
        if (previewNames[index] === original) continue;
        try {
          const response = await long.shell.renameFile(files[index], previewNames[index]);
          if (response.success) completed++; else { failures.push(original + '：' + (response.error || '失败')); failedIndexes.push(index); }
        } catch (error) { failures.push(original + '：' + error.message); failedIndexes.push(index); }
      }
      window.LongUI?.setBusy(renameButton, false);
      if (failures.length) {
        const failedFiles = failedIndexes.map(function (index) { return files[index]; });
        const failedNames = failedIndexes.map(function (index) { return previewNames[index]; });
        files = failedFiles; previewNames = failedNames; renderFiles();
        setStatus('完成 ' + completed + ' 项，失败 ' + failures.length + ' 项 · ' + failures[0], 'danger');
      } else {
        setFiles([]);
        setStatus('已完成 ' + completed + ' 项重命名', 'success');
      }
    }

    function fileName(path) { return path.replace(/\\/g, '/').split('/').pop() || path; }
    function splitName(name) {
      const index = name.lastIndexOf('.');
      return index > 0 ? { base: name.slice(0, index), extension: name.slice(index) } : { base: name, extension: '' };
    }
    function isValidFileName(name) { return !!name.trim() && !/[<>:"/\\|?*\u0000-\u001F]/.test(name) && !/[. ]$/.test(name); }

    document.getElementById('loadButton').addEventListener('click', loadSelection);
    document.getElementById('renameButton').addEventListener('click', executeRename);
    document.getElementById('resetButton').addEventListener('click', function () { previewNames = files.map(fileName); document.getElementById('ruleType').value = 'none'; renderFiles(); });
    document.getElementById('ruleType').addEventListener('change', applyRule);
    document.getElementById('parameterA').addEventListener('input', applyRule);
    document.getElementById('parameterB').addEventListener('input', applyRule);
    document.addEventListener('keydown', function (event) {
      if (event.ctrlKey && event.key === 'Enter' && !renameButton.disabled) { event.preventDefault(); executeRename(); }
    });
    window.LongUI?.onCommand(function (command) {
      const paths = window.LongUI.commandPaths(command);
      if (paths.length) { setFiles(paths); setStatus('已从命令上下文读取 ' + paths.length + ' 个文件', 'success'); }
      else loadSelection();
    });
  </script>
</body>
</html>
