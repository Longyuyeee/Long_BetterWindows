<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>批量重命名</title>
</head>
<body>
  <main class="long-page">
    <header class="long-page-header">
      <div>
        <div class="long-eyebrow">FILE OPERATION</div>
        <h1 class="long-page-title" data-i18n="page.title">批量重命名</h1>
        <p class="long-page-description" data-i18n="page.description">只处理明确选中的文件，确认预览后再执行重命名。</p>
      </div>
      <span class="long-badge" id="fileBadge">0 个文件</span>
    </header>

    <section class="long-card long-stack">
      <div class="long-toolbar">
        <button class="long-button long-button--primary btn-primary" id="loadButton" type="button" data-i18n="action.load">读取 Explorer 选区</button>
        <span class="long-secondary" data-i18n="selection.scopeHint">不会自动扩大到整个文件夹</span>
      </div>

      <div class="long-toolbar">
        <label class="long-field-label" for="ruleType" data-i18n="field.rule">命名规则</label>
        <select id="ruleType">
          <option value="none" data-i18n="rule.none">仅手动编辑</option>
          <option value="prefix" data-i18n="rule.prefix">添加前缀</option>
          <option value="suffix" data-i18n="rule.suffix">添加后缀</option>
          <option value="replace" data-i18n="rule.replace">查找替换</option>
          <option value="number" data-i18n="rule.number">顺序编号</option>
          <option value="extension" data-i18n="rule.extension">修改扩展名</option>
        </select>
        <input id="parameterA" placeholder="参数" aria-label="重命名规则参数">
        <input id="parameterB" placeholder="替换为" aria-label="替换后的文本" hidden>
      </div>

      <div class="long-toolbar">
        <span class="long-field-label" data-i18n="preview.title">重命名预览</span>
        <span class="long-toolbar__spacer"></span>
        <div class="long-toolbar" id="pagination" hidden>
          <button class="long-button long-button--secondary btn-secondary" id="previousPage" type="button" aria-label="上一页">&larr;</button>
          <span class="long-secondary" id="pageLabel">1 / 1</span>
          <button class="long-button long-button--secondary btn-secondary" id="nextPage" type="button" aria-label="下一页">&rarr;</button>
        </div>
      </div>

      <div class="long-file-list" id="fileList"></div>

      <div class="long-toolbar">
        <button class="long-button long-button--primary btn-primary" id="renameButton" type="button" data-i18n="action.rename" disabled>执行重命名</button>
        <button class="long-button long-button--secondary btn-secondary" id="resetButton" type="button" data-i18n="action.reset">恢复原名称</button>
        <span class="long-toolbar__spacer"></span>
        <span class="long-secondary" id="changeCount">0 项待修改</span>
      </div>
      <div class="long-status" id="status" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script>
    const list = document.getElementById('fileList');
    const status = document.getElementById('status');
    const renameButton = document.getElementById('renameButton');
    const pageSize = 100;
    let files = [];
    let previewNames = [];
    let currentPage = 0;
    let strings = {};
    let listState = 'empty';
    let loadErrorDetail = '';
    let isRenaming = false;
    let selectionRequestId = 0;
    let currentStatus = { key: '', fallback: '', values: {}, kind: '' };

    function t(key, fallback, values) {
      const template = strings[key] || fallback || key;
      return Object.entries(values || {}).reduce(function (text, entry) {
        return text.replaceAll('{' + entry[0] + '}', String(entry[1]));
      }, template);
    }

    function setStatus(key, kind, fallback, values) {
      currentStatus = { key, kind, fallback: fallback || '', values: values || {} };
      const message = key
        ? t(key, fallback, currentStatus.values)
        : currentStatus.fallback;
      status.textContent = message;
      status.className = 'long-status ' + (kind ? 'long-status--' + kind : '');
      if (message) window.LongUI?.announce(message);
      return message;
    }

    function renderListState(updateStatus) {
      if (listState === 'loading') {
        window.LongUI?.renderState(list, {
          kind: 'loading',
          title: t('state.loading', '正在读取 Explorer 选区')
        });
        return;
      }
      if (listState === 'error') {
        window.LongUI?.renderState(list, {
          kind: 'error',
          title: t('state.loadFailed', 'Explorer 选区读取失败'),
          detail: loadErrorDetail,
          actionLabel: t('action.retry', '重试'),
          onAction: loadSelection
        });
        return;
      }
      renderFiles(updateStatus);
    }

    function applyLocalization(message) {
      strings = message.resources || {};
      document.documentElement.lang = message.resolved_language || 'zh-CN';
      document.title = t('plugin.name', '批量重命名');
      document.querySelectorAll('[data-i18n]').forEach(function (element) {
        element.textContent = t(element.dataset.i18n, element.textContent);
      });
      const parameterA = document.getElementById('parameterA');
      const parameterB = document.getElementById('parameterB');
      parameterA.placeholder = t('field.parameter', '参数');
      parameterA.setAttribute(
        'aria-label',
        t('field.parameterAriaLabel', '重命名规则参数'));
      parameterB.placeholder = t('field.replacement', '替换为');
      parameterB.setAttribute(
        'aria-label',
        t('field.replacementAriaLabel', '替换后的文本'));
      document.getElementById('previousPage').setAttribute(
        'aria-label',
        t('preview.previousPage', '上一页'));
      document.getElementById('nextPage').setAttribute(
        'aria-label',
        t('preview.nextPage', '下一页'));
      renderListState(false);
      if (currentStatus.key || currentStatus.fallback) {
        setStatus(
          currentStatus.key,
          currentStatus.kind,
          currentStatus.fallback,
          currentStatus.values);
      }
    }

    async function loadSelection() {
      if (isRenaming) {
        return {
          success: false,
          error: t('status.busy', '正在执行批量重命名，请稍候')
        };
      }
      const requestId = ++selectionRequestId;
      if (!files.length) {
        listState = 'loading';
        renderListState(false);
      }
      try {
        const response = await long.shell.getSelectedItems();
        if (requestId !== selectionRequestId || isRenaming) {
          return {
            success: false,
            error: t('status.busy', '正在执行批量重命名，请稍候')
          };
        }
        if (!response.success) throw new Error(response.error || t('error.selectionRead', 'Explorer 选区读取失败'));
        if (!response.data || !response.data.length) {
          setFiles([]);
          setStatus('status.selectionEmpty', 'warning', 'Explorer 当前没有明确选中的文件');
          return { success: false, error: t('status.selectionEmpty', 'Explorer 当前没有明确选中的文件') };
        }
        setFiles(response.data);
        setStatus(
          'status.selectionLoaded',
          'success',
          '已读取 {count} 个选中项',
          { count: files.length });
        return { success: true, count: files.length };
      } catch (error) {
        if (requestId !== selectionRequestId || isRenaming) {
          return {
            success: false,
            error: t('status.busy', '正在执行批量重命名，请稍候')
          };
        }
        loadErrorDetail = error && error.message ? error.message : String(error);
        if (!files.length) {
          listState = 'error';
          renderListState(false);
        }
        setStatus(
          'status.selectionFailed',
          'danger',
          '读取 Explorer 选区失败：{detail}',
          { detail: loadErrorDetail });
        return { success: false, error: loadErrorDetail };
      }
    }

    function setFiles(paths) {
      const seen = new Set();
      files = paths.filter(function (path) {
        if (typeof path !== 'string' || !path.length) return false;
        const key = path.replace(/\\/g, '/').toLocaleLowerCase();
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
      previewNames = files.map(fileName);
      currentPage = 0;
      listState = files.length ? 'ready' : 'empty';
      applyRule();
    }

    function applyRule() {
      const type = document.getElementById('ruleType').value;
      const a = document.getElementById('parameterA').value;
      const b = document.getElementById('parameterB').value;
      document.getElementById('parameterB').hidden = type !== 'replace';
      previewNames = files.map(function (path, index) {
        const original = fileName(path);
        const parts = splitName(original);
        if (type === 'prefix') return a + original;
        if (type === 'suffix') return parts.base + a + parts.extension;
        if (type === 'replace' && a) return original.split(a).join(b);
        if (type === 'number') return (a || 'file_') + String(index + 1).padStart(String(files.length).length, '0') + parts.extension;
        if (type === 'extension') return parts.base + (a ? '.' + a.replace(/^\.+/, '') : '');
        return previewNames[index] || original;
      });
      renderFiles();
    }

    function renderFiles(updateStatus) {
      if (updateStatus === undefined) updateStatus = true;
      list.replaceChildren();
      document.getElementById('fileBadge').textContent = t(
        'page.fileCount',
        '{count} 个文件',
        { count: files.length });
      if (!files.length) {
        renderPagination(1);
        window.LongUI?.renderState(list, {
          kind: 'empty',
          title: t('state.empty', '等待文件选区'),
          detail: t('state.emptyDetail', '请先在 Explorer 中选择需要重命名的文件')
        });
        updateValidation(updateStatus);
        return;
      }
      const totalPages = Math.max(1, Math.ceil(files.length / pageSize));
      currentPage = Math.min(currentPage, totalPages - 1);
      const start = currentPage * pageSize;
      const end = Math.min(start + pageSize, files.length);
      files.slice(start, end).forEach(function (path, pageIndex) {
        const index = start + pageIndex;
        const row = document.createElement('div'); row.className = 'long-file-row';
        const oldName = document.createElement('span'); oldName.className = 'long-file-row__old'; oldName.textContent = fileName(path); oldName.title = path;
        const arrow = document.createElement('span'); arrow.className = 'long-file-row__arrow'; arrow.textContent = '→';
        const nextName = document.createElement('input'); nextName.className = 'long-file-row__new'; nextName.value = previewNames[index]; nextName.disabled = isRenaming; nextName.setAttribute('aria-label', t('file.newNameAriaLabel', '新文件名'));
        nextName.addEventListener('input', function () { previewNames[index] = nextName.value; updateValidation(); });
        const badge = document.createElement('span'); badge.className = 'long-badge'; badge.textContent = previewNames[index] === fileName(path) ? t('file.unchanged', '未修改') : t('file.pending', '待修改');
        row.append(oldName, arrow, nextName, badge); list.appendChild(row);
      });
      renderPagination(totalPages);
      updateValidation(updateStatus);
    }

    function renderPagination(totalPages) {
      const pagination = document.getElementById('pagination');
      pagination.hidden = files.length <= pageSize;
      document.getElementById('pageLabel').textContent = t(
        'preview.page',
        '{current} / {total}',
        { current: currentPage + 1, total: totalPages });
      document.getElementById('previousPage').disabled = isRenaming || currentPage === 0;
      document.getElementById('nextPage').disabled = isRenaming || currentPage >= totalPages - 1;
    }

    function updateValidation(updateStatus) {
      if (updateStatus === undefined) updateStatus = true;
      const changed = previewNames.filter(function (name, index) { return name !== fileName(files[index]); }).length;
      const invalid = previewNames.some(function (name) { return !isValidFileName(name); });
      const destinations = previewNames.map(function (name, index) {
        return parentPath(files[index]).toLocaleLowerCase() + '\u0000' + name.toLocaleLowerCase();
      });
      const duplicates = new Set(destinations).size !== destinations.length;
      document.getElementById('changeCount').textContent = t(
        'change.count',
        '{count} 项待修改',
        { count: changed });
      renameButton.disabled = isRenaming || !changed || invalid || duplicates;
      if (!updateStatus) return;
      if (invalid) setStatus('status.invalidName', 'danger', '存在无效文件名');
      else if (duplicates) setStatus('status.duplicateName', 'danger', '预览结果中存在重名');
      else if (files.length) setStatus('status.confirm', '', '请确认预览后执行');
    }

    async function executeRename() {
      if (isRenaming) return;
      selectionRequestId++;
      isRenaming = true;
      window.LongUI?.setBusy(renameButton, true);
      setInteractionDisabled(true);
      renderFiles(false);
      const failures = [];
      let completed = 0;
      try {
        const operations = files.map(function (path, index) {
          return { oldPath: path, newName: previewNames[index] };
        }).filter(function (operation, index) {
          return operation.newName !== fileName(files[index]);
        });
        const response = await long.shell.renameBatch(operations);
        if (response.success) {
          completed = Number(response.data || 0);
        } else {
          failures.push(response.error || t('error.rename', '失败'));
        }
      } catch (error) {
        failures.push(error && error.message ? error.message : String(error));
      } finally {
        isRenaming = false;
        window.LongUI?.setBusy(renameButton, false);
        setInteractionDisabled(false);
        renderFiles(false);
      }
      if (failures.length) {
        setStatus(
          'status.transactionFailed',
          'danger',
          '批量重命名失败，请核对文件状态后再重试 · {detail}',
          { detail: failures[0] });
      } else {
        setFiles([]);
        setStatus(
          'status.completed',
          'success',
          '已完成 {count} 项重命名',
          { count: completed });
      }
    }

    function fileName(path) { return path.replace(/\\/g, '/').split('/').pop() || path; }
    function parentPath(path) {
      const normalized = path.replace(/\\/g, '/');
      const index = normalized.lastIndexOf('/');
      return index >= 0 ? normalized.slice(0, index) : '';
    }
    function splitName(name) {
      const index = name.lastIndexOf('.');
      return index > 0 ? { base: name.slice(0, index), extension: name.slice(index) } : { base: name, extension: '' };
    }
    function isValidFileName(name) {
      const base = name.split('.')[0].toLocaleUpperCase();
      return !!name.trim()
        && name.length <= 255
        && !/[<>:"/\\|?*\u0000-\u001F]/.test(name)
        && !/[. ]$/.test(name)
        && !/^(CON|PRN|AUX|NUL|COM[1-9]|LPT[1-9])$/.test(base);
    }

    function setInteractionDisabled(disabled) {
      document.getElementById('loadButton').disabled = disabled;
      document.getElementById('resetButton').disabled = disabled;
      document.getElementById('ruleType').disabled = disabled;
      document.getElementById('parameterA').disabled = disabled;
      document.getElementById('parameterB').disabled = disabled;
    }

    document.getElementById('loadButton').addEventListener('click', loadSelection);
    document.getElementById('renameButton').addEventListener('click', executeRename);
    document.getElementById('resetButton').addEventListener('click', function () { previewNames = files.map(fileName); document.getElementById('ruleType').value = 'none'; renderFiles(); });
    document.getElementById('ruleType').addEventListener('change', applyRule);
    document.getElementById('parameterA').addEventListener('input', applyRule);
    document.getElementById('parameterB').addEventListener('input', applyRule);
    document.getElementById('previousPage').addEventListener('click', function () {
      if (isRenaming || currentPage === 0) return;
      currentPage--;
      renderFiles(false);
    });
    document.getElementById('nextPage').addEventListener('click', function () {
      if (isRenaming || (currentPage + 1) * pageSize >= files.length) return;
      currentPage++;
      renderFiles(false);
    });
    document.addEventListener('keydown', function (event) {
      if (event.ctrlKey && event.key === 'Enter' && !renameButton.disabled) { event.preventDefault(); executeRename(); }
    });
    window.LongUI?.onCommand(async function (command) {
      if (isRenaming) {
        return {
          success: false,
          message: t('status.busy', '正在执行批量重命名，请稍候'),
          outputs: {}
        };
      }
      const paths = window.LongUI.commandPaths(command);
      if (paths.length) {
        selectionRequestId++;
        setFiles(paths);
        setStatus('status.contextLoaded', 'success', '已从命令上下文读取 {count} 个文件', { count: paths.length });
      } else {
        const loaded = await loadSelection();
        if (!loaded.success) {
          return { success: false, message: loaded.error, outputs: {} };
        }
      }
      return {
        success: true,
        message: t('command.previewReady', '批量重命名预览已就绪'),
        outputs: {
          'selected-count': {
            type: 'text',
            value: String(files.length)
          }
        }
      };
    });
    window.chrome?.webview?.addEventListener('message', function ({ data }) {
      if (data?.type === 'long.language-changed') applyLocalization(data);
    });
    renderListState(false);
  </script>
</body>
</html>
