<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>密码生成器</title>
</head>
<body>
  <main class="long-page">
    <header class="long-page-header">
      <div>
        <div class="long-eyebrow">SECURITY</div>
        <h1 class="long-page-title">密码生成器</h1>
        <p class="long-page-description">使用浏览器安全随机源生成高强度密码，不上传任何数据。</p>
      </div>
      <span class="long-badge" id="strength">强</span>
    </header>

    <section class="long-card long-stack" aria-label="密码生成选项">
      <div class="long-field">
        <div class="long-toolbar">
          <label class="long-field-label" for="length">密码长度</label>
          <span class="long-toolbar__spacer"></span>
          <strong id="lengthValue">20</strong>
        </div>
        <input class="long-range" id="length" type="range" min="6" max="64" value="20">
      </div>

      <div class="long-option-list">
        <label class="long-option"><input type="checkbox" id="uppercase" checked>包含大写字母 <span class="long-muted">A–Z</span></label>
        <label class="long-option"><input type="checkbox" id="numbers" checked>包含数字 <span class="long-muted">0–9</span></label>
        <label class="long-option"><input type="checkbox" id="symbols" checked>包含常用符号 <span class="long-muted">! @ # $ %</span></label>
      </div>

      <div class="long-result" id="password" tabindex="0" aria-label="生成的密码"></div>
      <div class="long-toolbar">
        <button class="long-button long-button--primary btn-primary" id="generateButton" type="button">生成新密码</button>
        <button class="long-button long-button--secondary btn-secondary" id="copyButton" type="button">复制密码</button>
        <span class="long-toolbar__spacer"></span>
        <span class="long-kbd">Ctrl Enter</span>
      </div>
      <div id="status" class="long-status" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script>
    const lower = 'abcdefghijklmnopqrstuvwxyz';
    const lengthInput = document.getElementById('length');
    const lengthValue = document.getElementById('lengthValue');
    const password = document.getElementById('password');
    const status = document.getElementById('status');
    const strength = document.getElementById('strength');

    function secureIndex(max) {
      const value = new Uint32Array(1);
      crypto.getRandomValues(value);
      return value[0] % max;
    }

    function generate() {
      let pool = lower;
      if (document.getElementById('uppercase').checked) pool += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      if (document.getElementById('numbers').checked) pool += '0123456789';
      if (document.getElementById('symbols').checked) pool += '!@#$%^&*()_+-=[]{}|;:,.<>?';
      const size = Number(lengthInput.value);
      let value = '';
      for (let index = 0; index < size; index++) value += pool[secureIndex(pool.length)];
      password.textContent = value;
      lengthValue.textContent = size;
      strength.textContent = size < 10 ? '基础' : size < 16 ? '良好' : '强';
      status.textContent = '';
      window.LongUI?.announce('新密码已生成');
    }

    async function copy() {
      if (!password.textContent) return;
      try {
        await long.clipboard.setText(password.textContent);
        status.textContent = '密码已复制到剪贴板';
        status.className = 'long-status long-status--success';
        window.LongUI?.announce(status.textContent);
      } catch (_) {
        status.textContent = '复制失败';
        status.className = 'long-status long-status--danger';
      }
    }

    lengthInput.addEventListener('input', generate);
    document.querySelectorAll('input[type="checkbox"]').forEach(function (item) { item.addEventListener('change', generate); });
    document.getElementById('generateButton').addEventListener('click', generate);
    document.getElementById('copyButton').addEventListener('click', copy);
    document.addEventListener('keydown', function (event) {
      if (event.ctrlKey && event.key === 'Enter') { event.preventDefault(); generate(); }
    });
    window.LongUI?.onCommand(function (command) {
      if (command.command_id === 'password.generate') generate();
    });
    generate();
  </script>
</body>
</html>
