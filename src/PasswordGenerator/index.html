<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>密码生成器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,system-ui,sans-serif;background:#f5f5f7;color:#1d1d1f;padding:20px}
h2{font-size:15px;margin-bottom:10px;color:#007AFF}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
label{font-size:12px;color:#888;display:flex;align-items:center;gap:6px;margin:6px 0}
input[type=range]{flex:1;margin-left:8px}
input[type=checkbox]{width:16px;height:16px}
.btn-row{display:flex;gap:8px;margin-top:10px}
button{padding:8px 16px;border:none;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer}
.btn-primary{background:#007AFF;color:#fff}.btn-primary:hover{background:#0062CC}
.btn-secondary{background:#f0f0f0;color:#333}.btn-secondary:hover{background:#e0e0e0}
.result{background:#1e1e2e;color:#a6e3a1;font-size:18px;font-family:'Cascadia Code',monospace;padding:12px;border-radius:8px;text-align:center;word-break:break-all;margin-top:8px;min-height:44px;display:flex;align-items:center;justify-content:center}
.strength{font-size:11px;margin-top:4px;text-align:center}
.strength.weak{color:#FF3B30}.strength.medium{color:#FF9500}.strength.strong{color:#34C759}
.opt-row{display:flex;justify-content:space-between;align-items:center;margin:4px 0}
.opt-row span{font-size:12px}
</style></head><body>
<h2>密码生成器</h2>
<div class="card">
  <div class="opt-row"><span>长度: <b id="lenVal">16</b></span></div>
  <input type="range" id="length" min="6" max="64" value="16" oninput="document.getElementById('lenVal').textContent=this.value;generate()">
  <label><input type="checkbox" id="upper" checked onchange="generate()"> 大写字母 (A-Z)</label>
  <label><input type="checkbox" id="numbers" checked onchange="generate()"> 数字 (0-9)</label>
  <label><input type="checkbox" id="symbols" checked onchange="generate()"> 符号 (!@#$%)</label>
  <div class="result" id="password"></div>
  <div class="strength" id="strength"></div>
  <div class="btn-row">
    <button class="btn-primary" onclick="generate()">生成新密码</button>
    <button class="btn-secondary" onclick="copyPwd()">复制</button>
  </div>
  <div id="status" style="font-size:11px;margin-top:6px;color:#34C759"></div>
</div>
<script>
var chars='abcdefghijklmnopqrstuvwxyz';
function generate(){
  var pool=chars;
  if(document.getElementById('upper').checked)pool+='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  if(document.getElementById('numbers').checked)pool+='0123456789';
  if(document.getElementById('symbols').checked)pool+='!@#$%^&*()_+-=[]{}|;:,.<>?';
  var len=parseInt(document.getElementById('length').value);
  var pwd='';for(var i=0;i<len;i++)pwd+=pool[Math.floor(Math.random()*pool.length)];
  document.getElementById('password').textContent=pwd;
  var s=document.getElementById('strength');
  if(len<10){s.textContent='弱';s.className='strength weak'}
  else if(len<16){s.textContent='中等';s.className='strength medium'}
  else{s.textContent='强';s.className='strength strong'}
}
async function copyPwd(){
  var p=document.getElementById('password').textContent;
  if(!p)return;
  await long.clipboard.setText(p);
  document.getElementById('status').textContent='已复制';setTimeout(function(){document.getElementById('status').textContent=''},2000);
}
generate();
</script></body></html>
