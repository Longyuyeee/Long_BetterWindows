<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>正则测试器</title></head>
<body>
  <main class="long-page">
    <header class="long-page-header"><div><div class="long-eyebrow">DEVELOPER TOOL</div><h1 class="long-page-title" data-i18n="page.title">正则测试器</h1><p class="long-page-description" data-i18n="page.description">使用 JavaScript 正则语法检查文本，展示匹配内容、位置和捕获组。</p></div><span class="long-badge" id="count">0 个匹配</span></header>
    <section class="long-stack" id="testerSection" aria-label="正则表达式测试器">
      <div class="long-grid"><div class="long-card long-field"><label class="long-field-label" for="pattern" data-i18n="field.pattern">表达式</label><input class="long-input" id="pattern" placeholder="例如 (Long)\\s+(Window)" autofocus></div><div class="long-card long-field"><label class="long-field-label" for="flags" data-i18n="field.flags">标志</label><input class="long-input" id="flags" value="gi" aria-describedby="flagHelp"><span class="long-muted" id="flagHelp" data-i18n="field.flagsHelp">常用：g 全局、i 忽略大小写、m 多行</span></div></div>
      <div class="long-card long-field"><label class="long-field-label" for="input" data-i18n="field.input">测试文本</label><textarea class="long-editor" id="input" placeholder="输入需要匹配的文本…"></textarea></div>
      <div class="long-toolbar"><button class="long-button long-button--primary btn-primary" id="testButton" type="button" data-i18n="action.test">开始匹配</button><button class="long-button long-button--secondary btn-secondary" id="pasteButton" type="button" data-i18n="action.paste">粘贴文本</button><span class="long-toolbar__spacer"></span><span class="long-kbd">Ctrl Enter</span></div>
      <div class="long-card"><div class="long-field-label" data-i18n="results.title">匹配结果</div><div class="long-list" id="matches"></div></div>
      <div id="status" class="long-status" role="status" aria-live="polite"></div>
    </section>
  </main>
  <script>
    const pattern = document.getElementById('pattern'); const flags = document.getElementById('flags'); const input = document.getElementById('input'); const matches = document.getElementById('matches'); const count = document.getElementById('count'); const status = document.getElementById('status'); const testButton = document.getElementById('testButton');
    let strings = {};
    let matchState = 'idle';
    let matchSnapshot = [];
    let matchErrorDetail = '';
    let matchRevision = 0;
    let activeWorker = null;
    let activeWorkerCancel = null;
    let currentStatus = { key: '', fallback: '', values: {}, kind: '' };

    function t(key, fallback, values) {
      const template = strings[key] || fallback || key;
      return Object.entries(values || {}).reduce(function (text, entry) {
        return text.replaceAll('{' + entry[0] + '}', String(entry[1]));
      }, template);
    }

    function setStatus(key, kind, fallback, values) {
      currentStatus = { key, kind, fallback, values: values || {} };
      const message = t(key, fallback, currentStatus.values);
      status.textContent = message;
      status.className = 'long-status ' + (kind ? 'long-status--' + kind : '');
      window.LongUI?.announce(message);
      return message;
    }

    function renderMatches() {
      matches.replaceChildren();
      if (matchState === 'idle') {
        count.textContent = t('count.matches', '{count} 个匹配', { count: 0 });
        window.LongUI?.renderState(matches, {
          kind: 'empty',
          title: t('state.waiting', '等待匹配'),
          detail: t('state.waitingDetail', '输入表达式和测试文本后开始匹配')
        });
        return;
      }
      if (matchState === 'error') {
        count.textContent = t('count.error', '表达式错误');
        window.LongUI?.renderState(matches, {
          kind: 'error',
          title: t('state.invalid', '正则表达式无效'),
          detail: matchErrorDetail
        });
        return;
      }
      count.textContent = t(
        'count.matches',
        '{count} 个匹配',
        { count: matchSnapshot.length });
      if (!matchSnapshot.length) {
        window.LongUI?.renderState(matches, {
          kind: 'empty',
          title: t('state.empty', '没有找到匹配内容'),
          detail: t('state.emptyDetail', '表达式有效，请检查测试文本或匹配条件')
        });
        return;
      }
      matchSnapshot.forEach(function (match, index) {
        const row = document.createElement('div');
        row.className = 'long-list-item';
        const content = document.createElement('div');
        content.className = 'long-list-item__content';
        const value = document.createElement('div');
        value.textContent = (index + 1) + '. ' + match.text;
        content.appendChild(value);
        match.groups.forEach(function (group, groupIndex) {
          const groupLine = document.createElement('div');
          groupLine.className = 'long-list-item__meta';
          const displayValue = group === null
            ? t('match.unmatched', '(未参与匹配)')
            : group === ''
              ? t('match.emptyGroup', '(空)')
              : group;
          groupLine.textContent = t(
            'match.groupValue',
            '捕获组 {index}：{value}',
            { index: groupIndex + 1, value: displayValue });
          content.appendChild(groupLine);
        });
        const meta = document.createElement('div');
        meta.className = 'long-list-item__meta';
        meta.textContent = t(
          'match.position',
          '位置 {index}',
          { index: match.index });
        if (match.groups.length > 0) {
          meta.textContent += ' · ' + t(
            'match.groups',
            '捕获组 {count}',
            { count: match.groups.length });
        }
        row.append(content, meta);
        matches.appendChild(row);
      });
    }

    function applyLocalization(message) {
      strings = message.resources || {};
      document.documentElement.lang = message.resolved_language || 'zh-CN';
      document.title = t('plugin.name', '正则测试器');
      document.querySelectorAll('[data-i18n]').forEach(function (element) {
        element.textContent = t(element.dataset.i18n, element.textContent);
      });
      document.getElementById('testerSection').setAttribute(
        'aria-label',
        t('tester.ariaLabel', '正则表达式测试器'));
      pattern.placeholder = t(
        'field.patternPlaceholder',
        '例如 (Long)\\s+(Window)');
      input.placeholder = t(
        'field.inputPlaceholder',
        '输入需要匹配的文本…');
      renderMatches();
      if (currentStatus.key) {
        setStatus(
          currentStatus.key,
          currentStatus.kind,
          currentStatus.fallback,
          currentStatus.values);
      }
    }

    function executeMatch(patternValue, flagsValue, inputValue) {
      const workerSource = `
        self.onmessage = function (event) {
          try {
            const normalizedFlags = event.data.flags.includes('g')
              ? event.data.flags
              : event.data.flags + 'g';
            const expression = new RegExp(event.data.pattern, normalizedFlags);
            const matches = [];
            for (const match of event.data.input.matchAll(expression)) {
              matches.push({
                text: match[0],
                index: match.index,
                groups: Array.from(match).slice(1).map(function (value) {
                  return value === undefined ? null : value;
                })
              });
              if (matches.length >= 200) break;
            }
            self.postMessage({ success: true, matches: matches });
          } catch (error) {
            self.postMessage({
              success: false,
              error: error && error.message ? error.message : String(error)
            });
          }
        };
      `;
      const workerUrl = URL.createObjectURL(new Blob(
        [workerSource],
        { type: 'text/javascript' }));
      const worker = new Worker(workerUrl);
      URL.revokeObjectURL(workerUrl);
      activeWorker = worker;
      return new Promise(function (resolve, reject) {
        const finish = function (callback, value) {
          clearTimeout(timeout);
          worker.terminate();
          if (activeWorker === worker) activeWorker = null;
          activeWorkerCancel = null;
          callback(value);
        };
        const timeout = setTimeout(function () {
          finish(reject, new Error(t(
            'error.timeout',
            '表达式执行超时，请缩小文本或简化表达式')));
        }, 750);
        worker.onmessage = function (event) {
          finish(resolve, event.data);
        };
        worker.onerror = function () {
          finish(reject, new Error(t('error.worker', '无法启动正则测试任务')));
        };
        activeWorkerCancel = function () {
          finish(reject, new Error('Match cancelled'));
        };
        worker.postMessage({
          pattern: patternValue,
          flags: flagsValue,
          input: inputValue
        });
      });
    }

    function cancelActiveMatch() {
      if (activeWorkerCancel) activeWorkerCancel();
      activeWorkerCancel = null;
      activeWorker = null;
    }

    async function test() {
      cancelActiveMatch();
      const revision = ++matchRevision;
      matchState = 'idle';
      matchSnapshot = [];
      matchErrorDetail = '';
      renderMatches();
      testButton.disabled = true;
      setStatus('status.matching', '', '正在匹配…');
      try {
        const result = await executeMatch(pattern.value, flags.value, input.value);
        if (revision !== matchRevision) return;
        if (!result.success) throw new Error(result.error);
        matchSnapshot = result.matches;
        matchState = 'success';
        matchErrorDetail = '';
        renderMatches();
        if (matchSnapshot.length) {
          setStatus('status.completed', 'success', '匹配完成');
        } else {
          setStatus('status.noMatches', 'success', '表达式有效，但没有匹配');
        }
      } catch (error) {
        if (revision !== matchRevision) return;
        matchState = 'error';
        matchSnapshot = [];
        matchErrorDetail = error && error.message ? error.message : String(error);
        renderMatches();
        setStatus(
          'error.expression',
          'danger',
          '正则表达式错误：{detail}',
          { detail: matchErrorDetail });
      } finally {
        if (revision === matchRevision) testButton.disabled = false;
      }
    }

    function resetResults() {
      matchRevision += 1;
      cancelActiveMatch();
      testButton.disabled = false;
      matchState = 'idle';
      matchSnapshot = [];
      matchErrorDetail = '';
      currentStatus = { key: '', fallback: '', values: {}, kind: '' };
      status.textContent = '';
      status.className = 'long-status';
      renderMatches();
    }

    async function paste() {
      try {
        const value = await long.clipboard.getText();
        if (value.success) {
          input.value = value.data || '';
          resetResults();
          if (!input.value) {
            setStatus('error.clipboardEmpty', 'danger', '剪贴板中没有文本内容');
          }
          input.focus();
        } else {
          setStatus('error.clipboardRead', 'danger', '无法读取剪贴板');
        }
      } catch (_) {
        setStatus('error.clipboardRead', 'danger', '无法读取剪贴板');
      }
    }
    [pattern, flags, input].forEach(function (field) {
      field.addEventListener('input', resetResults);
    });
    document.getElementById('testButton').addEventListener('click', test); document.getElementById('pasteButton').addEventListener('click', paste);
    document.addEventListener('keydown', function (event) { if (event.ctrlKey && event.key === 'Enter') { event.preventDefault(); test(); } });
    window.LongUI?.onCommand(function (command) {
      const text = window.LongUI.commandText(command);
      if (text) input.value = text;
      resetResults();
      pattern.focus();
      return {
        success: true,
        message: t('status.commandReady', '正则测试器已就绪'),
        outputs: {}
      };
    });
    window.chrome?.webview?.addEventListener('message', function ({ data }) {
      if (data?.type === 'long.language-changed') applyLocalization(data);
    });
    renderMatches();
  </script>
</body>
</html>
