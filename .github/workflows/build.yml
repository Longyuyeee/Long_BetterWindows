name: Repository CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  automated-closure:
    name: Automated closure
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdk/web/package-lock.json

      - name: Run repository automated closure
        shell: pwsh
        run: |
          ./invoke-automated-closure.ps1 `
            -Configuration Release `
            -OutputPath artifacts/quality/repository-ci/final-closure.json `
            -NoConsoleReport

      - name: Upload automated closure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repository-automated-closure
          path: artifacts/quality/repository-ci/final-closure.json
          if-no-files-found: error

      - name: Build LPWP reference widget
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "reference-widget-package"
          ./build-reference-widget.ps1 -OutputDir $output

      - name: Pack .NET SDK artifacts
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "plugin-sdk-packages"
          dotnet pack src/LongBetterWindows.PluginSdk/LongBetterWindows.PluginSdk.csproj --configuration Release --no-build --output $output
          dotnet pack src/LongBetterWindows.PluginIpc/LongBetterWindows.PluginIpc.csproj --configuration Release --no-build --output $output
          dotnet pack src/LongBetterWindows.PluginSdk.Wpf/LongBetterWindows.PluginSdk.Wpf.csproj --configuration Release --no-build --output $output
          dotnet pack sdk/dotnet/LongBetterWindows.PluginSdk.Testing/LongBetterWindows.PluginSdk.Testing.csproj --configuration Release --no-build --output $output

      - name: Upload SDK packages
        uses: actions/upload-artifact@v7
        with:
          name: plugin-sdk-packages
          path: ${{ runner.temp }}/plugin-sdk-packages/*.nupkg
          if-no-files-found: error

      - name: Upload LPWP reference widget
        uses: actions/upload-artifact@v7
        with:
          name: lpwp-reference-widget
          path: ${{ runner.temp }}/reference-widget-package/*.lpak
          if-no-files-found: error
